<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>資産分析・家計簿</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Noto Sans JP',sans-serif;background:#f0f7f2;color:#1a3325;min-height:100vh;}
    .header{background:linear-gradient(160deg,#c8efc8 0%,#8fcf8f 30%,#5db87a 60%,#3da060 100%);color:#fff;padding:16px 16px 28px;position:relative;overflow:hidden;}
    .header::before{content:'';position:absolute;top:-40px;left:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(255,255,255,0.35) 0%,transparent 70%);pointer-events:none;}
    .header::after{content:'';position:absolute;bottom:-60px;right:-30px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,255,255,0.18) 0%,transparent 70%);pointer-events:none;}
    .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;position:relative;z-index:1;}
    .back-btn{color:#fff;text-decoration:none;font-size:13px;opacity:0.9;background:rgba(255,255,255,0.2);padding:6px 14px;border-radius:20px;}
    .back-btn:hover{background:rgba(255,255,255,0.35);}
    .header-title{font-size:15px;font-weight:700;color:#fff;}
    .total-asset-label{font-size:12px;color:rgba(255,255,255,0.8);margin-bottom:6px;position:relative;z-index:1;}
    .total-asset-val{font-size:38px;font-weight:800;font-family:'Outfit',sans-serif;letter-spacing:-1px;color:#fff;position:relative;z-index:1;text-shadow:0 2px 8px rgba(0,0,0,0.1);}
    .total-asset-change{font-size:13px;margin-top:6px;color:rgba(255,255,255,0.9);position:relative;z-index:1;}
    .tab-nav{display:flex;background:#fff;border-bottom:1px solid #e0ede5;overflow-x:auto;}
    .tab-nav::-webkit-scrollbar{display:none;}
    .tn-item{flex:none;padding:14px 20px;font-size:13px;font-weight:600;color:#8aaa95;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;}
    .tn-item.active{color:#3da060;border-bottom-color:#3da060;}
    .tab-content{display:none;padding:16px;}
    .tab-content.active{display:block;}
    .card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 2px 16px rgba(61,160,96,0.08);margin-bottom:14px;border:1px solid rgba(61,160,96,0.07);}
    .card-title{font-size:13px;font-weight:700;color:#4a7c5f;margin-bottom:14px;}
    .sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
    .sum-item{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 12px rgba(61,160,96,0.08);border:1px solid rgba(61,160,96,0.08);}
    .sum-lbl{font-size:11px;color:#9ab5a5;margin-bottom:6px;}
    .sum-num{font-size:22px;font-weight:800;font-family:'Outfit',sans-serif;}
    .sum-num.green{color:#3da060;}.sum-num.red{color:#e05050;}.sum-num.teal{color:#2ba888;}.sum-num.sage{color:#6aaa7a;}
    .chart-area{position:relative;height:200px;}
    .asset-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f7f2;}
    .asset-item:last-child{border-bottom:none;}
    .asset-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
    .asset-name{flex:1;font-size:14px;font-weight:500;color:#1a3325;}
    .asset-val{font-size:14px;font-weight:700;font-family:'Outfit',sans-serif;color:#3da060;}
    .asset-pct{font-size:11px;color:#9ab5a5;min-width:36px;text-align:right;}
    .form-tabs{display:flex;gap:8px;margin-bottom:14px;}
    .ftab{flex:1;padding:10px 6px;border:2px solid #d0e8d8;border-radius:20px;background:#f5fbf7;font-size:13px;font-weight:600;cursor:pointer;color:#7aaa8a;text-align:center;}
    .ftab.active-inc{background:linear-gradient(135deg,#3da060,#5db87a);border-color:#3da060;color:#fff;}
    .ftab.active-exp{background:linear-gradient(135deg,#e05050,#f07070);border-color:#e05050;color:#fff;}
    .ftab.active-inv{background:linear-gradient(135deg,#2ba888,#3dc8a8);border-color:#2ba888;color:#fff;}
    .inp{width:100%;padding:12px 14px;border:1.5px solid #d0e8d8;border-radius:14px;font-size:14px;font-family:inherit;margin-bottom:10px;outline:none;background:#f5fbf7;color:#1a3325;}
    .inp:focus{border-color:#3da060;background:#fff;box-shadow:0 0 0 3px rgba(61,160,96,0.1);}
    .submit-btn{width:100%;padding:14px;border:none;border-radius:16px;font-size:15px;font-weight:700;cursor:pointer;color:#fff;font-family:inherit;}
    .submit-btn.inc{background:linear-gradient(135deg,#3da060,#5db87a);}
    .submit-btn.exp{background:linear-gradient(135deg,#e05050,#f07070);}
    .submit-btn.inv{background:linear-gradient(135deg,#2ba888,#3dc8a8);}
    .submit-btn.ast{background:linear-gradient(135deg,#4a7c5f,#6aaa7a);}
    .rec-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f0f7f2;}
    .rec-item:last-child{border-bottom:none;}
    .rec-icon{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
    .rec-icon.inc{background:#e8f7ee;}.rec-icon.exp{background:#fdeaea;}.rec-icon.inv{background:#e0f5ef;}
    .rec-body{flex:1;}
    .rec-name{font-size:14px;font-weight:600;color:#1a3325;}
    .rec-meta{font-size:11px;color:#9ab5a5;margin-top:2px;}
    .rec-amt{font-size:15px;font-weight:800;font-family:'Outfit',sans-serif;}
    .rec-amt.inc{color:#3da060;}.rec-amt.exp{color:#e05050;}.rec-amt.inv{color:#2ba888;}
    .rec-del{background:none;border:none;color:#c8ddd0;font-size:16px;cursor:pointer;padding:4px;}
    .rec-del:hover{color:#e05050;}
    .empty-state{text-align:center;padding:32px 16px;color:#b0ccba;font-size:14px;}
    .month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
    .mnav-btn{background:#e8f5ee;border:none;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;color:#3da060;display:flex;align-items:center;justify-content:center;}
    .mnav-btn:hover{background:#d0ecd8;}
    .mnav-lbl{font-size:16px;font-weight:700;color:#1a3325;}
  
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:14px;}
    .cal-head{text-align:center;font-size:11px;font-weight:700;color:#8aaa95;padding:6px 0;}
    .cal-head.sun{color:#e05050;}.cal-head.sat{color:#3da060;}
    .cal-day{text-align:center;padding:6px 2px;border-radius:10px;cursor:pointer;min-height:44px;position:relative;background:#fff;border:1px solid #edf5f0;transition:all 0.15s;}
    .cal-day:hover{background:#e8f5ee;}
    .cal-day.empty{background:transparent;border:none;cursor:default;}
    .cal-day.today{background:#3da060;color:#fff;font-weight:700;}
    .cal-day.today .cal-day-num{color:#fff;}
    .cal-day.has-data::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:#f0b86a;}
    .cal-day.today.has-data::after{background:#fff;}
    .cal-day-num{font-size:13px;font-weight:600;color:#1a3325;}
    .cal-day.sun .cal-day-num{color:#e05050;}
    .cal-day.sat .cal-day-num{color:#3da060;}
    .cal-day.today .cal-day-num{color:#fff;}
    .cal-day-total{font-size:9px;color:#e05050;margin-top:1px;}
    .cal-day.today .cal-day-total{color:rgba(255,255,255,0.85);}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:1000;align-items:flex-end;}
    .modal-overlay.open{display:flex;}
    .modal-box{background:#fff;border-radius:24px 24px 0 0;padding:20px 16px 32px;width:100%;max-height:85vh;overflow-y:auto;}
    .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
    .modal-title{font-size:16px;font-weight:700;color:#1a3325;}
    .modal-close{background:#f0f7f2;border:none;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;color:#4a7c5f;display:flex;align-items:center;justify-content:center;}
    .modal-close:hover{background:#d0ecd8;}
    .day-rec-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f7f2;}
    .day-rec-item:last-child{border-bottom:none;}
    .day-rec-cat{font-size:11px;color:#9ab5a5;margin-top:2px;}
    .day-rec-del{background:none;border:none;color:#c8ddd0;font-size:15px;cursor:pointer;}
    .day-rec-del:hover{color:#e05050;}
    .modal-form-title{font-size:13px;font-weight:700;color:#4a7c5f;margin-bottom:10px;}
    .type-tabs{display:flex;gap:6px;margin-bottom:12px;}
    .type-tab{flex:1;padding:8px 4px;border:1.5px solid #d0e8d8;border-radius:16px;background:#f5fbf7;font-size:12px;font-weight:600;cursor:pointer;color:#7aaa8a;text-align:center;}
    .type-tab.sel-inc{background:linear-gradient(135deg,#3da060,#5db87a);border-color:#3da060;color:#fff;}
    .type-tab.sel-exp{background:linear-gradient(135deg,#e05050,#f07070);border-color:#e05050;color:#fff;}
    .type-tab.sel-inv{background:linear-gradient(135deg,#2ba888,#3dc8a8);border-color:#2ba888;color:#fff;}
  </style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <a href="/" class="back-btn">← ホーム</a>
    <span class="header-title">💼 資産分析</span>
    <div style="width:72px"></div>
  </div>
  <div class="total-asset-label">総資産</div>
  <div class="total-asset-val" id="totalAssetVal">¥0</div>
  <div class="total-asset-change" id="totalAssetChange">資産を登録してください</div>
</div>
<div class="tab-nav">
  <div class="tn-item active" onclick="switchTab('dashboard')">ダッシュボード</div>
  <div class="tn-item" onclick="switchTab('cashflow')">収支管理</div>
  <div class="tn-item" onclick="switchTab('assets')">資産管理</div>
  <div class="tn-item" onclick="switchTab('records')">記録一覧</div>
  <div class="tn-item" onclick="switchTab('calendar')">📅 カレンダー</div>
</div>
<div class="tab-content active" id="tab-dashboard">
  <div class="month-nav"><button class="mnav-btn" onclick="changeMonth(-1)">◀</button><div class="mnav-lbl" id="monthLabel2"></div><button class="mnav-btn" onclick="changeMonth(1)">▶</button></div>
  <div class="sum-grid">
    <div class="sum-item"><div class="sum-lbl">💰 今月収入</div><div class="sum-num green" id="d-income">¥0</div></div>
    <div class="sum-item"><div class="sum-lbl">💸 今月支出</div><div class="sum-num red" id="d-expense">¥0</div></div>
    <div class="sum-item"><div class="sum-lbl">📊 収支残</div><div class="sum-num teal" id="d-balance">¥0</div></div>
    <div class="sum-item"><div class="sum-lbl">📈 今月投資</div><div class="sum-num sage" id="d-invest">¥0</div></div>
  </div>
  <div class="card"><div class="card-title">📊 月別収支グラフ（過去6ヶ月）</div><div class="chart-area"><canvas id="barChart"></canvas></div></div>
  <div class="card"><div class="card-title">🥧 今月の支出内訳</div><div style="display:flex;gap:16px;align-items:center"><div style="flex:1;max-width:160px"><canvas id="donutChart"></canvas></div><div id="donut-legend" style="flex:1;font-size:12px"></div></div></div>
</div>
<div class="tab-content" id="tab-cashflow">
  <div class="month-nav"><button class="mnav-btn" onclick="changeMonth(-1)">◀</button><div class="mnav-lbl" id="monthLabel3"></div><button class="mnav-btn" onclick="changeMonth(1)">▶</button></div>
  <div class="card">
    <div class="form-tabs">
      <button class="ftab active-inc" id="ft-inc" onclick="switchForm('inc')">💰 収入</button>
      <button class="ftab" id="ft-exp" onclick="switchForm('exp')">💸 支出</button>
      <button class="ftab" id="ft-inv" onclick="switchForm('inv')">📈 投資</button>
    </div>
    <div id="form-inc"><input class="inp" id="inc-name" type="text" placeholder="項目名（例：給与）"><input class="inp" id="inc-amount" type="number" placeholder="金額（円）"><button class="submit-btn inc" onclick="addRecord('inc')">＋ 収入を追加</button></div>
    <div id="form-exp" style="display:none"><input class="inp" id="exp-name" type="text" placeholder="項目名（例：食費）"><select class="inp" id="exp-cat"><option value="食費">🍱 食費</option><option value="住居">🏠 住居費</option><option value="交通">🚃 交通費</option><option value="光熱費">💡 光熱費</option><option value="通信費">📱 通信費</option><option value="娯楽">🎮 娯楽</option><option value="医療">🏥 医療</option><option value="衣類">👕 衣類</option><option value="教育">📚 教育</option><option value="その他">📦 その他</option></select><input class="inp" id="exp-amount" type="number" placeholder="金額（円）"><button class="submit-btn exp" onclick="addRecord('exp')">＋ 支出を追加</button></div>
    <div id="form-inv" style="display:none"><input class="inp" id="inv-name" type="text" placeholder="銘柄・ファンド名"><select class="inp" id="inv-cat"><option value="国内株">🇯🇵 国内株</option><option value="米国株">🇺🇸 米国株</option><option value="投資信託">📦 投資信託</option><option value="ETF">📊 ETF</option><option value="債券">📄 債券</option><option value="仮想通貨">🪙 仮想通貨</option><option value="その他">💡 その他</option></select><input class="inp" id="inv-amount" type="number" placeholder="金額（円）"><button class="submit-btn inv" onclick="addRecord('inv')">＋ 投資を追加</button></div>
  </div>
  <div class="card"><div class="card-title">📈 収支推移（折れ線グラフ）</div><div class="chart-area"><canvas id="lineChart"></canvas></div></div>
</div>
<div class="tab-content" id="tab-assets">
  <div class="card"><div class="card-title">🏦 資産を登録</div><input class="inp" id="ast-name" type="text" placeholder="資産名（例：現金、日本株）"><select class="inp" id="ast-cat"><option value="現金">💴 現金・預金</option><option value="国内株">🇯🇵 国内株</option><option value="米国株">🇺🇸 米国株</option><option value="投資信託">📦 投資信託</option><option value="ETF">📊 ETF</option><option value="債券">📄 債券</option><option value="不動産">🏠 不動産</option><option value="仮想通貨">🪙 仮想通貨</option><option value="その他">💡 その他</option></select><input class="inp" id="ast-amount" type="number" placeholder="評価額（円）"><button class="submit-btn ast" onclick="addRecord('ast')">＋ 資産を登録</button></div>
  <div class="card"><div class="card-title">🥧 資産配分グラフ</div><div style="display:flex;gap:16px;align-items:center"><div style="flex:1;max-width:160px"><canvas id="assetPieChart"></canvas></div><div id="asset-legend" style="flex:1;font-size:12px"></div></div></div>
  <div class="card"><div class="card-title">📋 資産一覧</div><div id="asset-list-el"><div class="empty-state">資産を登録してください</div></div></div>
</div>
<div class="tab-content" id="tab-records">
  <div class="month-nav"><button class="mnav-btn" onclick="changeMonth(-1)">◀</button><div class="mnav-lbl" id="monthLabel4"></div><button class="mnav-btn" onclick="changeMonth(1)">▶</button></div>
  <div class="card"><div id="rec-list-el"><div class="empty-state">記録がありません</div></div></div>
</div>

<div class="tab-content" id="tab-calendar">
  <div class="month-nav"><button class="mnav-btn" onclick="calChangeMonth(-1)">◀</button><div class="mnav-lbl" id="calMonthLabel"></div><button class="mnav-btn" onclick="calChangeMonth(1)">▶</button></div>
  <div class="card" style="padding:12px"><div class="cal-grid" id="calGrid"></div></div>
  <div class="card"><div class="card-title">📊 今月のカテゴリ別支出</div><div id="calCatSummary"><div class="empty-state">支出を入力するとここに表示されます</div></div></div>
</div>
<div class="modal-overlay" id="dayModal" onclick="closeDayModal(event)">
  <div class="modal-box">
    <div class="modal-header"><div class="modal-title" id="modalDateTitle"></div><button class="modal-close" onclick="closeDayModalBtn()">✕</button></div>
    <div id="dayRecList"></div>
    <div class="modal-form-title" style="margin-top:12px">＋ 記録を追加</div>
    <div class="type-tabs"><button class="type-tab sel-inc" id="mft-inc" onclick="switchModalForm('inc')">💰 収入</button><button class="type-tab" id="mft-exp" onclick="switchModalForm('exp')">💸 支出</button><button class="type-tab" id="mft-inv" onclick="switchModalForm('inv')">📈 投資</button></div>
    <div id="modal-form-inc"><input class="inp" id="m-inc-name" type="text" placeholder="項目名（例：給与）"><input class="inp" id="m-inc-amount" type="number" placeholder="金額（円）"><button class="submit-btn inc" onclick="addDayRecord('inc')">＋ 収入を追加</button></div>
    <div id="modal-form-exp" style="display:none"><input class="inp" id="m-exp-name" type="text" placeholder="項目名（例：ランチ代）"><select class="inp" id="m-exp-cat"><option value="食費">🍱 食費</option><option value="住居">🏠 住居費</option><option value="交通">🚃 交通費</option><option value="光熱費">💡 光熱費</option><option value="通信費">📱 通信費</option><option value="娯楽">🎮 娯楽</option><option value="医療">🏥 医療</option><option value="衣類">👕 衣類</option><option value="教育">📚 教育</option><option value="その他">📦 その他</option></select><input class="inp" id="m-exp-amount" type="number" placeholder="金額（円）"><button class="submit-btn exp" onclick="addDayRecord('exp')">＋ 支出を追加</button></div>
    <div id="modal-form-inv" style="display:none"><input class="inp" id="m-inv-name" type="text" placeholder="銘柄・ファンド名"><select class="inp" id="m-inv-cat"><option value="国内株">🇯🇵 国内株</option><option value="米国株">🇺🇸 米国株</option><option value="投資信託">📦 投資信託</option><option value="ETF">📊 ETF</option><option value="仮想通貨">🪙 仮想通貨</option><option value="その他">💡 その他</option></select><input class="inp" id="m-inv-amount" type="number" placeholder="金額（円）"><button class="submit-btn inv" onclick="addDayRecord('inv')">＋ 投資を追加</button></div>
  </div>
</div>

<script>
var _year=new Date().getFullYear(),_month=new Date().getMonth()+1,_charts={},_currentForm='inc';
var CAT_COLORS={'食費':'#e8856a','住居':'#6ab88a','交通':'#5ab8a0','光熱費':'#f0b86a','通信費':'#8aaa7a','娯楽':'#7ab0d8','医療':'#d8808a','衣類':'#a89870','教育':'#90a878','その他':'#b0c8b8','現金':'#5db87a','国内株':'#e8856a','米国株':'#6ab88a','投資信託':'#f0b86a','ETF':'#8aaa7a','債券':'#7ab0d8','不動産':'#a89870','仮想通貨':'#c8b86a'};
function getKey(y,m){return 'kb2_'+(y||_year)+'_'+((m||_month)<10?'0'+(m||_month):(m||_month));}
function getData(y,m){return JSON.parse(localStorage.getItem(getKey(y,m))||'[]');}
function saveData(d,y,m){localStorage.setItem(getKey(y,m),JSON.stringify(d));}
function getAssets(){return JSON.parse(localStorage.getItem('kb2_assets')||'[]');}
function saveAssets(d){localStorage.setItem('kb2_assets',JSON.stringify(d));}
function fmt(n){return '¥'+Number(n||0).toLocaleString();}
function changeMonth(d){_month+=d;if(_month>12){_month=1;_year++;}if(_month<1){_month=12;_year--;}
var _calYear=new Date().getFullYear(),_calMonth=new Date().getMonth()+1,_modalDate=null,_modalForm='inc';
function calChangeMonth(d){_calMonth+=d;if(_calMonth>12){_calMonth=1;_calYear++;}if(_calMonth<1){_calMonth=12;_calYear--;}renderCalendar();}
function getDayKey(y,m,day){return 'kbday_'+y+'_'+(m<10?'0'+m:m)+'_'+(day<10?'0'+day:day);}
function getDayData(y,m,day){return JSON.parse(localStorage.getItem(getDayKey(y,m,day))||'[]');}
function saveDayData(y,m,day,d){localStorage.setItem(getDayKey(y,m,day),JSON.stringify(d));}
function renderCalendar(){
  var lbl=_calYear+'年'+_calMonth+'月';
  var cl=document.getElementById('calMonthLabel');if(cl)cl.textContent=lbl;
  var grid=document.getElementById('calGrid');if(!grid)return;
  var dnames=['日','月','火','水','木','金','土'];
  var heads=dnames.map(function(d,i){return '<div class="cal-head'+(i===0?' sun':i===6?' sat':'')+'">'+ d+'</div>';}).join('');
  var firstDay=new Date(_calYear,_calMonth-1,1).getDay();
  var lastDate=new Date(_calYear,_calMonth,0).getDate();
  var today=new Date();
  var cells='';
  for(var i=0;i<firstDay;i++) cells+='<div class="cal-day empty"></div>';
  for(var dd=1;dd<=lastDate;dd++){
    var dayData=getDayData(_calYear,_calMonth,dd);
    var isToday=today.getFullYear()===_calYear&&today.getMonth()+1===_calMonth&&today.getDate()===dd;
    var hasData=dayData.length>0;
    var totalExp=dayData.filter(function(e){return e.type==='exp';}).reduce(function(s,e){return s+e.amount;},0);
    var dow=(firstDay+dd-1)%7;
    var cls='cal-day'+(isToday?' today':'')+(hasData?' has-data':'')+(dow===0?' sun':dow===6?' sat':'');
    cells+='<div class="'+cls+'" onclick="openDayModal('+_calYear+','+_calMonth+','+dd+')"><div class="cal-day-num">'+dd+'</div>'+(totalExp>0?'<div class="cal-day-total">-'+(totalExp>=10000?Math.floor(totalExp/10000)+'万':totalExp)+'</div>':'')+'</div>';
  }
  grid.innerHTML=heads+cells;
  var catTotals={};
  for(var d2=1;d2<=lastDate;d2++){getDayData(_calYear,_calMonth,d2).filter(function(e){return e.type==='exp';}).forEach(function(e){var c=e.cat||'その他';catTotals[c]=(catTotals[c]||0)+e.amount;});}
  var catEl=document.getElementById('calCatSummary');
  if(catEl){var cats=Object.keys(catTotals);var total=cats.reduce(function(s,c){return s+catTotals[c];},0);catEl.innerHTML=cats.length===0?'<div class="empty-state">支出を入力するとここに表示されます</div>':'<div style="margin-bottom:12px;font-size:13px;font-weight:700;color:#1a3325">合計: '+fmt(total)+'</div>'+cats.sort(function(a,b){return catTotals[b]-catTotals[a];}).map(function(c){var pct=Math.round(catTotals[c]/total*100);var col=CAT_COLORS[c]||'#b0c8b8';return '<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:13px;color:#1a3325">'+c+'</span><span style="font-size:13px;font-weight:700;color:#e05050">'+fmt(catTotals[c])+'</span></div><div style="height:8px;background:#f0f7f2;border-radius:4px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+col+';border-radius:4px;transition:width 0.4s"></div></div><div style="font-size:11px;color:#9ab5a5;margin-top:2px">'+pct+'%</div></div>';}).join('');}
}
function openDayModal(y,m,day){_modalDate={y:y,m:m,day:day};var tEl=document.getElementById('modalDateTitle');if(tEl)tEl.textContent=y+'年'+m+'月'+day+'日';renderDayModal();var modal=document.getElementById('dayModal');if(modal)modal.classList.add('open');}
function closeDayModal(e){if(e.target===document.getElementById('dayModal'))closeDayModalBtn();}
function closeDayModalBtn(){var modal=document.getElementById('dayModal');if(modal)modal.classList.remove('open');renderCalendar();}
function switchModalForm(f){_modalForm=f;['inc','exp','inv'].forEach(function(t){var form=document.getElementById('modal-form-'+t);if(form)form.style.display=t===f?'':'none';var btn=document.getElementById('mft-'+t);if(btn)btn.className='type-tab'+(t===f?' sel-'+t:'');});}
function addDayRecord(type){if(!_modalDate)return;var name,amount,cat='';if(type==='inc'){name=document.getElementById('m-inc-name').value.trim();amount=parseInt(document.getElementById('m-inc-amount').value)||0;if(!name||!amount){alert('入力してください');return;}document.getElementById('m-inc-name').value='';document.getElementById('m-inc-amount').value='';}else if(type==='exp'){name=document.getElementById('m-exp-name').value.trim();cat=document.getElementById('m-exp-cat').value;amount=parseInt(document.getElementById('m-exp-amount').value)||0;if(!name||!amount){alert('入力してください');return;}document.getElementById('m-exp-name').value='';document.getElementById('m-exp-amount').value='';}else if(type==='inv'){name=document.getElementById('m-inv-name').value.trim();cat=document.getElementById('m-inv-cat').value;amount=parseInt(document.getElementById('m-inv-amount').value)||0;if(!name||!amount){alert('入力してください');return;}document.getElementById('m-inv-name').value='';document.getElementById('m-inv-amount').value='';}var data=getDayData(_modalDate.y,_modalDate.m,_modalDate.day);data.push({id:Date.now(),type:type,name:name,cat:cat,amount:amount});saveDayData(_modalDate.y,_modalDate.m,_modalDate.day,data);renderDayModal();}
function deleteDayRecord(id){if(!_modalDate)return;var data=getDayData(_modalDate.y,_modalDate.m,_modalDate.day).filter(function(e){return e.id!==id;});saveDayData(_modalDate.y,_modalDate.m,_modalDate.day,data);renderDayModal();}
function renderDayModal(){if(!_modalDate)return;var data=getDayData(_modalDate.y,_modalDate.m,_modalDate.day);var listEl=document.getElementById('dayRecList');if(!listEl)return;var icons={inc:'💰',exp:'💸',inv:'📈'};var sign={inc:'+',exp:'-',inv:'-'};var amtCls={inc:'color:#3da060',exp:'color:#e05050',inv:'color:#2ba888'};listEl.innerHTML=data.length===0?'<div class="empty-state" style="padding:12px 0">まだ記録がありません</div>':data.map(function(e){var sub=e.cat||(e.type==='inc'?'収入':'支出');return '<div class="day-rec-item"><div style="font-size:20px">'+(icons[e.type]||'📦')+'</div><div style="flex:1"><div style="font-size:14px;font-weight:600;color:#1a3325">'+e.name+'</div><div class="day-rec-cat">'+sub+'</div></div><div style="font-size:14px;font-weight:800;font-family:Outfit,sans-serif;'+amtCls[e.type]+'">'+(sign[e.type]||'')+fmt(e.amount)+'</div><button class="day-rec-del" onclick="deleteDayRecord('+e.id+')">✕</button></div>';}).join('');}

renderAll();}
function switchTab(tab){document.querySelectorAll('.tn-item').forEach(function(el,i){el.classList.toggle('active',['dashboard','cashflow','assets','records','calendar'][i]===tab);});document.querySelectorAll('.tab-content').forEach(function(el){el.classList.remove('active');});var el=document.getElementById('tab-'+tab);if(el)el.classList.add('active');renderAll();}
function switchForm(f){_currentForm=f;['inc','exp','inv'].forEach(function(t){document.getElementById('form-'+t).style.display=t===f?'':'none';var btn=document.getElementById('ft-'+t);btn.className='ftab'+(t===f?' active-'+t:'');});}
function addRecord(type){var name,amount,cat='';if(type==='inc'){name=document.getElementById('inc-name').value.trim();amount=parseInt(document.getElementById('inc-amount').value)||0;if(!name||!amount){alert('入力してください');return;}document.getElementById('inc-name').value='';document.getElementById('inc-amount').value='';}else if(type==='exp'){name=document.getElementById('exp-name').value.trim();cat=document.getElementById('exp-cat').value;amount=parseInt(document.getElementById('exp-amount').value)||0;if(!name||!amount){alert('入力してください');return;}document.getElementById('exp-name').value='';document.getElementById('exp-amount').value='';}else if(type==='inv'){name=document.getElementById('inv-name').value.trim();cat=document.getElementById('inv-cat').value;amount=parseInt(document.getElementById('inv-amount').value)||0;if(!name||!amount){alert('入力してください');return;}document.getElementById('inv-name').value='';document.getElementById('inv-amount').value='';}else if(type==='ast'){name=document.getElementById('ast-name').value.trim();cat=document.getElementById('ast-cat').value;amount=parseInt(document.getElementById('ast-amount').value)||0;if(!name||!amount){alert('入力してください');return;}document.getElementById('ast-name').value='';document.getElementById('ast-amount').value='';var assets=getAssets();assets.push({id:Date.now(),name:name,cat:cat,amount:amount});saveAssets(assets);renderAll();return;}var data=getData();data.push({id:Date.now(),type:type,name:name,cat:cat,amount:amount});saveData(data);renderAll();}
function deleteRecord(id){saveData(getData().filter(function(e){return e.id!==id;}));renderAll();}
function deleteAsset(id){saveAssets(getAssets().filter(function(e){return e.id!==id;}));renderAll();}
function renderAll(){
  var data=getData(),assets=getAssets();
  var lbl=_year+'年'+_month+'月';
  ['monthLabel2','monthLabel3','monthLabel4'].forEach(function(id){var el=document.getElementById(id);if(el)el.textContent=lbl;});
  var totalInc=0,totalExp=0,totalInv=0;
  data.forEach(function(e){if(e.type==='inc')totalInc+=e.amount;else if(e.type==='exp')totalExp+=e.amount;else if(e.type==='inv')totalInv+=e.amount;});
  var balance=totalInc-totalExp-totalInv;
  var di=document.getElementById('d-income');if(di)di.textContent=fmt(totalInc);
  var de=document.getElementById('d-expense');if(de)de.textContent=fmt(totalExp);
  var db=document.getElementById('d-balance');if(db){db.textContent=fmt(balance);db.className='sum-num '+(balance>=0?'teal':'red');}
  var dv=document.getElementById('d-invest');if(dv)dv.textContent=fmt(totalInv);
  var totalAst=assets.reduce(function(s,e){return s+e.amount;},0);
  var tv=document.getElementById('totalAssetVal');if(tv)tv.textContent=fmt(totalAst);
  var tc=document.getElementById('totalAssetChange');if(tc)tc.textContent=totalAst>0?'登録資産 '+assets.length+'件 ｜ 今月収支 '+fmt(balance):'資産を登録してください';
  var months=[],incArr=[],expArr=[],invArr=[];
  for(var i=5;i>=0;i--){var m=_month-i,y=_year;if(m<1){m+=12;y--;}months.push((m<10?'0'+m:m)+'月');var d=getData(y,m);var a=0,b=0,c=0;d.forEach(function(e){if(e.type==='inc')a+=e.amount;else if(e.type==='exp')b+=e.amount;else if(e.type==='inv')c+=e.amount;});incArr.push(a);expArr.push(b);invArr.push(c);}
  if(_charts.bar){_charts.bar.destroy();}
  var bc=document.getElementById('barChart');
  if(bc){_charts.bar=new Chart(bc.getContext('2d'),{type:'bar',data:{labels:months,datasets:[{label:'収入',data:incArr,backgroundColor:'rgba(93,184,122,0.75)',borderRadius:6},{label:'支出',data:expArr,backgroundColor:'rgba(224,80,80,0.7)',borderRadius:6},{label:'投資',data:invArr,backgroundColor:'rgba(43,168,136,0.7)',borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{family:'Noto Sans JP'},boxWidth:10,padding:10,color:'#4a7c5f'}}},scales:{x:{grid:{display:false},ticks:{font:{size:11},color:'#7aaa8a'}},y:{grid:{color:'#edf5f0'},ticks:{callback:function(v){return v>=10000?Math.floor(v/10000)+'万':'¥'+v;},font:{size:10},color:'#7aaa8a'}}}}});}
  if(_charts.line){_charts.line.destroy();}
  var lc=document.getElementById('lineChart');
  if(lc){_charts.line=new Chart(lc.getContext('2d'),{type:'line',data:{labels:months,datasets:[{label:'収入',data:incArr,borderColor:'#3da060',backgroundColor:'rgba(93,184,122,0.1)',fill:true,tension:0.4,pointRadius:5,pointBackgroundColor:'#3da060',borderWidth:2.5},{label:'支出',data:expArr,borderColor:'#e05050',backgroundColor:'rgba(224,80,80,0.07)',fill:true,tension:0.4,pointRadius:5,pointBackgroundColor:'#e05050',borderWidth:2.5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{family:'Noto Sans JP'},boxWidth:10,padding:10,color:'#4a7c5f'}}},scales:{x:{grid:{display:false},ticks:{font:{size:11},color:'#7aaa8a'}},y:{grid:{color:'#edf5f0'},ticks:{callback:function(v){return v>=10000?Math.floor(v/10000)+'万':'¥'+v;},font:{size:10},color:'#7aaa8a'}}}}});}
  var catMap={};data.filter(function(e){return e.type==='exp';}).forEach(function(e){var c=e.cat||'その他';catMap[c]=(catMap[c]||0)+e.amount;});
  var dLabels=Object.keys(catMap),dVals=dLabels.map(function(c){return catMap[c];}),dColors=dLabels.map(function(c){return CAT_COLORS[c]||'#b0c8b8';});
  if(_charts.donut){_charts.donut.destroy();}
  var dc=document.getElementById('donutChart');
  if(dc){if(dVals.length>0){_charts.donut=new Chart(dc.getContext('2d'),{type:'doughnut',data:{labels:dLabels,datasets:[{data:dVals,backgroundColor:dColors,borderWidth:3,borderColor:'#fff'}]},options:{responsive:true,plugins:{legend:{display:false}},cutout:'65%'}});var dl=document.getElementById('donut-legend');if(dl){var total=dVals.reduce(function(a,b){return a+b;},0);dl.innerHTML=dLabels.map(function(c,i){return '<div style="display:flex;align-items:center;gap:5px;margin-bottom:7px"><span style="width:8px;height:8px;border-radius:50%;background:'+dColors[i]+';display:inline-block;flex-shrink:0"></span><span style="flex:1;color:#4a7c5f">'+c+'</span><span style="font-weight:700;color:#1a3325">'+Math.round(dVals[i]/total*100)+'%</span></div>';}).join('');}}else{var dp=dc.parentElement;if(dp)dp.innerHTML='<div class="empty-state">支出を入力するとグラフが表示されます</div>';}}
  var astCatMap={};assets.forEach(function(a){var c=a.cat||'その他';astCatMap[c]=(astCatMap[c]||0)+a.amount;});
  var aLabels=Object.keys(astCatMap),aVals=aLabels.map(function(c){return astCatMap[c];}),aColors=aLabels.map(function(c){return CAT_COLORS[c]||'#b0c8b8';});
  if(_charts.pie){_charts.pie.destroy();}
  var pc=document.getElementById('assetPieChart');
  if(pc){if(aVals.length>0){_charts.pie=new Chart(pc.getContext('2d'),{type:'doughnut',data:{labels:aLabels,datasets:[{data:aVals,backgroundColor:aColors,borderWidth:3,borderColor:'#fff'}]},options:{responsive:true,plugins:{legend:{display:false}},cutout:'60%'}});var al=document.getElementById('asset-legend');if(al){var total2=aVals.reduce(function(a,b){return a+b;},0);al.innerHTML=aLabels.map(function(c,i){return '<div style="display:flex;align-items:center;gap:5px;margin-bottom:7px"><span style="width:8px;height:8px;border-radius:50%;background:'+aColors[i]+';display:inline-block;flex-shrink:0"></span><span style="flex:1;color:#4a7c5f">'+c+'</span><span style="font-weight:700;color:#1a3325">'+Math.round(aVals[i]/total2*100)+'%</span></div>';}).join('');}}else{var al2=document.getElementById('asset-legend');if(al2)al2.innerHTML='<div class="empty-state">資産を登録するとグラフが表示されます</div>';}}
  var astEl=document.getElementById('asset-list-el');
  if(astEl){var total3=assets.reduce(function(s,e){return s+e.amount;},0);astEl.innerHTML=assets.length===0?'<div class="empty-state">資産を登録してください</div>':assets.map(function(a){var pct=total3>0?Math.round(a.amount/total3*100):0;var col=CAT_COLORS[a.cat]||'#b0c8b8';return '<div class="asset-item"><span class="asset-dot" style="background:'+col+'"></span><span class="asset-name">'+a.name+'<br><span style="font-size:11px;color:#9ab5a5">'+a.cat+'</span></span><div style="text-align:right"><div class="asset-val">'+fmt(a.amount)+'</div><div class="asset-pct">'+pct+'%</div></div><button class="rec-del" onclick="deleteAsset('+a.id+')">✕</button></div>';}).join('');}
  var recEl=document.getElementById('rec-list-el');
  if(recEl){var sorted=data.slice().reverse();var icons={inc:'💰',exp:'💸',inv:'📈'};var sign={inc:'+',exp:'-',inv:'-'};recEl.innerHTML=sorted.length===0?'<div class="empty-state">この月の記録はありません</div>':sorted.map(function(e){var sub=e.cat||(e.type==='inc'?'収入':'支出');return '<div class="rec-item"><div class="rec-icon '+e.type+'">'+(icons[e.type]||'📦')+'</div><div class="rec-body"><div class="rec-name">'+e.name+'</div><div class="rec-meta">'+sub+'</div></div><div class="rec-amt '+e.type+'">'+(sign[e.type]||'')+fmt(e.amount)+'</div><button class="rec-del" onclick="deleteRecord('+e.id+')">✕</button></div>';}).join('');}
}
if(typeof Chart!=="undefined"){renderAll();}else{var _chartJsScript=document.querySelector('script[src*="chart.js"]');if(_chartJsScript){_chartJsScript.addEventListener("load",function(){renderAll();});}else{window.addEventListener("load",function(){renderAll();});}}
</script>
