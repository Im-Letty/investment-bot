<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>資産分析・家計簿</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
:root{
  --brand-color:#3da060;
  --brand-dark:#2d7a4f;
  --brand-light:#5db87a;
  --brand-lighter:#66bb6a;
  --brand-darker:#1e5c20;
  --brand-deep:#2e7d32;
  --brand-pale:#c8efc8;
  --brand-soft:#8fcf8f;
  --brand-mist:#e8f5ee;
  --brand-haze:#f5fbf7;
}

    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Noto Sans JP',sans-serif;background:var(--brand-haze);color:#1a3325;min-height:100vh;}
    .header{background:linear-gradient(160deg,var(--brand-pale) 0%,var(--brand-soft) 30%,var(--brand-light) 60%,var(--brand-color) 100%);color:#fff;padding:16px 16px 28px;position:relative;overflow:hidden;}
    .header::before{content:'';position:absolute;top:-40px;left:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(255,255,255,0.35) 0%,transparent 70%);pointer-events:none;}
    .header::after{content:'';position:absolute;bottom:-60px;right:-30px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,255,255,0.18) 0%,transparent 70%);pointer-events:none;}
    .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;position:relative;z-index:1;}
    .back-btn{color:#fff;text-decoration:none;font-size:13px;opacity:0.9;background:rgba(255,255,255,0.2);padding:6px 14px;border-radius:20px;}
    .back-btn:hover{background:rgba(255,255,255,0.35);}
    .header-title{font-size:15px;font-weight:700;color:#fff;}
    .total-asset-label{font-size:12px;color:rgba(255,255,255,0.8);margin-bottom:6px;position:relative;z-index:1;}
    .total-asset-val{font-size:38px;font-weight:800;font-family:'Outfit',sans-serif;letter-spacing:-1px;color:#fff;position:relative;z-index:1;text-shadow:0 2px 8px rgba(0,0,0,0.1);}
    .total-asset-change{font-size:13px;margin-top:6px;color:rgba(255,255,255,0.9);position:relative;z-index:1;}
    .tab-nav{display:flex;background:#fff;border-bottom:1px solid var(--brand-mist);overflow-x:auto;}
    .tab-nav::-webkit-scrollbar{display:none;}
    .tn-item{flex:none;padding:14px 20px;font-size:13px;font-weight:600;color:#8aaa95;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;}
    .tn-item.active{color:var(--brand-color);border-bottom-color:var(--brand-color);}
    .tab-content{display:none;padding:16px;}
    .tab-content.active{display:block;}
    .card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 2px 16px rgba(61,160,96,0.08);margin-bottom:14px;border:1px solid rgba(61,160,96,0.07);}
    .card-title{font-size:13px;font-weight:700;color:#4a7c5f;margin-bottom:14px;}
    .sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
    .sum-item{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 12px rgba(61,160,96,0.08);border:1px solid rgba(61,160,96,0.08);}
    .sum-lbl{font-size:11px;color:#9ab5a5;margin-bottom:6px;}
    .sum-num{font-size:22px;font-weight:800;font-family:'Outfit',sans-serif;}
    .sum-num.green{color:var(--brand-color);}.sum-num.red{color:#e05050;}.sum-num.teal{color:#2ba888;}.sum-num.sage{color:#6aaa7a;}
    .chart-area{position:relative;height:200px;}
    .asset-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--brand-haze);}
    .asset-item:last-child{border-bottom:none;}
    .asset-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
    .asset-name{flex:1;font-size:14px;font-weight:500;color:#1a3325;}
    .asset-val{font-size:14px;font-weight:700;font-family:'Outfit',sans-serif;color:var(--brand-color);}
    .asset-pct{font-size:11px;color:#9ab5a5;min-width:36px;text-align:right;}
    .form-tabs{display:flex;gap:8px;margin-bottom:14px;}
    .ftab{flex:1;padding:10px 6px;border:2px solid var(--brand-mist);border-radius:20px;background:var(--brand-haze);font-size:13px;font-weight:600;cursor:pointer;color:#7aaa8a;text-align:center;}
    .ftab.active-inc{background:linear-gradient(135deg,var(--brand-color),var(--brand-light));border-color:var(--brand-color);color:#fff;}
    .ftab.active-exp{background:linear-gradient(135deg,#e05050,#f07070);border-color:#e05050;color:#fff;}
    .ftab.active-inv{background:linear-gradient(135deg,#2ba888,#3dc8a8);border-color:#2ba888;color:#fff;}
    .inp{width:100%;padding:12px 14px;border:1.5px solid var(--brand-mist);border-radius:14px;font-size:14px;font-family:inherit;margin-bottom:10px;outline:none;background:var(--brand-haze);color:#1a3325;}
    .inp:focus{border-color:var(--brand-color);background:#fff;box-shadow:0 0 0 3px rgba(61,160,96,0.1);}
    .submit-btn{width:100%;padding:14px;border:none;border-radius:16px;font-size:15px;font-weight:700;cursor:pointer;color:#fff;font-family:inherit;}
    .submit-btn.inc{background:linear-gradient(135deg,var(--brand-color),var(--brand-light));}
    .submit-btn.exp{background:linear-gradient(135deg,#e05050,#f07070);}
    .submit-btn.inv{background:linear-gradient(135deg,#2ba888,#3dc8a8);}
    .submit-btn.ast{background:linear-gradient(135deg,#4a7c5f,#6aaa7a);}
    .rec-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--brand-haze);}
    .rec-item:last-child{border-bottom:none;}
    .rec-icon{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
    .rec-icon.inc{background:var(--brand-mist);}.rec-icon.exp{background:#fdeaea;}.rec-icon.inv{background:var(--brand-mist);}
    .rec-body{flex:1;}
    .rec-name{font-size:14px;font-weight:600;color:#1a3325;}
    .rec-meta{font-size:11px;color:#9ab5a5;margin-top:2px;}
    .rec-amt{font-size:15px;font-weight:800;font-family:'Outfit',sans-serif;}
    .rec-amt.inc{color:var(--brand-color);}.rec-amt.exp{color:#e05050;}.rec-amt.inv{color:#2ba888;}
    .rec-del{background:none;border:none;color:var(--brand-pale);font-size:16px;cursor:pointer;padding:4px;}
    .rec-del:hover{color:#e05050;}
    .empty-state{text-align:center;padding:32px 16px;color:var(--brand-pale);font-size:14px;}
    .month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
    .mnav-btn{background:var(--brand-mist);border:none;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--brand-color);display:flex;align-items:center;justify-content:center;}
    .mnav-btn:hover{background:var(--brand-mist);}
    .mnav-lbl{font-size:16px;font-weight:700;color:#1a3325;}
  
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:14px;}
    .cal-head{text-align:center;font-size:11px;font-weight:700;color:#8aaa95;padding:6px 0;}
    .cal-head.sun{color:#e05050;}.cal-head.sat{color:var(--brand-color);}
    .cal-day{text-align:center;padding:6px 2px;border-radius:10px;cursor:pointer;min-height:44px;position:relative;background:#fff;border:1px solid var(--brand-haze);transition:all 0.15s;}
    .cal-day:hover{background:var(--brand-mist);}
    .cal-day.empty{background:transparent;border:none;cursor:default;}
    .cal-day.today{background:var(--brand-color);color:#fff;font-weight:700;}
    .cal-day.today .cal-day-num{color:#fff;}
    .cal-day.has-data::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:#f0b86a;}
    .cal-day.today.has-data::after{background:#fff;}
    .cal-day-num{font-size:13px;font-weight:600;color:#1a3325;}
    .cal-day.sun .cal-day-num{color:#e05050;}
    .cal-day.sat .cal-day-num{color:var(--brand-color);}
    .cal-day.today .cal-day-num{color:#fff;}
    .cal-day-total{font-size:9px;color:#e05050;margin-top:1px;}
    .cal-day.today .cal-day-total{color:rgba(255,255,255,0.85);}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:1000;align-items:flex-end;}
    .modal-overlay.open{display:flex;}
    .modal-box{background:#fff;border-radius:24px 24px 0 0;padding:20px 16px 32px;width:100%;max-height:85vh;overflow-y:auto;}
    .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
    .modal-title{font-size:16px;font-weight:700;color:#1a3325;}
    .modal-close{background:var(--brand-haze);border:none;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;color:#4a7c5f;display:flex;align-items:center;justify-content:center;}
    .modal-close:hover{background:var(--brand-mist);}
    .day-rec-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--brand-haze);}
    .day-rec-item:last-child{border-bottom:none;}
    .day-rec-cat{font-size:11px;color:#9ab5a5;margin-top:2px;}
    .day-rec-del{background:none;border:none;color:var(--brand-pale);font-size:15px;cursor:pointer;}
    .day-rec-del:hover{color:#e05050;}
    .modal-form-title{font-size:13px;font-weight:700;color:#4a7c5f;margin-bottom:10px;}
    .type-tabs{display:flex;gap:6px;margin-bottom:12px;}
    .type-tab{flex:1;padding:8px 4px;border:1.5px solid var(--brand-mist);border-radius:16px;background:var(--brand-haze);font-size:12px;font-weight:600;cursor:pointer;color:#7aaa8a;text-align:center;}
    .type-tab.sel-inc{background:linear-gradient(135deg,var(--brand-color),var(--brand-light));border-color:var(--brand-color);color:#fff;}
    .type-tab.sel-exp{background:linear-gradient(135deg,#e05050,#f07070);border-color:#e05050;color:#fff;}
    .type-tab.sel-inv{background:linear-gradient(135deg,#2ba888,#3dc8a8);border-color:#2ba888;color:#fff;}
  
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>



<div class="header">
  <div class="header-top">
    <a href="/" class="back-btn" data-i18n="kk_back_home">← ホーム</a>
    <span class="header-title" data-i18n="kk_title">💼 資産分析</span>
    <select id="kk-lang-select" onchange="kkSetLang(this.value)" style="background:rgba(255,255,255,0.25);color:#fff;border:1px solid rgba(255,255,255,0.4);border-radius:8px;padding:4px 8px;font-size:13px;font-weight:600;outline:none;cursor:pointer;min-width:72px;">
      <option value="ja" style="color:#1a3325;">日本語</option>
      <option value="en" style="color:#1a3325;">English</option>
      <option value="ko" style="color:#1a3325;">한국어</option>
      <option value="zh" style="color:#1a3325;">中文</option>
    </select>
  </div>
  <div class="total-asset-label" data-i18n="kk_total_asset">総資産</div>
  <div class="total-asset-val" id="totalAssetVal">¥0</div>
  <div class="total-asset-change" id="totalAssetChange" data-i18n="kk_pls_register_asset">資産を登録してください</div>
</div>
<div class="tab-nav">
  <div class="tn-item active" onclick="switchTab('dashboard')" data-i18n="kk_tab_dashboard">ダッシュボード</div>
  <div class="tn-item" onclick="switchTab('cashflow')" data-i18n="kk_tab_cashflow">収支管理</div>
  <div class="tn-item" onclick="switchTab('assets')" data-i18n="kk_tab_assets">資産管理</div>
  <div class="tn-item" onclick="switchTab('records')" data-i18n="kk_tab_records">記録一覧</div>
  <div class="tn-item" onclick="switchTab('calendar')" data-i18n="kk_tab_calendar">📅 カレンダー</div>
</div>
<div class="tab-content active" id="tab-dashboard">
  <div class="month-nav"><button class="mnav-btn" onclick="changeMonth(-1)">◀</button><div class="mnav-lbl" id="monthLabel2"></div><button class="mnav-btn" onclick="changeMonth(1)">▶</button></div>
  <div class="sum-grid">
    <div class="sum-item"><div class="sum-lbl" data-i18n="kk_sum_income">💰 今月収入</div><div class="sum-num green" id="d-income">¥0</div></div>
    <div class="sum-item"><div class="sum-lbl" data-i18n="kk_sum_expense">💸 今月支出</div><div class="sum-num red" id="d-expense">¥0</div></div>
    <div class="sum-item"><div class="sum-lbl" data-i18n="kk_sum_balance">📊 収支残</div><div class="sum-num teal" id="d-balance">¥0</div></div>
    <div class="sum-item"><div class="sum-lbl" data-i18n="kk_sum_invest">📈 今月投資</div><div class="sum-num sage" id="d-invest">¥0</div></div>
  </div>
  <div class="card"><div class="card-title" data-i18n="kk_card_bar6mo">📊 月別収支グラフ（過去6ヶ月）</div><div class="chart-area"><canvas id="barChart"></canvas></div></div>
  <div class="card"><div class="card-title" data-i18n="kk_card_pie_expense">🥧 今月の支出内訳</div><div style="display:flex;gap:16px;align-items:center"><div style="flex:1;max-width:160px"><canvas id="donutChart"></canvas></div><div id="donut-legend" style="flex:1;font-size:12px"></div></div></div>
</div>
<div class="tab-content" id="tab-cashflow">
  <div class="month-nav"><button class="mnav-btn" onclick="changeMonth(-1)">◀</button><div class="mnav-lbl" id="monthLabel3"></div><button class="mnav-btn" onclick="changeMonth(1)">▶</button></div>
  <div class="card">
    <div class="form-tabs">
      <button class="ftab active-inc" id="ft-inc" onclick="switchForm('inc')" data-i18n="kk_btn_income">💰 収入</button>
      <button class="ftab" id="ft-exp" onclick="switchForm('exp')" data-i18n="kk_btn_expense">💸 支出</button>
      <button class="ftab" id="ft-inv" onclick="switchForm('inv')" data-i18n="kk_btn_investment">📈 投資</button>
    </div>
    <div id="form-inc"><input class="inp" id="inc-name" type="text" data-i18n-placeholder="kk_ph_item_salary" placeholder="項目名（例：給与）"><input class="inp" id="inc-amount" type="number" data-i18n-placeholder="kk_ph_amount" placeholder="金額（円）"><button class="submit-btn inc" onclick="addRecord('inc')" data-i18n="kk_btn_add_income">＋ 収入を追加</button></div>
    <div id="form-exp" style="display:none"><input class="inp" id="exp-name" type="text" data-i18n-placeholder="kk_ph_item_food" placeholder="項目名（例：食費）"><select class="inp" id="exp-cat"><option value="食費" data-i18n="kk_cat_food">🍱 食費</option><option value="住居" data-i18n="kk_cat_housing">🏠 住居費</option><option value="交通" data-i18n="kk_cat_transport">🚃 交通費</option><option value="光熱費" data-i18n="kk_cat_utility">💡 光熱費</option><option value="通信費" data-i18n="kk_cat_communication">📱 通信費</option><option value="娯楽" data-i18n="kk_cat_entertainment">🎮 娯楽</option><option value="医療" data-i18n="kk_cat_medical">🏥 医療</option><option value="衣類" data-i18n="kk_cat_clothing">👕 衣類</option><option value="教育" data-i18n="kk_cat_education">📚 教育</option><option value="その他" data-i18n="kk_cat_other_box">📦 その他</option></select><input class="inp" id="exp-amount" type="number" data-i18n-placeholder="kk_ph_amount" placeholder="金額（円）"><button class="submit-btn exp" onclick="addRecord('exp')" data-i18n="kk_btn_add_expense">＋ 支出を追加</button></div>
    <div id="form-inv" style="display:none"><input class="inp" id="inv-name" type="text" placeholder="銘柄・ファンド名"><select class="inp" id="inv-cat"><option value="国内株" data-i18n="kk_cat_domestic_stock">🇯🇵 国内株</option><option value="米国株" data-i18n="kk_cat_us_stock">🇺🇸 米国株</option><option value="投資信託" data-i18n="kk_cat_mutual_fund">📦 投資信託</option><option value="ETF" data-i18n="kk_cat_etf">📊 ETF</option><option value="債券" data-i18n="kk_cat_bond">📄 債券</option><option value="仮想通貨" data-i18n="kk_cat_crypto">🪙 仮想通貨</option><option value="その他" data-i18n="kk_cat_other_bulb">💡 その他</option></select><input class="inp" id="inv-amount" type="number" data-i18n-placeholder="kk_ph_amount" placeholder="金額（円）"><button class="submit-btn inv" onclick="addRecord('inv')" data-i18n="kk_btn_add_investment">＋ 投資を追加</button></div>
  </div>
  <div class="card"><div class="card-title" data-i18n="kk_card_line_trend">📈 収支推移（折れ線グラフ）</div><div class="chart-area"><canvas id="lineChart"></canvas></div></div>
</div>
<div class="tab-content" id="tab-assets">
  <div class="card"><div class="card-title" data-i18n="kk_card_register_asset">🏦 資産を登録</div><input class="inp" id="ast-name" type="text" data-i18n-placeholder="kk_ph_asset_name" placeholder="資産名（例：現金、日本株）"><select class="inp" id="ast-cat"><option value="現金" data-i18n="kk_cat_cash">💴 現金・預金</option><option value="国内株" data-i18n="kk_cat_domestic_stock">🇯🇵 国内株</option><option value="米国株" data-i18n="kk_cat_us_stock">🇺🇸 米国株</option><option value="投資信託" data-i18n="kk_cat_mutual_fund">📦 投資信託</option><option value="ETF" data-i18n="kk_cat_etf">📊 ETF</option><option value="債券" data-i18n="kk_cat_bond">📄 債券</option><option value="不動産" data-i18n="kk_cat_realestate">🏠 不動産</option><option value="仮想通貨" data-i18n="kk_cat_crypto">🪙 仮想通貨</option><option value="その他" data-i18n="kk_cat_other_bulb">💡 その他</option></select><input class="inp" id="ast-amount" type="number" data-i18n-placeholder="kk_ph_eval_amount" placeholder="評価額（円）"><button class="submit-btn ast" onclick="addRecord('ast')" data-i18n="kk_btn_register_asset">＋ 資産を登録</button></div>
  <div class="card"><div class="card-title" data-i18n="kk_card_asset_pie">🥧 資産配分グラフ</div><div style="display:flex;gap:16px;align-items:center"><div style="flex:1;max-width:160px"><canvas id="assetPieChart"></canvas></div><div id="asset-legend" style="flex:1;font-size:12px"></div></div></div>
  <div class="card"><div class="card-title" data-i18n="kk_card_asset_list">📋 資産一覧</div><div id="asset-list-el"><div class="empty-state" data-i18n="kk_empty_no_assets">資産を登録してください</div></div></div>
</div>
<div class="tab-content" id="tab-records">
  <div class="month-nav"><button class="mnav-btn" onclick="changeMonth(-1)">◀</button><div class="mnav-lbl" id="monthLabel4"></div><button class="mnav-btn" onclick="changeMonth(1)">▶</button></div>
  <div class="card"><div id="rec-list-el"><div class="empty-state" data-i18n="kk_empty_no_records">記録がありません</div></div></div>
</div>

<div class="tab-content" id="tab-calendar">
  <div class="month-nav"><button class="mnav-btn" onclick="calChangeMonth(-1)">◀</button><div class="mnav-lbl" id="calMonthLabel"></div><button class="mnav-btn" onclick="calChangeMonth(1)">▶</button></div>
  <div class="card" style="padding:12px"><div class="cal-grid" id="calGrid"></div></div>
  <div class="card"><div class="card-title" data-i18n="kk_card_cat_summary">📊 今月のカテゴリ別支出</div><div id="calCatSummary"><div class="empty-state" data-i18n="kk_empty_input_expense_to_see">支出を入力するとここに表示されます</div></div></div>
</div>
<div class="modal-overlay" id="dayModal" onclick="closeDayModal(event)">
  <div class="modal-box">
    <div class="modal-header"><div class="modal-title" id="modalDateTitle"></div><button class="modal-close" onclick="closeDayModalBtn()">✕</button></div>
    <div id="dayRecList"></div>
    <div class="modal-form-title" style="margin-top:12px" data-i18n="kk_modal_add_record">＋ 記録を追加</div>

// ===== Brand Color Sync =====
function hexToRgbK(hex){
  hex = hex.replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const n = parseInt(hex,16);
  return {r:(n>>16)&255, g:(n>>8)&255, b:n&255};
}
function rgbToHexK(r,g,b){
  return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
}
function adjustBrightnessK(hex, factor){
  const {r,g,b} = hexToRgbK(hex);
  if(factor >= 0) return rgbToHexK(r+(255-r)*factor, g+(255-g)*factor, b+(255-b)*factor);
  const f = 1+factor;
  return rgbToHexK(r*f, g*f, b*f);
}
function loadBrandColorK(){
  let c = '#3da060';
  try { c = localStorage.getItem('userBrandColor') || '#3da060'; } catch(e){}
  const root = document.documentElement;
  root.style.setProperty('--brand-color', c);
  root.style.setProperty('--brand-light', adjustBrightnessK(c, 0.15));
  root.style.setProperty('--brand-lighter', adjustBrightnessK(c, 0.25));
  root.style.setProperty('--brand-dark', adjustBrightnessK(c, -0.18));
  root.style.setProperty('--brand-darker', adjustBrightnessK(c, -0.45));
  root.style.setProperty('--brand-deep', adjustBrightnessK(c, -0.3));
  root.style.setProperty('--brand-pale', adjustBrightnessK(c, 0.65));
  root.style.setProperty('--brand-soft', adjustBrightnessK(c, 0.35));
  root.style.setProperty('--brand-mist', adjustBrightnessK(c, 0.85));
  root.style.setProperty('--brand-haze', adjustBrightnessK(c, 0.92));
}
loadBrandColorK();
document.addEventListener('DOMContentLoaded', loadBrandColorK);
