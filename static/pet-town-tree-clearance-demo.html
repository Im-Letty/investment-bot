<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>道と木の間隔</title>

<script type="module">
import * as THREE from '/static/vendor/three-0.160.1.module.js';
import '/static/pet-town-walk.js?v=20261028-fountain-reference1';import '/static/pet-frame-fit.js?v=20261025-fit1';import '/static/pet-river-fishing.js?v=20261027-solidlife1';
import '/static/pet-japan-seasons.js?v=20261025-seasons1';import '/static/pet-town-style.js?v=20261027-layout-art3d1';import '/static/pet-town-layout-art.js?v=20261028-environment1';
import '/static/pet-town-placement-originals.js?v=20261028-soft-roots2';import '/static/pet-town-water-life.js?v=20261028-fountain-reference1';import '/static/pet-town-ocean-life.js?v=20261027-ocean1';

 const host=document.querySelector('#view'),layout={items:[{id:'tree',x:48,y:44}]},raw=JSON.stringify(layout),world=PetTownWalk.createWorld(layout),other=JSON.stringify(world.places.filter(p=>p.id!=='tree')),model=PetTownScene.buildWorld(THREE,world,{},world.spawn,document,'autumn');
 await model.loadOriginalArt();
