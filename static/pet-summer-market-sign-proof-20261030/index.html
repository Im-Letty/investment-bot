<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>夏のマルシェ・吊り看板の形</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;color:#46564f;background:#f4f1e8;font:15px/1.7 system-ui,sans-serif}h1{font-size:21px;margin:0 0 8px}p{margin:8px 0}.controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}button,select{font:inherit;min-height:44px;padding:8px 11px;border:1px solid #c9cdbb;border-radius:12px;background:#fffdf6;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#e8eddf;border-color:#adb9a0;font-weight:700}button:focus-visible,input:focus-visible,select:focus-visible,#stage:focus-visible{outline:3px solid #b5a3bd;outline-offset:2px}#stage{height:min(62vh,580px);min-height:300px;background:#e0e8dc;border-radius:18px;overflow:hidden;touch-action:none;margin:12px 0}canvas{display:block;width:100%;height:100%}.sliders{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}input[type=range]{display:block;width:100%;min-height:36px}.comparison{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,31%);gap:18px;align-items:start}.model-column{min-width:0}.reference{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:12px}.reference img{max-width:360px;width:100%;height:auto;background:#e0e8dc;border-radius:16px}.reference p{max-width:34em}pre{font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere;background:#fffdf7;padding:10px;border-radius:12px}#snapshot{display:block;max-width:100%;height:auto}#snapshot[hidden],#download[hidden]{display:none}@media(max-width:760px){.comparison{grid-template-columns:1fr}.reference{flex-direction:row;padding-top:0}.reference img{width:40%;max-width:230px}.reference p{font-size:13px}}@media(max-width:440px){body{padding:10px}h1{font-size:19px}#stage{height:350px}.sliders{grid-template-columns:repeat(2,minmax(0,1fr))}.reference{align-items:flex-start;gap:8px}.reference img{width:43%}}@media(orientation:landscape) and (max-height:480px){#stage{height:320px}}</style><h1>夏のマルシェ・吊り看板の形</h1><p>二股の木の枠に、両面の小さなマルシェの印を付けた楕円の板を下げた立体候補です。縞の布と丸石の足元を付けました。</p><div class="controls"><button data-view="front">正面</button><button data-view="side">横</button><button data-view="back">裏</button><button data-view="top">上</button><button data-view="bottom">底</button><button id="reset">最初の眺め</button><button id="context">村で見比べる</button><label>光<select id="lighting"><option value="day">明るい光</option><option value="night">暗い光</option></select></label><label>季節<select id="season"><option value="summer">夏</option><option value="winter">冬</option><option value="actual">JSTカレンダー</option></select></label></div><div class="comparison"><div class="model-column"><div id="stage" tabindex="0" aria-label="吊り看板の形。ドラッグや下のつまみで見回せます"></div><div class="sliders"><label>横に回す<input id="yaw" type="range" min="-360" max="360" step="1" value="18"></label><label>上から・下から<input id="pitch" type="range" min="-89" max="89" step="1" value="14"></label><label>傾ける<input id="roll" type="range" min="-180" max="180" step="1" value="0"></label><label>近づく・離れる<input id="distance" type="range" min="1" max="7" step=".05" value="4"></label></div><p id="status" role="status">見本を読み込んでいます。</p><div class="controls"><button id="capture">画像を出す</button><a id="download" hidden>保存用PNGを開く</a></div><p id="receipt"></p><img id="snapshot" hidden alt="現在の未加工canvas出力"></div><div class="reference"><div><img id="sourceImage" src="/static/pet-items-v1/house.webp" alt="系統の参照：保存済みの家"><img id="flowerImage" src="/static/pet-items-v1/flower.webp" alt="系統の参照：保存済みの花"></div><p>保存済みの家と花の色や質感を参照しました。看板は今回の独立したMesh候補です。穴・pin・washer・縦金具は固定した形で、重力や自由に揺れる鎖、風・荷重の計算はありません。両面の印は立体の飾りで、彫文字ではありません。通常入手・配置・所有・保存、身体への装着や全成長でのフィットは未確認です。</p></div></div><details><summary>確認メモ</summary><pre id="report"></pre></details><script type="module" src="./entry.mjs"></script></html>
