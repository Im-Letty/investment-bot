<h1>道具箱：二つのピンと一つのリンク</h1>
<p class="scope">本体の一部とトレイの一部を、穴のある一本の板と二つの実ピンで接続した限定見本です。二つの角度を手動で動かします。トレイを自動で水平に保つ機構、道具箱全体の開閉、密閉収納、荷重・摩擦・入手・保存は未確認です。</p>
<div id="stage" tabindex="0" aria-label="道具箱の二接合部分。ドラッグして視点を回せます" data-ready="false"></div><p id="status" role="status">参照と接合モデルを読み込み中</p>
<div class="sliders"><label class="slider">本体側の角度 <input id="angleA" type="range" min="20" max="50" step=".1" value="35"></label><label class="slider">トレイの相対角度 <input id="angleB" type="range" min="-20" max="0" step=".1" value="-10"></label></div>
<div class="controls"><button data-pose="min">20°／−20°</button><button data-pose="mid">35°／−10°</button><button data-pose="max">50°／0°</button><button id="context">単体・底を見る</button><label><input id="bores" type="checkbox">検査用に軸と留め輪を隠す</label></div>
<div class="sliders"><label class="slider">左右 <input id="yaw" type="range" min="-360" max="360" step=".1" value="25"></label><label class="slider">上下 <input id="pitch" type="range" min="-89" max="89" step=".1" value="24"></label><label class="slider">傾き <input id="roll" type="range" min="-180" max="180" step=".1" value="0"></label><label class="slider">距離 <input id="distance" type="range" min="2" max="9" step=".1" value="4"></label></div>
<div class="controls"><button data-view="front">正面</button><button data-view="side">側面</button><button data-view="back">背面</button><button data-view="top">上</button><button data-view="bottom">底</button><button id="reset">斜めに戻す</button><button id="capture">この実描画をPNGにする</button><a id="download" hidden>PNGをダウンロード</a></div>
<img id="snapshot" alt="この見本で実際に描画した画像" hidden><pre id="receipt" hidden></pre>
