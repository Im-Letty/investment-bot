<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>どんぐりポストと手紙の通り道</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#f4f0e7;color:#454a43;font:15px/1.7 system-ui,sans-serif}h1{font-size:22px;margin:0 0 8px}p{margin:8px 0}.controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}button,select{font:inherit;color:inherit;min-height:44px;padding:8px 10px;border:1px solid #c9c2b7;border-radius:12px;background:#fffaf2}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a58aaf;outline-offset:2px}#stage{height:min(62vh,580px);min-height:300px;overflow:hidden;touch-action:none;background:#d6e3d1;border-radius:16px;margin:12px 0}canvas{display:block;width:100%;height:100%}.sliders{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}input[type=range]{display:block;width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;background:#fffdf7;padding:10px;border-radius:12px}.reference img{width:110px;height:110px;object-fit:contain;background:#fffaf2;border-radius:12px}#snapshot{max-width:100%;display:block}#snapshot[hidden],#download[hidden]{display:none}@media(max-width:440px){body{padding:10px}h1{font-size:19px}#stage{height:350px}.sliders{grid-template-columns:repeat(2,minmax(0,1fr))}}</style><h1>どんぐりポストと手紙の通り道</h1><p>同じポストに、小さな手紙を手動で差し込む形の見本です。戻す・進めるボタンやつまみで、途中の位置も見比べられます。</p><div class="controls"><button id="outside">外に戻す</button><button id="reverse">少し戻す</button><button id="forward">少し進める</button><button id="inside">内側まで</button><label>手紙の位置<input id="progress" type="range" min="0" max="100" step=".5" value="0"></label><button id="context">ポストだけを見る</button><button id="focus">差し込み口を近くで</button><button data-view="front">正面</button><button data-view="side">横</button><button data-view="back">裏</button><button data-view="top">上</button><button data-view="bottom">底</button><button id="reset">最初の眺め</button><label>光<select id="lighting"><option value="day">昼</option><option value="night">夜</option></select></label><label>季節<select id="season"><option value="actual">現在</option><option value="spring">春</option><option value="summer">夏</option><option value="autumn">秋</option><option value="winter">冬</option></select></label></div><div id="stage" tabindex="0" aria-label="ポストと手紙を連続して見回す"></div><div class="sliders"><label>横に回す<input id="yaw" type="range" min="-360" max="360" step="1" value="20"></label><label>上から・下から<input id="pitch" type="range" min="-89" max="89" step="1" value="12"></label><label>傾ける<input id="roll" type="range" min="-180" max="180" step="1" value="0"></label><label>近づく・離れる<input id="distance" type="range" min=".4" max="8" step=".05" value="3"></label></div><p id="status" role="status">原画のある村と手紙を準備しています…</p><button id="capture">画像を保存</button> <a id="download" hidden>PNGをダウンロード</a><img id="snapshot" alt="同じ描画フレームから保存したポストと手紙" hidden><pre id="receipt"></pre><details><summary>確認メモ</summary><div class="reference"><img src="../pet-acorn-mailbox-proof-20261027/reference.png" alt="保存済みの同じポスト原画"><p>手紙はこの見本のために寸法を決めた、曲がらない形です。手や身体の大きさを測ったものではありません。配達、落下、通常の入手・配置・保存にはつながっていません。ポストの扉は閉じたままです。</p></div><button id="reject">幅の大きい手紙の通り道も確認する</button><a href="./SPEC.json">形と検査範囲</a><pre id="report"></pre></details><script type="module" src="./viewer.mjs"></script></html>
