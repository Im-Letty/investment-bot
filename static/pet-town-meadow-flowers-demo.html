<h1>いろいろな花と、小さな風</h1><p>小花・カップ形・ベル形・穂の花を、小さな群れに混ぜました。茎の足元はその場に置いたまま、花ごとに違うタイミングで穏やかに揺れます。<a href="/static/pet-solid-living-demo-game.html?flowers=1">花のある村を歩く</a></p>
<div class="controls"><button data-kind="daisy">小花の群れ</button><button data-kind="tulip">カップ形</button><button data-kind="bell">ベル形</button><button data-kind="spike">穂の花</button><button data-kind="leaf">葉の株</button><button data-kind="village">街全体</button></div>
<div class="controls"><button data-angle="front">正面</button><button data-angle="left">左斜め</button><button data-angle="back">後ろ</button><button data-angle="top">上から</button><button id="motion" aria-pressed="false">花の揺れを止める</button><button id="save">この景色をPNGで保存</button></div>
<div class="controls"><button data-size="390">390px</button><button data-size="320">320px</button><button data-size="landscape">横向き</button><button data-size="wide">広く表示</button><button data-season="spring">春</button><button data-season="autumn">秋</button><button data-season="winter">冬</button></div>
<p id="status" role="status">読み込み中</p><div id="view"></div><p>花の形と揺れを、実際の村と同じ配置・光で見られる見本です。通常ゲームの保存データは使いません。</p><details><summary>見本の確認情報</summary><pre id="proof"></pre></details>
<script type="module">

import '/static/pet-japan-seasons.js?v=20261025-seasons1';import '/static/pet-town-style.js?v=20261027-layout-art3d1';import '/static/pet-town-layout-art.js?v=20261028-environment1';

const host=document.querySelector('#view'),status=document.querySelector('#status'),proof=document.querySelector('#proof'),world=PetTownWalk.createWorld(),before=JSON.stringify(world),model=PetTownScene.buildWorld(THREE,world,{},null,document,'autumn');
await model.loadOriginalArt();const life=model.meadowLife;if(!life||life.revision!=='meadow-flowers3')throw Error('flower_preview_not_ready');
