<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ベストのゆれ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f1e8;color:#334235;font:15px/1.6 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:20px}h1{font-size:25px;margin:0}p{margin:8px 0 14px}.viewer{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px}#stage{height:520px;min-width:0;background:#e7eddd;border-radius:20px;overflow:hidden;touch-action:none;outline-offset:3px}canvas{display:block;width:100%;height:100%}.panel{background:#fffdf5;border:1px solid #d6ddca;border-radius:16px;padding:16px}label{display:block;margin:12px 0}input[type=range]{display:block;width:100%;accent-color:#6c8a62}button,a.download{font:inherit;border:1px solid #b8c7ab;background:#edf2e5;color:#334235;padding:7px 12px;border-radius:9px;cursor:pointer}.buttons{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}button:disabled{opacity:.55}#status{min-height:24px;font-weight:600}details{margin-top:20px;background:#fffdf6;padding:12px;border-radius:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 monospace}#sourceImage{width:180px;max-width:100%;display:block;border-radius:12px;background:#e7eddd}#snapshot{display:block;max-width:100%;margin-top:12px}[hidden]{display:none!important}@media(max-width:650px){main{padding:12px}.viewer{grid-template-columns:1fr}#stage{height:390px}.panel{padding:12px}h1{font-size:23px}}@media(max-width:340px){#stage{height:350px}}
</style>
<main>
<h1>ベストのゆれ</h1>
<p>服を少し動かして、形をぐるりと見られます。キャラクターへの着用はまだ確認していません。</p>
<div class="viewer"><div id="stage" tabindex="0" role="img" aria-label="動かして眺めるベスト"></div><section class="panel" aria-label="ベストの操作">
<div id="status" role="status">読み込み中</div>
<label for="bend">ゆれの向き <output id="bendValue">0%</output><input id="bend" type="range" min="-100" max="100" step="1" value="0"></label>
<div class="buttons"><button id="play">ゆれを再生</button><button id="rest">元の形</button></div>
<div class="buttons"><button data-view="front">正面</button><button data-view="side">横</button><button data-view="back">後ろ</button><button data-view="top">上</button><button data-view="bottom">下</button><button data-view="inside">内側</button></div>
<label for="yaw">左右に回す<input id="yaw" type="range" min="-180" max="180" step=".1" value="18"></label>
<label for="pitch">上下に回す<input id="pitch" type="range" min="-85" max="85" step=".1" value="15"></label>
<label for="roll">傾ける<input id="roll" type="range" min="-180" max="180" step=".1" value="0"></label>
<label for="distance">近さ<input id="distance" type="range" min="1" max="5" step=".05" value="2.6"></label>
<div class="buttons"><button id="reset">見方を戻す</button><button id="capture">画像を保存</button><a id="download" class="download" hidden>PNGを開く</a></div>
</section></div>
<details id="notes"><summary>確認メモ</summary><p>服単体の小さな変形試作です。動く幅は試作用に決めた値です。布の伸びや強さ、身体との接触、着用や成長への対応を保証するものではありません。裏側と厚みは原画をもとに作った試作です。</p><p id="measurements"></p><label><input type="checkbox" id="socketToggle"> 服の表面の目印を表示</label><pre id="proof"></pre><pre id="receipt"></pre><p>保存済みの原画</p><img id="sourceImage" alt="木漏れ日のベストの原画"><p><a href="./input-manifest.json">参照と検証範囲の記録</a></p></details>
<img id="snapshot" alt="保存したベストの画像" hidden>
</main><script type="module" src="./viewer.mjs"></script></html>
