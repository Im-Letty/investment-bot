<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>こもれびベスト・首と前足の境界比較 v2</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f3e8;color:#44513e;font:15px/1.65 system-ui}main{max-width:1080px;margin:auto;padding:18px}h1{font-size:22px;margin:0 0 12px}p{margin:8px 0}.note{background:#fffdf6;border:1px solid #d3d9c6;border-radius:12px;padding:12px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{font:inherit;color:inherit;padding:8px 12px;min-height:44px;border-radius:11px;border:1px solid #8d9a7b;background:#fdfcf7;cursor:pointer}button[aria-pressed=true]{background:#dce8c9;border-color:#677951}button:focus-visible,input:focus-visible{outline:3px solid #6087a5;outline-offset:2px}button:disabled{opacity:.55;cursor:wait}.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(250px,1fr);gap:18px}.canvasWrap{min-width:0}.scroll{max-height:74vh;overflow:auto;border:1px solid #aab99c;border-radius:12px;background:#eaf2da;scroll-behavior:auto}canvas{display:block;width:100%;height:auto;max-width:none}.scroll.zoom canvas{width:200%}aside{min-width:0}aside img{display:block;width:100%;height:auto;max-height:220px;object-fit:contain}label{display:block;margin:9px 0}input{width:19px;height:19px;vertical-align:middle}.meta{font:12px/1.6 ui-monospace,monospace;overflow-wrap:anywhere;white-space:pre-wrap}.status{min-height:1.6em}@media(max-width:650px){main{padding:12px}.grid{grid-template-columns:1fr}h1{font-size:19px}.scroll{max-height:64vh}}</style>
<main><h1>こもれびベスト・首と前足の境界比較 v2</h1><p class="note">同じ身体2枚とベスト原画を使った、<strong>正面2Dの局所マスク候補</strong>です。v1の肩基準点と変換を固定し、背面襟の抜き・前足の曲線境界だけを比較します。原PNGは未加工、校正承認はfalse、着用合格は0件です。動作・実3D・rig・全360度・装備・解放・セーブは未完です。</p>
<div class="controls" role="group" aria-label="成長段階"><button data-stage="baby">ベビー・座位</button><button data-stage="adult">おとな・立位</button></div>
<div class="controls" role="group" aria-label="描画比較"><button data-mode="v1">旧v1</button><button data-mode="v2">局所境界v2</button><button data-mode="body">身体原画だけ</button></div>
<div class="controls" role="group" aria-label="比較背景"><button data-matte="#ffffff">白</button><button data-matte="#eaf2da">淡い緑</button><button data-matte="#1f3d2f">濃い緑</button></div>
<div class="grid"><section class="canvasWrap"><div id="scroll" class="scroll"><canvas id="fit" width="1254" height="1254" aria-label="正面2Dの局所境界比較"></canvas></div><p id="label" role="status">元画像とデータを確認しています。</p><div class="controls"><button id="zoom" aria-pressed="false">200%で比較</button><button data-detail="neck">首元へ</button><button data-detail="left">左前足へ</button><button data-detail="right">右前足へ</button><button data-detail="all">全体へ</button></div></section>
<aside><label><input id="occlusion" type="checkbox" checked>遮蔽を使う（offは単純重ね）</label><label><input id="guides" type="checkbox">境界候補を表示</label><p>曲線は各身体原画からの手動注記で、解剖・接触の測定結果ではありません。元の布・毛の色や画素は塗り直しません。200%は表示倍率だけで、保存PNGは1254×1254です。</p><button id="capture">画面をPNGで保存</button><p id="status" class="status" role="status"></p><pre class="meta" id="receipt"></pre><details><summary>ベストの元原画</summary><img src="./assets/komorebi-vest.png" alt="変更しないこもれびベスト原画"></details></aside></div>
<details><summary>出典SHA・変換・未完了状態</summary><pre class="meta" id="proof"></pre></details></main>
<script src="./fit-preview-v1.js"></script><script src="./fit-mask-refinement.js"></script><script>
'use strict';var LOCAL_CAPTURE=false,config={};
var state={stage:'adult',mode:'v2',matte:'#eaf2da',occlusion:true,guides:false,zoom:false},base=null,patch=null,images={},revision=0,last=null,busy=false,sourceBindings={};
var canvas=document.getElementById('fit'),ctx=canvas.getContext('2d'),scrollBox=document.getElementById('scroll');
function text(id,s){document.getElementById(id).textContent=s;}
function sha(buffer){return crypto.subtle.digest('SHA-256',buffer).then(function(h){return Array.from(new Uint8Array(h),n=>n.toString(16).padStart(2,'0')).join('');});}
async function image(row){var r=await fetch(row.src);if(!r.ok)throw Error('source');var raw=await r.arrayBuffer();if(await sha(raw)!==row.sha256)throw Error('source');var url=URL.createObjectURL(new Blob([raw],{type:'image/png'}));try{return await new Promise(function(resolve,reject){var im=new Image();im.onload=function(){if(im.naturalWidth!==1254||im.naturalHeight!==1254)reject(Error('dimensions'));else resolve(im);};im.onerror=reject;im.src=url;});}finally{URL.revokeObjectURL(url);}}
function paint(){if(!base||busy)return;revision++;var opts={version:state.mode==='v1'?'v1':'v2',bodyOnly:state.mode==='body',matte:state.matte,guides:state.guides,occlusion:state.occlusion};var r=PetFitMaskRefinement.draw(base,patch,state.stage,{body:images[state.stage],vest:images.vest},ctx,opts);scrollBox.classList.toggle('zoom',state.zoom);document.getElementById('zoom').setAttribute('aria-pressed',String(state.zoom));last={revision:revision,stage:state.stage,mode:state.mode,matte:state.matte,occlusion:state.occlusion,guides:state.guides,zoom:state.zoom,bodySHA:base.bodies[state.stage].sha256,assetSHA:base.asset.sha256,baselineRevision:base.landmarkRevision,maskRevision:patch.revision,sourceBindings:sourceBindings,transform:r.transform,representation:'2d_front_reference',approvedCalibration:false,completedFit:false,motion:false,geometry3d:false,rig:false,full360:false,unlockSave:false};text('label',(state.stage==='baby'?'ミルネ・ベビー':'ミルネ・おとな')+' ／ '+({v1:'旧v1',v2:'局所境界v2',body:'身体原画だけ'}[state.mode]));text('proof',JSON.stringify(last,null,2));document.querySelectorAll('[data-stage]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.stage===state.stage)));document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===state.mode)));document.querySelectorAll('[data-matte]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.matte===state.matte)));}
['stage','mode','matte'].forEach(function(key){document.querySelectorAll('[data-'+key+']').forEach(function(b){b.addEventListener('click',function(){if(busy)return;state[key]=b.dataset[key];paint();});});});
['guides','occlusion'].forEach(function(id){document.getElementById(id).addEventListener('change',function(e){if(busy){e.target.checked=state[id];return;}state[id]=e.target.checked;paint();});});
document.getElementById('zoom').onclick=function(){if(busy)return;state.zoom=!state.zoom;paint();};
document.querySelectorAll('[data-detail]').forEach(function(b){b.onclick=function(){if(busy||!base)return;if(b.dataset.detail==='all'){state.zoom=false;paint();scrollBox.scrollTo(0,0);return;}state.zoom=true;paint();var body=base.bodies[state.stage],p=b.dataset.detail==='neck'?[735,885]:b.dataset.detail==='left'?[615,950]:[920,935],scale=canvas.getBoundingClientRect().width/1254;scrollBox.scrollTo(Math.max(0,p[0]*scale-scrollBox.clientWidth/2),Math.max(0,p[1]*scale-scrollBox.clientHeight/2));};});
document.getElementById('capture').onclick=async function(){if(busy||!last)return;var snapshot=JSON.parse(JSON.stringify(last));busy=true;this.disabled=true;try{await new Promise(requestAnimationFrame);var blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('blob');if(LOCAL_CAPTURE){var r=await fetch('/__qa__/capture',{method:'POST',headers:{'Content-Type':'image/png','X-QA-Nonce':config.nonce,'X-QA-Metadata':encodeURIComponent(JSON.stringify(snapshot))},body:blob});if(!r.ok)throw Error('save');var receipt=await r.json();text('receipt',JSON.stringify(receipt,null,2));text('status','実描画PNGを保存しました。原画・新デザインには数えません。');}else{var url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='milne-'+snapshot.stage+'-'+snapshot.mode+'-mask-comparison.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);text('status','PNGの保存を開始しました。保存先のファイルを確認してください。');}}catch(e){text('status','実描画PNGの保存を確認できませんでした。');}finally{busy=false;this.disabled=false;}};
Promise.all(['fit-data-v1.json','fit-data-v2.json','fit-preview-v1.js','fit-mask-refinement.js'].map(async function(p){var r=await fetch('./'+p);if(!r.ok)throw Error('input');var raw=await r.arrayBuffer();sourceBindings[p]={sha256:await sha(raw),bytes:raw.byteLength};return p.endsWith('.json')?JSON.parse(new TextDecoder().decode(raw)):null;})).then(async function(values){var b=values[0],d=values[1];PetFitMaskRefinement.validate(b,d);var a=await Promise.all([image(b.bodies.baby),image(b.bodies.adult),image(b.asset)]);images={baby:a[0],adult:a[1],vest:a[2]};base=b;patch=d;paint();}).catch(function(){text('label','元画像とデータの一致を確認できませんでした。');document.getElementById('capture').disabled=true;});
</script></html>
