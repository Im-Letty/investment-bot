<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月あかりジャケット・表示サイズの見本</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f2ee;color:#55485d;font:14px/1.5 system-ui,sans-serif}header{padding:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}h1{font-size:17px;margin:0 12px 0 0}button{font:inherit;min-height:44px;padding:7px 12px;border:1px solid #cfc4d4;border-radius:12px;background:#fffdf8;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#e9dff0;border-color:#ac95bc}button:focus-visible{outline:3px solid #aa91bb;outline-offset:2px}#framewrap{width:100%;overflow:auto}iframe{display:block;border:0;margin:0 auto;width:100%;height:calc(100dvh - 122px);background:#f6f2ee}#viewportReport{margin:0;padding:0 12px 10px;overflow-wrap:anywhere;font-size:12px;min-height:28px}</style>
<header><h1>月あかりジャケット</h1><button data-width="100%" aria-pressed="true">通常</button><button data-width="390" data-height="844">スマホ縦390</button><button data-width="320" data-height="740">スマホ縦320</button><button data-width="844" data-height="390">スマホ横844×390</button></header><p id="viewportReport" role="status">服の見本を読み込んでいます。</p><div id="framewrap"><iframe id="preview" title="月あかりジャケットの服単体の立体見本" src="/static/pet-moonlight-jacket-volume-proof-20261030/index.html"></iframe></div>
<script>const frame=document.getElementById('preview'),report=document.getElementById('viewportReport');const query=new URLSearchParams(location.search),capture=query.get('capture');if(capture)frame.src+="?capture="+encodeURIComponent(capture);document.querySelectorAll('button[data-width]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('button[data-width]').forEach(peer=>peer.setAttribute('aria-pressed',String(peer===button)));frame.style.width=button.dataset.width==='100%'?'100%':button.dataset.width+'px';frame.style.height=button.dataset.height?button.dataset.height+'px':'calc(100dvh - 122px)';}));addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==frame.contentWindow||event.data?.type!=='moonlight-jacket-viewport')return;const v=event.data;report.textContent='実際の表示 '+v.innerWidth+'×'+v.innerHeight+' ／ 描画領域 '+v.stageWidth+'×'+v.stageHeight+(v.scrollWidth>v.documentWidth?' ／ 横方向にはみ出しあり':'');frame.dataset.actualWidth=String(v.innerWidth);frame.dataset.actualHeight=String(v.innerHeight);frame.dataset.stageWidth=String(v.stageWidth);frame.dataset.stageHeight=String(v.stageHeight);});</script></html>
