<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>どんぐり屋根のポスト</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#f4f0e7;color:#454a43;font:15px/1.7 system-ui,sans-serif}h1{font-size:22px;margin:0 0 8px}p{margin:8px 0}.controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}button,select{font:inherit;color:inherit;min-height:44px;padding:8px 10px;border:1px solid #c9c2b7;border-radius:12px;background:#fffaf2}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a58aaf;outline-offset:2px}#stage{height:min(62vh,580px);min-height:300px;overflow:hidden;touch-action:none;background:#d6e3d1;border-radius:16px;margin:12px 0}canvas{display:block;width:100%;height:100%}.sliders{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}input[type=range]{display:block;width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;background:#fffdf7;padding:10px;border-radius:12px}#snapshot{max-width:100%;display:block}.reference{display:flex;gap:10px;align-items:center}.reference img{width:100px;height:100px;object-fit:contain;background:#fffaf2;border-radius:12px}.reference p{max-width:30em}#snapshot[hidden],#download[hidden]{display:none}@media(max-width:440px){body{padding:10px}h1{font-size:19px}#stage{height:350px}.sliders{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style><h1>どんぐり屋根のポスト</h1><p>保存済みの原画をもとにしたポストの形の見本です。扉を手動で開けて内側をのぞき、裏や底も見回せます。</p><div class="controls"><button id="toggle" aria-pressed="false">扉を開く</button><label>扉の角度<input id="angle" type="range" min="0" max="95" step="1" value="0"></label><button id="context">ポストだけを見る</button><button data-view="front">正面</button><button data-view="side">横</button><button data-view="back">裏</button><button data-view="top">上</button><button data-view="bottom">底</button><button id="reset">最初の眺め</button><label>光<select id="lighting"><option value="day">昼</option><option value="night">夜の見え方</option></select></label><label>季節<select id="season"><option value="actual">現在</option><option value="spring">春</option><option value="summer">夏</option><option value="autumn" selected>秋</option><option value="winter">冬</option></select></label></div><div id="stage" tabindex="0" aria-label="ポストを連続して見回す"></div><div class="sliders"><label>横に回す<input id="yaw" type="range" min="-360" max="360" step="1" value="20"></label><label>上から・下から<input id="pitch" type="range" min="-89" max="89" step="1" value="12"></label><label>傾ける<input id="roll" type="range" min="-180" max="180" step="1" value="0"></label><label>近づく・離れる<input id="distance" type="range" min=".7" max="8" step=".1" value="3.0"></label></div><p>扉は0〜95度の範囲を手動で動かせます。閉じた状態と、開いた内側を見比べられます。</p><p id="status" role="status">原画のある村とポストを準備しています…</p><button id="capture">画像を保存</button> <a id="download" hidden>PNGをダウンロード</a><img id="snapshot" alt="同じ描画フレームから保存したポスト" hidden><pre id="receipt" aria-live="polite"></pre><details><summary>確認メモ</summary><div class="reference"><img src="./reference.png" alt="保存済みのポスト原画"><p>参照は保存済みの同じ原画です。裏側・内側・寸法・ヒンジは、この見本のために作った構造です。手紙の投函・配達・報酬や、通常の入手・配置・保存にはつながっていません。身体の装着寸法を確認したものではありません。</p></div><a href="./SPEC.json">形状と検査範囲</a><pre id="report" aria-label="形と操作の確認記録"></pre></details><script type="module" src="./entry.mjs"></script></html>
