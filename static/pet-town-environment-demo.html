<h1>木の質感に合わせた村の景色</h1><p>木の原画を見ながら、草地と石の道、丸い花と葉、建物や橋の木肌、水辺と空まで、やわらかな形と色の深みを揃えた見本です。<a href="/static/pet-solid-living-demo-game.html?environment=1">村で歩いて見る</a></p>
<div class="refs"><figure><img src="/static/pet-village-art/tree-orchard-apple-v1.png" width="1254" height="1254" alt="基準のりんごの木"><figcaption>丸い葉と色の深み</figcaption></figure><figure><img src="/static/pet-village-art/tree-silver-birch-v1.png" width="1254" height="1254" alt="基準の白樺"><figcaption>柔らかな明暗と白い木肌</figcaption></figure><figure><img src="/static/pet-village-art/tree-shop-grove-soft-roots-v2.png" width="1254" height="1254" alt="基準の細葉の木"><figcaption>曲がった幹と苔の質感</figcaption></figure></div>
<div class="controls"><button data-site="village">街全体</button><button data-site="ground">草地と石の道</button><button data-site="bridge">橋と木の柵</button><button data-site="flowers">花のかたち</button><button data-site="leaves">足元の葉</button><button data-site="sea">砂浜と海</button><button data-site="river">川岸</button><button data-site="sky">空と遠い丘</button></div>
<div class="controls"><button data-angle="front">正面</button><button data-angle="left">左斜め</button><button data-angle="back">反対側</button><button data-angle="top">上から</button><button id="motion" aria-pressed="false">動きを止める</button><button id="reduced" aria-pressed="false">動きを少なくする</button><button id="save">この景色をPNGで保存</button></div>
<div class="controls"><button data-size="390">390px</button><button data-size="320">320px</button><button data-size="landscape">横向き</button><button data-size="wide">広く表示</button><button data-season="spring">春</button><button data-season="summer">夏</button><button data-season="autumn">秋</button><button data-season="winter">冬</button></div>
<div class="controls"><button data-sky="day" aria-pressed="true">昼の空</button><button data-sky="clear-night" aria-pressed="false">快晴の夜空</button></div><p>通常の村では日本時間18時〜翌6時に夜空へ切り替わります。ここでは昼と快晴の夜の見た目を比べられます。実際の天気とは連動しません。</p><p id="season-life" aria-live="polite"></p><p id="status" role="status">読み込み中</p><div id="view"></div><p>通常の村と同じ形・配置・光から描いた見本です。画面をドラッグして周りを見られます。本人のゲームの保存データは使いません。</p><details><summary>見本の確認情報</summary><pre id="proof"></pre></details>

import '/static/pet-town-style.js?v=20261027-layout-art3d1';import '/static/pet-town-layout-art.js?v=20261028-environment1';

import '/static/pet-town-tree-variety.js?v=20261028-shop-style1';import '/static/pet-town-shore-transition.js?v=20261028-shore1';import '/static/pet-town-meadow-sites.js?v=20261028-flower-garden4';import '/static/pet-town-meadow-flowers.js?v=20261028-flower-garden4';import '/static/pet-town-ground-finish.js?v=20261028-tree-family1';import '/static/pet-town-water-finish.js?v=20261028-tree-family1';import '/static/pet-town-environment.js?v=20261102-clear-night1';import '/static/pet-town-scene.js?v=20261102-seasonal-canopy1';

const host=document.querySelector('#view'),status=document.querySelector('#status'),proof=document.querySelector('#proof'),world=PetTownWalk.createWorld(),model=PetTownScene.buildWorld(THREE,world,{},null,document,'autumn');await model.loadOriginalArt();const before=JSON.stringify(world);
if(model.scene.userData.environmentStyleRevision!=='shop-environment2')throw Error('environment_preview_not_ready');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,preserveDrawingBuffer:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.shadowMap.autoUpdate=false;renderer.shadowMap.needsUpdate=true;let shaderErrors=0;renderer.debug.onShaderError=()=>{shaderErrors++;};host.appendChild(renderer.domElement);

document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const v=b.dataset.size;host.style.width=v==='wide'?'min(1060px,100%)':v==='landscape'?'min(740px,100%)':v+'px';host.style.height=v==='landscape'?'420px':'600px';size();});
document.querySelectorAll('[data-season]').forEach(b=>b.onclick=()=>{season=b.dataset.season;model.setSeason(season);lifeView();document.querySelectorAll('[data-season]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));renderer.shadowMap.needsUpdate=true;});
document.querySelectorAll('[data-sky]').forEach(b=>b.onclick=()=>{model.setSkyPhase(b.dataset.sky);document.querySelectorAll('[data-sky]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));choose('sky');});
document.querySelector('#motion').onclick=()=>{paused=!paused;document.querySelector('#motion').setAttribute('aria-pressed',String(paused));document.querySelector('#motion').textContent=paused?'動きを再開する':'動きを止める';};
document.querySelector('#reduced').onclick=()=>{inspectReduced=!inspectReduced;document.querySelector('#reduced').setAttribute('aria-pressed',String(inspectReduced));document.querySelector('#reduced').textContent=inspectReduced?'いつもの動きに戻す':'動きを少なくする';};

renderer.domElement.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId);});renderer.domElement.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;yaw-=(e.clientX-drag.x)*.008;pitch=Math.max(model.scene.userData.skyPhase==='clear-night'?-.45:.12,Math.min(1.4,pitch+(e.clientY-drag.y)*.006));drag.x=e.clientX;drag.y=e.clientY;});for(const n of ['pointerup','pointercancel','lostpointercapture'])renderer.domElement.addEventListener(n,()=>drag=null);
