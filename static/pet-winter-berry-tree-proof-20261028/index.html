<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>冬の小さな実の木</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f0e5;color:#443c34;font:16px/1.55 system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:16px}h1{font-size:1.35rem;margin:0 0 8px}p{margin:8px 0}#stage{width:100%;height:460px;position:relative;border-radius:18px;overflow:hidden;touch-action:none;background:#d9e3c9;outline-offset:3px}canvas{width:100%;height:100%;display:block}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}button,select,a{min-height:44px;font:inherit}button,select{border:1px solid #c9bcaa;border-radius:10px;background:#fffaf0;color:inherit;padding:8px 12px}button[aria-pressed=true]{background:#e7d8eb}label{display:grid;gap:2px;min-width:130px;flex:1}input[type=range]{width:100%;min-height:36px}details{background:#fff9ef;padding:10px;border-radius:10px;margin-top:12px}pre{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}#snapshot{max-width:100%;height:auto}#status{min-height:1.5em}@media(max-width:440px){main{padding:10px}#stage{height:350px}.row{gap:6px}button{padding:7px 9px}label{min-width:125px}}</style>
<main><h1>冬の小さな実の木</h1><p>丸い根元から曲がる枝に、ふっくらした常緑の葉と小さな赤やクリームの実。ドラッグして、横や裏から見回せます。</p>
<div id="stage" tabindex="0" aria-label="冬の実の木を見回す"></div><p id="status" role="status">見本を読み込んでいます。</p>
<div class="row"><button data-view="front">正面</button><button data-view="back">裏側</button><button data-view="side">横</button><button data-view="top">上</button><button data-view="bottom">底</button><button id="context">木だけを見る</button><button id="reset">戻す</button></div>
<div class="row"><label>横に回す<input id="yaw" aria-label="横に回す" type="range" min="-360" max="360" step="1" value="20"></label><label>上と下<input id="pitch" aria-label="上と下" type="range" min="-89" max="89" step="1" value="12"></label><label>傾ける<input id="roll" aria-label="傾ける" type="range" min="-180" max="180" step="1" value="0"></label><label>距離<input id="distance" aria-label="距離" type="range" min="1" max="6" step=".05" value="4"></label></div>
<div class="row"><label>季節<select id="season" aria-label="季節"><option value="winter">冬</option><option value="autumn">秋</option><option value="actual">今日の季節</option></select></label><label>光<select id="lighting" aria-label="光"><option value="day">昼</option><option value="night">夜</option></select></label></div>
<div class="row"><button id="capture">今の見え方を画像にする</button><a id="download" hidden>画像をダウンロード</a></div><img id="snapshot" alt="表示中の冬の実の木の画像" hidden><pre id="receipt"></pre>
<details><summary>見本の確認メモ</summary><p>枝と葉と実の立体、根元と床や周囲の間隔を限られた条件で確認する素材候補です。寸法は試作用で、身体への適合値ではありません。通常の配置・入手・保存、風への強さや荷重、収穫や食用としての扱いは未確認です。</p><pre id="report">読み込み待ち</pre></details></main><script type="module" src="./entry.mjs"></script></html>
