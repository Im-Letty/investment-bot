<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>丸い石の曲がり角・立体見本</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#f4f0e7;color:#454a43;font:15px/1.7 system-ui,sans-serif}h1{font-size:21px;margin:0 0 8px}p{margin:8px 0}.controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}button,select{font:inherit;color:inherit;min-height:42px;padding:8px 10px;border:1px solid #c9c2b7;border-radius:12px;background:#fffaf2}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ad8fb9;outline-offset:2px}#stage{height:min(62vh,580px);min-height:300px;overflow:hidden;touch-action:none;background:#d6e3d1;border-radius:16px;margin:12px 0}canvas{display:block;width:100%;height:100%}.sliders{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}input[type=range]{display:block;width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;background:#fffdf7;padding:10px;border-radius:12px}#snapshot{max-width:100%;display:block}#snapshot[hidden],#download[hidden]{display:none}@media(max-width:440px){body{padding:10px}h1{font-size:19px}#stage{height:350px}.sliders{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style><h1>丸い石の曲がり角</h1><p>温かなクリーム色の石を扇形に並べた、庭の小道のための立体見本です。両端の直線タイルとの目地、厚み、村の床との接地を見比べられます。入手・通常の配置・歩行・保存はまだ接続していません。</p><div class="controls"><button id="context">単体・底を見る</button><button data-view="front">正面</button><button data-view="side">横</button><button data-view="back">背面</button><button data-view="top">上</button><button data-view="bottom">底</button><button id="reset">基準視点</button><label>光<select id="lighting"><option value="day">昼</option><option value="night">夜・見本</option></select></label><label>季節<select id="season"><option value="actual">現在</option><option value="spring">春</option><option value="summer">夏</option><option value="autumn">秋</option><option value="winter">冬</option></select></label></div><div id="stage" tabindex="0" aria-label="石の曲がり角を連続的に見回す"></div><div class="sliders"><label>横角度<input id="yaw" type="range" min="-360" max="360" step="1" value="35"></label><label>上下角度<input id="pitch" type="range" min="-89" max="89" step="1" value="35"></label><label>傾き<input id="roll" type="range" min="-180" max="180" step="1" value="0"></label><label>距離<input id="distance" type="range" min=".7" max="8" step=".1" value="2.5"></label></div><p id="status">原画のある村と見本を準備しています…</p><button id="capture">この実描画を保存</button> <a id="download" hidden>PNGをダウンロード</a><img id="snapshot" alt="同じフレームの曲がり角タイル見本" hidden><pre id="receipt"></pre><details><summary>形状・接地・目地の検査値</summary><pre id="proof"></pre></details><script type="module" src="./preview.mjs"></script></html>
