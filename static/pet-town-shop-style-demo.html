<h1>お店のデザインに合わせた街</h1><p>薄紫の瓦、滑らかなクリーム壁、温かな木枠。細葉の木と白い鉢のチューリップを、商品の原画と見比べられます。<a href="/static/pet-solid-living-demo-game.html?shopstyle=1">村を歩いて見る</a></p>
<div class="refs"><figure><img src="/static/pet-items-v1/house.webp" width="384" height="384" alt="基準にしたおうち"><figcaption>おうち</figcaption></figure><figure><img src="/static/pet-items-v1/tree.webp" width="384" height="384" alt="基準にした木"><figcaption>木の葉と木肌</figcaption></figure><figure><img src="/static/pet-items-v1/flower.webp" width="384" height="384" alt="基準にした白鉢の花"><figcaption>白鉢の花</figcaption></figure></div>
<div class="controls"><button data-site="home" aria-pressed="true">おうち</button><button data-site="cafe">カフェ</button><button data-site="shop">マルシェ</button><button data-site="grove">細葉の木</button><button data-site="tulip">入口の花</button><button data-site="village">街全体</button></div>
<div class="controls"><button data-angle="front">正面</button><button data-angle="left">左斜め</button><button data-angle="back">後ろ</button><button data-angle="right">右斜め</button><button data-angle="top">上から</button><button id="save">この景色をPNGで保存</button></div>
<div class="controls"><button data-size="390">390px</button><button data-size="320">320px</button><button data-size="landscape">横向き</button><button data-size="wide">広く表示</button><button data-season="spring">春</button><button data-season="autumn">秋</button><button data-season="winter">冬</button></div>
<p id="status" role="status">読み込み中</p><div id="view"></div><p>建物は壁や屋根の形を持つ立体です。木と鉢花は原画の色と質感を保った表示です。通常ゲームの記録を使わない見本です。</p><details><summary>見本の確認情報</summary><pre id="proof"></pre></details>
<script type="module">

import '/static/pet-japan-seasons.js?v=20261025-seasons1';import '/static/pet-town-style.js?v=20261027-layout-art3d1';import '/static/pet-town-layout-art.js?v=20261028-environment1';
import '/static/pet-town-placement-originals.js?v=20261028-soft-roots2';import '/static/pet-town-water-life.js?v=20261028-fountain-reference1';import '/static/pet-town-ocean-life.js?v=20261027-ocean1';
import '/static/pet-town-tree-variety.js?v=20261028-shop-style1';import '/static/pet-town-shore-transition.js?v=20261028-shore1';import '/static/pet-town-meadow-sites.js?v=20261028-meadowflowers2';import '/static/pet-town-meadow-flowers.js?v=20261028-meadowflowers2';import '/static/pet-town-ground-finish.js?v=20261028-environment1';import '/static/pet-town-water-finish.js?v=20261028-environment1';import '/static/pet-town-environment.js?v=20261028-environment1';import '/static/pet-town-scene.js?v=20261028-soft-roots2';
try{
const host=document.querySelector('#view'),status=document.querySelector('#status'),proof=document.querySelector('#proof'),world=PetTownWalk.createWorld(),before=JSON.stringify(world),model=PetTownScene.buildWorld(THREE,world,{},null,document,'autumn');
await model.loadOriginalArt();
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,preserveDrawingBuffer:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.shadowMap.autoUpdate=false;renderer.shadowMap.needsUpdate=true;host.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(50,1,.03,90),target=new THREE.Vector3();let bounds=new THREE.Box3(),selected=null,site='home',yaw=-.65,pitch=.40,desiredDistance=4.2,drag=null,save=false,dead=false,raf=0,seq=0;

// Sprite.center is applied by the renderer, not Box3.setFromObject. Use the

function subjectBounds(group,yaw,pitch){
 const box=new THREE.Box3(),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw)),up=new THREE.Vector3(-Math.sin(yaw)*Math.sin(pitch),Math.cos(pitch),-Math.cos(yaw)*Math.sin(pitch));
 group.updateWorldMatrix(true,true);group.traverse(o=>{
  if(o.isSprite&&o.userData.originalArt){const d=o.userData,a=d.alphaBounds,w=d.sourceWidth,h=d.sourceHeight,scale=o.getWorldScale(new THREE.Vector3()),origin=o.getWorldPosition(new THREE.Vector3()),rotation=o.material.rotation||0,cs=Math.cos(rotation),sn=Math.sin(rotation);
   for(const x of [a[0]/w-o.center.x,a[2]/w-o.center.x])for(const y of [1-a[3]/h-o.center.y,1-a[1]/h-o.center.y]){const px=x*scale.x,py=y*scale.y;box.expandByPoint(origin.clone().addScaledVector(right,px*cs-py*sn).addScaledVector(up,px*sn+py*cs));}
  }else if(o.isMesh){if(!o.geometry.boundingBox)o.geometry.computeBoundingBox();box.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld));}
 });return box;
}
function choose(name){site=name;selected=model.placeGroups.find(g=>g.userData.placeId===name);if(name==='grove')selected=findKind('treeGrove');if(name==='tulip')selected=findKind('shopTulip');
if(name==='village'){target.set(-1,1.0,0);bounds.set(new THREE.Vector3(-4,0,-4),new THREE.Vector3(4,3,4));desiredDistance=13;}
else{if(!selected)throw Error('preview_target_missing');desiredDistance=name==='tulip'?1.4:4.2;}

function fitDistance(){let d=desiredDistance;const sy=Math.sin(yaw),cy=Math.cos(yaw),sp=Math.sin(pitch),cp=Math.cos(pitch),tv=Math.tan(camera.fov*Math.PI/360),th=tv*camera.aspect;for(const x of [bounds.min.x,bounds.max.x])for(const y of [bounds.min.y,bounds.max.y])for(const z of [bounds.min.z,bounds.max.z]){const a=x-target.x,b=y-target.y,c=z-target.z,depth=a*sy*cp+b*sp+c*cy*cp;d=Math.max(d,(depth+Math.max(Math.abs(a*cy-c*sy)/th,Math.abs(-a*sy*sp+b*cp-c*cy*sp)/tv))*1.08);}return d;}

document.querySelectorAll('[data-site]').forEach(b=>b.onclick=()=>choose(b.dataset.site));document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{const a=b.dataset.angle;yaw=a==='front'?0:a==='left'?-.65:a==='right'?.65:a==='back'?Math.PI:0;pitch=a==='top'?1.35:.40;});
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const v=b.dataset.size;host.style.width=v==='wide'?'min(1060px,100%)':v==='landscape'?'min(740px,100%)':v+'px';host.style.height=v==='landscape'?'420px':'600px';size();});document.querySelectorAll('[data-season]').forEach(b=>b.onclick=()=>{model.setSeason(b.dataset.season);renderer.shadowMap.needsUpdate=true;});

renderer.domElement.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId);});renderer.domElement.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;yaw-=(e.clientX-drag.x)*.008;pitch=Math.max(.12,Math.min(1.4,pitch+(e.clientY-drag.y)*.006));drag.x=e.clientX;drag.y=e.clientY;});for(const n of ['pointerup','pointercancel','lostpointercapture'])renderer.domElement.addEventListener(n,()=>drag=null);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;function render(ms){if(dead)return;if(site!=='village'){bounds=subjectBounds(selected,yaw,pitch);bounds.getCenter(target);}const d=fitDistance();camera.position.set(target.x+Math.sin(yaw)*Math.cos(pitch)*d,target.y+Math.sin(pitch)*d,target.z+Math.cos(yaw)*Math.cos(pitch)*d);camera.lookAt(target);model.animate(ms,reduced);renderer.render(model.scene,camera);
if(++seq%15===0){let tulips=0;model.scene.traverse(o=>{if(o.userData.originalArtKind==='shopTulip')tulips++;});proof.textContent=JSON.stringify({site,sceneStyle:model.scene.userData.shopStyleRevision,treeStyle:PetTownTreeVariety.shopStyleRevision,originalsStyle:PetTownPlacementOriginals.shopStyleRevision,treeRoots:PetTownPlacementOriginals.treeRootsRevision,treeKinds:model.treeVarietyKinds,treeCounts:model.treeVarietyKinds.reduce((o,k)=>(o[k]=(o[k]||0)+1,o),{}),tulips,worldPreserved:before===JSON.stringify(world),width:host.clientWidth,height:host.clientHeight,camera:{yaw,pitch,distance:d},originalArtState:model.scene.userData.originalArtState,materials:model.materials.size,geometries:model.geometries.size,triangles:renderer.info.render.triangles},null,2);}
if(save){save=false;renderer.domElement.toBlob(blob=>{if(!blob)return;const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download='village-shop-style-'+site+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);},'image/png');}raf=requestAnimationFrame(render);}choose('home');size();raf=requestAnimationFrame(render);
addEventListener('pagehide',()=>{dead=true;cancelAnimationFrame(raf);ro.disconnect();model.dispose();renderer.dispose();},{once:true});
}catch(e){document.querySelector('#status').textContent='表示を準備できませんでした。';document.querySelector('#proof').textContent=JSON.stringify({safeError:e.name},null,2);}
</script></html>
