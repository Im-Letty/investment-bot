<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>川の船体と乗降板・技術見本</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f0e2;color:#46533d;font:15px/1.6 system-ui,sans-serif}header{padding:20px max(16px,4vw) 8px}h1{font-size:24px;margin:0 0 7px}p{margin:5px 0}.note{max-width:90ch;color:#69715a;font-size:13px}main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding:10px max(12px,3vw) 24px}#stage{position:relative;height:66vh;min-height:350px;background:#cfe3dc;border-radius:20px;overflow:hidden;touch-action:none}#stage>canvas.scene{display:block;width:100%;height:100%}#stage>canvas.source{position:absolute;left:0;top:0;width:240px;height:240px;opacity:0;pointer-events:none}aside{padding:16px;background:#fffdf4;border:1px solid #d7d7c4;border-radius:18px;min-width:0}button,select{font:inherit;min-height:42px;padding:7px 12px;margin:3px;border:1px solid #c9cdb5;border-radius:12px;color:inherit;background:#fffdf5;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #637b5d;outline-offset:3px}label{display:block;margin:8px 0}label input[type=range]{width:100%}.controls{padding:0 max(12px,3vw) 8px}#status{font-weight:600}#status[data-valid=true]{color:#446b55}pre{font:11px/1.6 monospace;white-space:pre-wrap;overflow-wrap:anywhere}#snapshot{max-width:100%;border-radius:14px}a{color:#526a47}#contextLabel{position:absolute;top:12px;left:12px;padding:6px 12px;border-radius:20px;background:#fffc;pointer-events:none;font-size:12px;z-index:2}@media(max-width:700px){main{grid-template-columns:1fr}#stage{height:55vh;min-height:300px}h1{font-size:21px}header{padding:16px}}
</style></head><body><header><h1>川の船体と乗降板</h1><p>閉じた船体・内側の床・固定の乗降板を、実際の川の形に重ねる技術見本です。</p><p class="note">通常ゲームへの追加・操船・乗降動作・保存は未接続です。参照は既存の紫の baby 2D 表示 1 case のみ。本人の選択中キャラとの連動、全身体積・全角度の装着や接触の完成を示しません。川底は未定義です。</p></header>
<div class="controls"><button id="context">船体単体・底面を見る</button><button id="closeView">船体の近く</button><button id="wideView">岸と桟橋も見る</button><button id="export">実描画PNGを保存</button><a id="download" hidden download>PNGをダウンロード</a></div>
<main><section><div id="stage" tabindex="0" aria-label="実3D船体と乗降板。ドラッグで見回す"><span id="contextLabel">描画を準備しています</span><canvas id="source" class="source" width="240" height="240" aria-hidden="true" inert></canvas></div><p class="note">ドラッグと角度つまみで連続して見回せます。水面による遮蔽と船体の裏側は別々に確認できます。足の接触は平らな床上の固定参照位置だけで、歩行や船の安定性の検証ではありません。</p><pre id="receipt" aria-live="polite"></pre><img id="snapshot" alt="保存した実描画の検証画像" hidden></section>
<aside><p id="status" role="status">確認中</p><label><input id="actor" type="checkbox" checked> 既存2D参照を表示</label><label>固定参照の場所<select id="contact"><option value="boat">船内の床</option><option value="dock">桟橋の床</option></select></label><label>横からの角度<input id="yaw" type="range" min="-180" max="180" value="48"></label><label>見下ろす角度<input id="pitch" type="range" min="-60" max="80" value="32"></label><label>傾き<input id="roll" type="range" min="-180" max="180" value="0"></label><label>距離<input id="distance" type="range" min="2" max="13" step=".1" value="5.5"></label><details open><summary>実データの確認</summary><pre id="proof"></pre></details></aside></main>
<script src="/static/pet-boat-route-proof-20261026/runtime/pet-town-walk.js"></script><script src="/static/pet-boat-route-proof-20261026/runtime/pet-frame-fit.js"></script><script src="/static/pet-boat-route-proof-20261026/runtime/pet-river-fishing.js"></script><script src="/static/pet-boat-route-proof-20261026/runtime/pet-japan-seasons.js"></script><script src="/static/pet-boat-route-proof-20261026/runtime/pet-town-style.js"></script><script src="/static/pet-boat-route-proof-20261026/runtime/pet-town-scene.js"></script><script src="/static/pet-boat-route-proof-20261026/dock-route.js"></script><script src="./hull.js"></script><script src="./runtime/pet-lilac-motion.js"></script><script type="module" src="./preview.mjs"></script></body></html>
