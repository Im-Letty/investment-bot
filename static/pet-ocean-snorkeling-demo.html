<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>海あそびの操作見本</title><style>body{margin:0;background:#f2f3e9;color:#3b554d;font-family:system-ui,sans-serif}header{padding:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}h1{font-size:17px;margin:0 12px 0 0}button{min-height:40px;padding:6px 12px;border:1px solid #bccdbf;border-radius:12px;background:#fbfcf4;color:inherit}iframe{display:block;border:0;margin:0 auto;width:100%;height:calc(100dvh - 72px);background:#f4f5ec;max-width:100%}</style><header><h1>海あそびの操作見本</h1><button data-width="100%">通常</button><button data-width="390">スマホ縦390</button><button data-width="320">スマホ縦320</button><button data-width="844" data-height="390">スマホ横</button></header><iframe title="合成データの海あそび" src="/static/pet-ocean-snorkeling-demo-game.html"></iframe><script>document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{const f=document.querySelector('iframe');f.style.width=b.dataset.width==='100%'?'100%':b.dataset.width+'px';f.style.height=b.dataset.height?b.dataset.height+'px':'calc(100dvh - 72px)';}));</script></html>
