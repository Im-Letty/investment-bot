<title>写真に合わせた二段噴水</title>
<style>

<h1>写真に合わせた二段噴水</h1>
<p>丸い二段の器、薄紫の縁、花びら模様と台座を見比べられます。噴水をドラッグすると、周りから見られます。<a href="/static/pet-solid-living-demo-game.html?fountain=1">村の中で見る</a></p>
<div class="compare"><section class="reference"><h2>お店の商品画像</h2><img src="/static/pet-items-v1/fountain.webp" width="384" height="384" alt="クリーム色と薄紫の二段噴水の参照画像"></section><section class="render"><h2>村で使う立体の噴水</h2><p id="status" role="status">読み込み中</p><div id="view"></div></section></div>
<div class="options"><button data-angle="front" aria-pressed="true">写真と比べる角度</button><button data-angle="back">背面</button><button data-angle="left">左側</button><button data-angle="right">右側</button><button data-angle="top">上から</button><button data-angle="bottom">底を見る</button><button id="pause" aria-pressed="false">水を止める</button><button id="night" aria-pressed="false">夜の光</button><button id="export">この角度をPNGで保存</button></div>
<div class="options"><button data-size="390">390px</button><button data-size="320">320px</button><button data-size="landscape">740px横向き</button><button data-size="wide">広く表示</button><button data-season="spring">春</button><button data-season="autumn">秋</button><button data-season="winter">冬</button></div>
<p>同じ立体を比較用の視点で表示しています。村での配置や通常ゲームの記録を変更する見本ではありません。</p><details><summary>見本の確認情報</summary><pre id="proof"></pre></details>
<script type="module">

import '/static/pet-town-walk.js?v=20261028-fountain-reference1';
import '/static/pet-frame-fit.js?v=20261025-fit1';import '/static/pet-river-fishing.js?v=20261027-solidlife1';
import '/static/pet-japan-seasons.js?v=20261025-seasons1';import '/static/pet-town-style.js?v=20261027-layout-art3d1';import '/static/pet-town-layout-art.js?v=20261027-layout-art3d1';
import '/static/pet-town-placement-originals.js?v=20261028-tree1';import '/static/pet-town-water-life.js?v=20261028-fountain-reference1';import '/static/pet-town-ocean-life.js?v=20261027-ocean1';
import '/static/pet-town-tree-variety.js?v=20261028-tree1';import '/static/pet-town-shore-transition.js?v=20261028-shore1';import '/static/pet-town-scene.js?v=20261028-fountain-reference1';
try{
const host=document.querySelector('#view'),status=document.querySelector('#status'),proof=document.querySelector('#proof'),world=PetTownWalk.createWorld(),before=JSON.stringify(world),model=PetTownScene.buildWorld(THREE,world,{},null,document,'autumn'),f=model.scene.getObjectByName('market-photo-fountain');
if(!f)throw Error('fountain_missing');
const scene=new THREE.Scene();scene.background=new THREE.Color('#f2eedf');
const ambient=new THREE.HemisphereLight('#fff8ec','#b9ae8e',2.3),sun=new THREE.DirectionalLight('#fff2d8',2.1),fill=new THREE.DirectionalLight('#e2e8ff',.65);

const fitPoints=[];f.updateMatrixWorld(true);f.traverse(o=>{if(!o.isMesh)return;o.geometry.computeBoundingBox();const b=o.geometry.boundingBox;for(const x of [b.min.x,b.max.x])for(const y of [b.min.y,b.max.y])for(const z of [b.min.z,b.max.z])fitPoints.push(new THREE.Vector3(x,y,z).applyMatrix4(o.matrixWorld).sub(target));});

if(save){save=false;renderer.domElement.toBlob(blob=>{if(!blob)return;const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download='fountain-reference-'+view+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);},'image/png');}
raf=requestAnimationFrame(render);}
