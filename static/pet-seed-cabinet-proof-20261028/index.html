<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>種の整理棚・引出しの見本</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f0e5;color:#443c34;font:16px/1.55 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:16px}h1{font-size:1.35rem;margin:0 0 8px}p{margin:8px 0}.compare{display:grid;grid-template-columns:210px minmax(0,1fr);gap:12px}.reference{padding:10px;background:#faf5e9;border-radius:16px;align-self:start}.reference img{display:block;width:100%;height:auto}.reference p{font-size:14px}#stage{width:100%;height:460px;border-radius:18px;overflow:hidden;touch-action:none;background:#d9e3c9;outline-offset:3px}canvas{width:100%;height:100%;display:block}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}button,select,a{min-height:44px;font:inherit}button,select{border:1px solid #c9bcaa;border-radius:10px;background:#fffaf0;color:inherit;padding:8px 12px}button[aria-pressed=true]{background:#eee4d2}label{display:grid;gap:2px;min-width:130px;flex:1}input[type=range]{width:100%;min-height:36px}details{background:#fff9ef;padding:10px;border-radius:10px;margin-top:12px}pre{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}#snapshot{max-width:100%;height:auto}#status{min-height:1.5em}@media(max-width:600px){.compare{grid-template-columns:1fr}.reference{display:flex;gap:12px}.reference img{width:100px;object-fit:contain}.reference p{flex:1}main{padding:10px}#stage{height:350px}.row{gap:6px}button{padding:7px 9px}label{min-width:125px}}@media(max-height:500px) and (orientation:landscape){#stage{height:300px}.compare{grid-template-columns:150px minmax(0,1fr)}.reference{display:block}.reference img{width:100%}}</style>
<main><h1>種の整理棚・引出しの見本</h1><p>木の天板、クリーム色の曲線、金の縁と葉の取手。原画と見比べながら、横や裏、底を見回せます。</p>
<div class="compare"><aside class="reference"><img src="./reference.png" alt="保存済み原画：木の天板、2列3段の引出し、葉の取手と丸脚の棚"><p>保存済みの原画。見えていない内側・背面・案内材は、この立体のために設計した見本です。</p></aside><div id="stage" tabindex="0" aria-label="種の整理棚を見回す"></div></div><p id="status" role="status">見本を読み込んでいます。</p>
<div class="row"><button data-view="front">正面</button><button data-view="back">裏側</button><button data-view="side">横</button><button data-view="top">上</button><button data-view="bottom">底</button><button data-view="inside">左上を開けて中を見る</button><button id="context">村で見比べる</button><button id="reset">戻す</button></div>
<div class="row"><label>左上の引出しだけ・短い手動スライド<input id="drawer" aria-label="左上の引出しだけ" type="range" min="0" max="100" step="1" value="0"></label></div><p>ほかの5枚は閉じた固定前板です。</p>
<div class="row"><label>横に回す<input id="yaw" aria-label="横に回す" type="range" min="-360" max="360" step="1" value="25"></label><label>上と下<input id="pitch" aria-label="上と下" type="range" min="-89" max="89" step="1" value="18"></label><label>傾ける<input id="roll" aria-label="傾ける" type="range" min="-180" max="180" step="1" value="0"></label><label>距離<input id="distance" aria-label="距離" type="range" min="1" max="6" step=".05" value="3"></label></div>
<div class="row"><label>季節<select id="season" aria-label="季節"><option value="summer">夏</option><option value="winter">冬</option><option value="actual">今日の季節</option></select></label><label>光<select id="lighting" aria-label="光"><option value="day">昼</option><option value="night">夜</option></select></label></div>
<div class="row"><button id="capture">今の見え方を画像にする</button><a id="download" hidden>画像をダウンロード</a><button id="save-report">確認メモをJSONにする</button></div><img id="snapshot" alt="表示中の棚の画像" hidden><pre id="receipt"></pre>
<details><summary>見本の確認メモ</summary><p>左上だけに底・側面・背面のある空洞の引出し、2本の案内材と短い移動の止めを設けた幾何試作です。5つの静止位置で余白・案内の重なり・脚の床接触を確認します。身体・手の動き、荷重、摩擦、連続した安全性、通常の配置・入手・保存は未確認です。寸法は身体測定値ではありません。</p><pre id="report">読み込み待ち</pre></details></main><script type="module" src="./entry.mjs"></script></html>
