<main><h1>裁縫道具箱：外部ガイド付きの収納操作</h1><p class="limits">検証用の台＋外部ガイドを使い、持ち手を後ろへ引く・倒す・左右のトレイを寄せる操作を試します。元の原画と固定開状態の旧モデルは保持しています。道具箱単体の開閉、完全に蓋をする収納、握る・体に合う大きさ、入手・通常配置・保存は未接続です。最終デザインの採用やMesh素材ライブラリの完成数へ加算しません。</p>
<div class="controls"><button id="expand">広げた状態</button><button id="compact">寄せた状態</button><label>手動の収納操作<input id="progress" type="range" min="0" max="1000" step="1" value="0"></label><output id="phase">準備中</output></div><div class="controls"><button id="context">単体・底を見る</button><button data-view="front">正面</button><button data-view="side">横</button><button data-view="back">背面</button><button data-view="top">上</button><button data-view="bottom">底</button><button id="reset">基準視点</button><label><input id="actor" type="checkbox">既存baby2Dとの相対サイズ</label></div>
<div id="stage" aria-label="ドラッグで連続見回し・スライダーで全軸変更" tabindex="0"></div>
<div class="ranges"><label>横角度 <input id="yaw" type="range" min="-360" max="360" step="1" value="25"></label><label>上下角度 <input id="pitch" type="range" min="-89" max="89" step="1" value="24"></label><label>傾き <input id="roll" type="range" min="-180" max="180" step="1" value="0"></label><label>距離（全体表示の下限あり） <input id="distance" type="range" min="1.8" max="8" step=".1" value="3.2"></label></div>
<p id="status" role="status">描画を準備しています</p><div class="controls"><button id="capture">この実描画PNGを保存</button><a id="download" hidden>PNGをダウンロード</a></div><img id="snapshot" alt="ボタンクリック時と同一フレームの派生実描画" hidden><pre id="receipt" hidden></pre>
<details><summary>機構の根拠・外部ガイドと未確認範囲</summary><pre id="proof"></pre></details><details><summary>未加工の元原画を見る</summary><figure><img src="../pet-toolbox-mesh-proof-20261026/assets/storybook-sewing-toolbox-v1.png" width="1536" height="1024" alt="既存の裁縫道具箱の原画"><figcaption>参照SHA 6afc65a4… / 原画の切抜き品質を今回合格としたものではありません。</figcaption></figure></details></main><canvas id="source" width="240" height="240" aria-hidden="true" inert></canvas>
