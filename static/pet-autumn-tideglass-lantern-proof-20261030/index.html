<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>秋の海色ガラス灯・形の見本</title>
<style>*{box-sizing:border-box}body{margin:0;padding:14px;color:#46564f;background:#f4f1e8;font:15px/1.7 system-ui,sans-serif}h1{font-size:21px;margin:0 0 8px}p{margin:8px 0}.controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}button,select{font:inherit;min-height:44px;padding:8px 11px;border:1px solid #c9cdbb;border-radius:12px;background:#fffdf6;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#e8eddf;border-color:#adb9a0;font-weight:700}button:focus-visible,input:focus-visible,select:focus-visible,#stage:focus-visible{outline:3px solid #b5a3bd;outline-offset:2px}#stage{height:min(62vh,580px);min-height:300px;background:#e0e8dc;border-radius:18px;overflow:hidden;touch-action:none;margin:12px 0}canvas{display:block;width:100%;height:100%}.sliders{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}input[type=range]{display:block;width:100%;min-height:36px}.comparison{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,31%);gap:18px;align-items:start}.model-column{min-width:0}.reference{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:12px}.source-pair{display:flex;flex-wrap:wrap;justify-content:center}.reference img{max-width:180px;width:100%;height:auto;background:#e0e8dc;border-radius:16px}.reference p{max-width:34em}pre{font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere;background:#fffdf7;padding:10px;border-radius:12px}#snapshot{display:block;max-width:100%;height:auto}#snapshot[hidden],#download[hidden]{display:none}@media(max-width:760px){.comparison{grid-template-columns:1fr}.reference{flex-direction:row;padding-top:0}.source-pair{width:43%;flex-shrink:0}.reference img{width:100%;max-width:160px}.reference p{font-size:13px}}@media(max-width:440px){body{padding:10px}h1{font-size:19px}#stage{height:350px}.sliders{grid-template-columns:repeat(2,minmax(0,1fr))}.reference{align-items:flex-start;gap:8px}.reference img{width:100%}}@media(orientation:landscape) and (max-height:480px){#stage{height:320px}}</style>
<h1>秋の海色ガラス灯・形の見本</h1><p>三日月の木枠に、海色ガラスの楕円の灯りを添えました。丸い銅の傘と秋の葉の透かし枠、平らな石の底を立体で見比べられます。</p>
<div class="controls"><button data-view="front">正面</button><button data-view="side">横</button><button data-view="back">裏</button><button data-view="top">上</button><button data-view="bottom">底</button><button data-view="support">底・接地を見る</button><button id="reset">最初の眺め</button><button id="context">村で見比べる</button><button id="motion" aria-pressed="true">灯りの動き ON</button><label>光<select id="lighting"><option value="day">明るい光</option><option value="night">暗い光</option></select></label><label>季節<select id="season"><option value="summer">夏の表示</option><option value="winter">冬の表示</option><option value="actual">JSTカレンダー</option></select></label></div>
<div class="comparison"><div class="model-column"><div id="stage" tabindex="0" aria-label="灯りの形。ドラッグや下のつまみで見回せます"></div><div class="sliders"><label>横に回す<input id="yaw" type="range" min="-360" max="360" step="1" value="18"></label><label>上から・下から<input id="pitch" type="range" min="-89" max="89" step="1" value="25"></label><label>傾ける<input id="roll" type="range" min="-180" max="180" step="1" value="0"></label><label>近づく・離れる<input id="distance" type="range" min="1" max="8" step=".05" value="3"></label></div><p id="status" role="status">見本を読み込んでいます。</p><div class="controls"><button id="capture">画像を保存</button><a id="download" hidden>保存用PNGを開く</a></div><p id="receipt"></p><img id="snapshot" hidden alt="表示中のガラス灯の未加工描画"></div><div class="reference"><div class="source-pair"><img id="sourceHouse" src="/static/pet-items-v1/house.webp" alt="色と柔らかな質感を参照した保存済みの家"><img id="sourceFlower" src="/static/pet-items-v1/flower.webp" alt="柔らかな葉と花の質感を参照した保存済みの花"></div><p>保存した家と花の色・柔らかな質感を参照しています。ガラス灯の奥行きや構造は新しい試作設計です。光の変化は見た目の表現で、実際の光学・熱・風・荷重や転倒、身体への適合、通常の入手・配置・所有・保存は未確認です。村との比較は一つの限定した床の確認です。</p></div></div><details><summary>確認メモ</summary><pre id="report"></pre></details><script type="module" src="./entry.mjs"></script></html>
