<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'"><title>潮風のセーラーチュニック｜原画見本</title><style>

</style></head><body data-matte="white"><main><h1>潮風のセーラーチュニック</h1><p>四角い襟とまっすぐな袖、脇に小さなスリット。やわらかな綿の質感で、海辺の服を作りました。</p><div class="tools" role="group" aria-label="見本の背景色"><button type="button" data-choice="white" aria-pressed="true">白</button><button type="button" data-choice="mint" aria-pressed="false">薄い緑</button><button type="button" data-choice="dark" aria-pressed="false">深い緑</button><button type="button" data-choice="checker" aria-pressed="false">透過チェック</button></div><div class="matte"><img id="original" class="main-art" src="./coastal-sailor-tunic-v1.png" width="1254" height="1254" alt="クリームの四角い襟と貝の飾りが付いた、青緑のセーラーチュニックの原画"></div><p class="label">小さな表示</p><div class="matte small"><img src="./coastal-sailor-tunic-v1.png" width="1254" height="1254" alt="同じ原画の小さな表示"></div><p class="note">原画の見本です。キャラへの着用、動作や成長に合わせた調整、ゲーム内での入手と保存は確認を進めています。</p></main><script>
const buttons=[...document.querySelectorAll('[data-choice]')];buttons.forEach(b=>b.addEventListener('click',()=>{document.body.dataset.matte=b.dataset.choice;buttons.forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));
window.clothProof={ready:false,sourceSHA:null,expectedSHA:'0a845475fcd03c1c7fae659b99fe557986a87502ef17827bfd3a9dbeb824ff1c',originalBytesUnedited:true,bodyBinding:null,fittingVerified:false};Promise.all([...document.images].map(i=>i.decode())).then(async()=>{const raw=await(await fetch('./coastal-sailor-tunic-v1.png')).arrayBuffer();const hash=await crypto.subtle.digest('SHA-256',raw);clothProof.sourceSHA=[...new Uint8Array(hash)].map(x=>x.toString(16).padStart(2,'0')).join('');clothProof.ready=clothProof.sourceSHA===clothProof.expectedSHA;document.body.dataset.rawSha=clothProof.sourceSHA;document.body.dataset.ready=String(clothProof.ready)}).catch(()=>document.body.dataset.ready='false');
</script></body></html>
