<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雪屋根のガラス灯</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#f4f0e7;color:#454a43;font:15px/1.7 system-ui,sans-serif}h1{font-size:22px;margin:0 0 8px}p{margin:8px 0}.controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}button,select{font:inherit;color:inherit;min-height:44px;padding:8px 10px;border:1px solid #c9c2b7;border-radius:12px;background:#fffaf2}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a58aaf;outline-offset:2px}#stage{height:min(62vh,580px);min-height:300px;overflow:hidden;touch-action:none;background:#d6e3d1;border-radius:16px;margin:12px 0}canvas{display:block;width:100%;height:100%}.sliders{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}input[type=range]{display:block;width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;background:#fffdf7;padding:10px;border-radius:12px}#snapshot{max-width:100%;display:block}.reference{display:flex;gap:10px;align-items:center}.reference img{width:100px;height:100px;object-fit:contain;background:#fffaf2;border-radius:12px}.reference p{max-width:30em}#snapshot[hidden],#download[hidden]{display:none}@media(max-width:440px){body{padding:10px}h1{font-size:19px}#stage{height:350px}.sliders{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style><h1>雪屋根のガラス灯</h1><p>木の切妻屋根と雪受けを添えた冬のガラス灯です。厚みのある窓や屋根の裏、石の足元まで見回せます。</p><div class="controls"><button id="toggle" aria-pressed="true">灯りを消す</button><button id="context">ガラス灯だけを見る</button><button data-view="front">正面</button><button data-view="side">横</button><button data-view="back">裏</button><button data-view="top">上</button><button data-view="bottom">底</button><button id="reset">最初の眺め</button><label>光<select id="lighting"><option value="day">昼</option><option value="night">夜の見え方</option></select></label><label>季節<select id="season"><option value="actual">現在</option><option value="spring">春</option><option value="summer">夏</option><option value="autumn">秋</option><option value="winter" selected>冬</option></select></label></div><div id="stage" tabindex="0" aria-label="ガラス灯を連続して見回す"></div><div class="sliders"><label>横に回す<input id="yaw" type="range" min="-360" max="360" step="1" value="20"></label><label>上から・下から<input id="pitch" type="range" min="-89" max="89" step="1" value="12"></label><label>傾ける<input id="roll" type="range" min="-180" max="180" step="1" value="0"></label><label>近づく・離れる<input id="distance" type="range" min=".7" max="8" step=".1" value="3.0"></label></div><p>灯りの切り替えは、窓の中の光る部分を見比べる操作です。</p><p id="status" role="status">原画のある村とガラス灯を準備しています…</p><button id="capture">画像を保存</button> <a id="download" hidden>PNGをダウンロード</a><img id="snapshot" alt="同じ描画フレームから保存したガラス灯" hidden><pre id="receipt" aria-live="polite"></pre><details><summary>確認メモ</summary><div class="reference"><img src="/static/pet_lilac_reference_v2.png" alt="既存のキャラクター原画"><p>既存原画の全体枠の高さを目安にした大きさ比較です。冬の形の見本で、村への配置・入手・保存は未接続です。光は素材の発光だけで、周囲を照らすライトは追加しません。雪は固定の形です。</p></div><a href="./SPEC.json">形状と検査範囲</a><pre id="proof"></pre></details><script type="module" src="./viewer.mjs"></script></html>
