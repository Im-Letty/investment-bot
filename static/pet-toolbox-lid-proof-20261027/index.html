<h1>道具箱：一段のトレイに付いたふた</h1>
<p class="scope">一段のトレイに、穴を通る軸と留め輪でふたを付けた見本です。ふたとトレイの高さを手動で変えられます。箱全体を閉じる構造・密閉収納・荷重や摩擦・握る動作・入手や保存は未確認です。</p>
<div id="stage" tabindex="0" aria-label="ふたの付いた一段のトレイ。ドラッグして視点を回せます" data-ready="false"></div><p id="status" role="status">村と道具箱の見本を読み込み中</p>
<div class="sliders"><label class="slider">ふた <input id="angle" type="range" min="0" max="100" step=".1" value="50"></label><label class="slider">トレイ <input id="carrier" type="range" min="45" max="80" step=".1" value="62.5"></label></div>
<div class="controls"><button data-pose="min">ふたを閉じる</button><button data-pose="mid">半分ひらく</button><button data-pose="max">ふたを開く</button><button id="context">単体・底を見る</button><label><input id="bores" type="checkbox">検査用にふたの軸と留め輪を隠す</label></div>
<div class="sliders"><label class="slider">左右 <input id="yaw" type="range" min="-360" max="360" step=".1" value="25"></label><label class="slider">上下 <input id="pitch" type="range" min="-89" max="89" step=".1" value="24"></label><label class="slider">傾き <input id="roll" type="range" min="-180" max="180" step=".1" value="0"></label><label class="slider">距離 <input id="distance" type="range" min="2" max="9" step=".1" value="4"></label></div>
<div class="controls"><button data-view="front">正面</button><button data-view="side">側面</button><button data-view="back">背面</button><button data-view="top">上</button><button data-view="bottom">底</button><button id="reset">斜めに戻す</button><button id="capture">画像を保存</button><a id="download" hidden>画像をダウンロード</a></div>
<img id="snapshot" alt="この見本で実際に描画したふたとトレイの画像" hidden><pre id="receipt" hidden></pre>
<details id="notes"><summary>確認メモ</summary><p id="checks"></p><p>トレイの3姿勢とふたの11姿勢を組み合わせた33姿勢を検査しています。33個の固有テストや、連続した全角度の安全保証ではありません。道具の大きさは一律0.6倍の試作用寸法で、身体に合わせて校正した値ではありません。既存の原画や村・キャラの寸法は変えていません。</p><pre id="proof"></pre></details>
