<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>川の桟橋と航路・技術見本</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f0e2;color:#46533d;font:15px/1.6 system-ui,sans-serif}header{padding:22px max(18px,5vw) 12px}h1{font-size:24px;margin:0 0 8px}p{margin:6px 0}.note{max-width:80ch;color:#69715a;font-size:13px}main{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;padding:10px max(14px,3vw) 28px}#stage{position:relative;height:65vh;min-height:350px;background:#cfe3dc;border-radius:20px;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}aside{padding:16px;background:#fffdf4;border:1px solid #d7d7c4;border-radius:18px;min-width:0}button,select{font:inherit;min-height:42px;padding:7px 12px;margin:3px;border:1px solid #c9cdb5;border-radius:12px;color:inherit;background:#fffdf5;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #637b5d;outline-offset:3px}label{display:block;margin:8px 0}label input{width:100%}.controls{padding:0 4px 10px}#status{font-weight:600}#status[data-valid=true]{color:#446b55}#status[data-valid=false]{color:#9b4b3e}pre{font:11px/1.6 monospace;white-space:pre-wrap;overflow-wrap:anywhere}#receipt{max-width:100%;font-size:11px}#snapshot{max-width:100%;border-radius:14px}a{color:#526a47}#contextLabel{position:absolute;top:12px;left:12px;padding:6px 12px;border-radius:20px;background:#fffc;pointer-events:none;font-size:12px}@media(max-width:700px){main{grid-template-columns:1fr;padding:8px 12px 24px}#stage{height:56vh;min-height:300px}h1{font-size:21px}header{padding:16px}.controls{padding:0}aside{padding:14px}}
</style></head><body><header><h1>川の桟橋と航路</h1><p>岸・橋・建物との余白を確かめる技術見本です。</p><p class="note">円は半径90px＋余白24pxの仮の船の包絡です。船体の実寸ではありません。船体・乗降・操船・所持／育成／保存との接続は、まだ作っていません。</p></header>
<div class="controls"><button data-season="actual">現在の日本時間</button><button data-season="spring">春</button><button data-season="summer">夏</button><button data-season="autumn">秋</button><button data-season="winter">冬</button><button id="dockView">桟橋の近く</button><button id="routeView">航路の全体</button><button id="isolate">桟橋単体・底面も見る</button><button id="export">実描画PNGを保存</button><a id="download" hidden download>PNGをダウンロード</a></div>
<main><section><div id="stage" tabindex="0" aria-label="実3D桟橋と川。ドラッグで見回す"><span id="contextLabel">描画を準備しています</span></div><p class="note">ドラッグで見回せます。視点だけを動かし、元のゲームの村・当たり判定・記録は変えません。桟橋は技術候補で、通常ゲームには置いていません。</p><pre id="receipt" aria-live="polite"></pre><img id="snapshot" alt="保存した実描画の検証画像" hidden></section>
<aside><p id="status" role="status">確認中</p><label>仮の包絡半径<select id="radius"><option value="90">90px（候補）</option><option value="160">160px（余白不足の確認）</option></select></label><label>横からの角度<input id="yaw" type="range" min="-180" max="180" value="48"></label><label>見下ろす角度<input id="pitch" type="range" min="-40" max="80" value="32"></label><label>傾き<input id="roll" type="range" min="-180" max="180" value="0"></label><label>距離<input id="distance" type="range" min="3" max="18" step=".1" value="7.5"></label><details><summary>実データの確認</summary><pre id="proof"></pre></details></aside></main>
<script src="./runtime/pet-town-walk.js"></script><script src="./runtime/pet-frame-fit.js"></script><script src="./runtime/pet-river-fishing.js"></script><script src="./runtime/pet-japan-seasons.js"></script><script src="./runtime/pet-town-style.js"></script><script src="./runtime/pet-town-scene.js"></script><script src="./dock-route.js"></script><script type="module" src="./preview.mjs"></script></body></html>
