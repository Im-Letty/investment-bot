<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>村の岸辺・砂浜と浅瀬</title>
<style>body{margin:16px;color:#4d593b;background:#f6f3e8;font:15px/1.6 system-ui}button{font:inherit;background:#fffdf2;border:1px solid #c4c8ae;border-radius:12px;padding:8px 14px;margin:4px;min-height:44px}#view{width:min(960px,100%);height:600px;max-height:76vh;overflow:hidden;border-radius:16px}canvas{display:block;width:100%;height:100%;touch-action:none}p{max-width:70ch}pre{white-space:pre-wrap;font-size:12px}</style>
<h1>草から砂浜、浅瀬へ</h1><p>通常の村と同じ地形を表示しています。岸辺をドラッグして見渡せます。歩いて確認するには<a href="/static/pet-solid-living-demo-game.html?shore=south">村の見本へ</a>。</p>
<div><button data-site="south">南の砂浜</button><button data-site="west">西の岸辺</button><button data-site="north">北の岸辺</button><button data-site="east">川岸と海</button><button data-site="bridge">橋の近く</button><button id="overhead">上から見る</button><button id="low">低い視点</button><button id="save">いまの景色をPNGで保存</button></div>
<div><button data-season="spring">春</button><button data-season="summer">夏</button><button data-season="autumn">秋</button><button data-season="winter">冬</button><button data-size="390">390px</button><button data-size="320">320px</button><button data-size="landscape">740px横向き</button><button data-size="wide">広く表示</button></div><p id="status" role="status">読み込み中</p><div id="view"></div><details><summary>確認情報</summary><pre id="proof"></pre></details>
<script type="module">
import * as THREE from '/static/vendor/three-0.160.1.module.js';
import '/static/pet-town-walk.js?v=20261027-solidlife1';import '/static/pet-frame-fit.js?v=20261025-fit1';import '/static/pet-river-fishing.js?v=20261027-solidlife1';
import '/static/pet-japan-seasons.js?v=20261025-seasons1';import '/static/pet-town-style.js?v=20261027-layout-art3d1';import '/static/pet-town-layout-art.js?v=20261027-layout-art3d1';
import '/static/pet-town-placement-originals.js?v=20261028-tree1';import '/static/pet-town-water-life.js?v=20261027-solidlife1';import '/static/pet-town-ocean-life.js?v=20261027-ocean1';
import '/static/pet-town-tree-variety.js?v=20261028-tree1';import '/static/pet-town-shore-transition.js?v=20261028-shore1';import '/static/pet-town-scene.js?v=20261028-tree-variety1';
try{
const host=document.getElementById('view'),status=document.getElementById('status'),world=PetTownWalk.createWorld(),before=JSON.stringify(world),model=PetTownScene.buildWorld(THREE,world,{},null,document,'autumn');
await model.loadOriginalArt();
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,preserveDrawingBuffer:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.shadowMap.autoUpdate=false;renderer.shadowMap.needsUpdate=true;host.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(50,1,.05,80),sites={south:[0,9.25,0],west:[-15.1,4,-Math.PI/2],north:[0,-10.3,Math.PI],east:[10.2,5,-Math.PI/2],bridge:[12,2,-Math.PI/2]};let site='south',yaw=0,pitch=.70,distance=6,drag=null,save=false,dead=false;
function select(key){site=key;yaw=sites[key][2];pitch=.70;distance=6;status.textContent=document.querySelector('[data-site="'+key+'"]').textContent;}
function size(){renderer.setSize(host.clientWidth,host.clientHeight);camera.aspect=host.clientWidth/host.clientHeight;camera.fov=PetTownScene.viewportFov(host.clientWidth,host.clientHeight);camera.updateProjectionMatrix();}
const observer=new ResizeObserver(size);observer.observe(host);
document.querySelectorAll('[data-site]').forEach(b=>b.onclick=()=>select(b.dataset.site));document.getElementById('overhead').onclick=()=>{pitch=1.22;distance=13;};document.getElementById('low').onclick=()=>{pitch=.22;distance=6;};
document.getElementById('save').onclick=()=>save=true;
document.querySelectorAll('[data-season]').forEach(b=>b.onclick=()=>{model.setSeason(b.dataset.season);renderer.shadowMap.needsUpdate=true;});
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const v=b.dataset.size;host.style.width=v==='wide'?'min(960px,100%)':v==='landscape'?'740px':v+'px';host.style.height=v==='landscape'?'420px':'600px';size();});
renderer.domElement.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId);});
renderer.domElement.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;yaw-=(e.clientX-drag.x)*.008;pitch=Math.max(.18,Math.min(1.35,pitch+(e.clientY-drag.y)*.006));drag.x=e.clientX;drag.y=e.clientY;});
for(const name of ['pointerup','pointercancel','lostpointercapture'])renderer.domElement.addEventListener(name,()=>drag=null);
let raf;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;function render(ms){if(dead)return;const p=sites[site];camera.position.set(p[0]+Math.sin(yaw)*Math.cos(pitch)*distance,Math.sin(pitch)*distance,p[1]+Math.cos(yaw)*Math.cos(pitch)*distance);camera.lookAt(p[0],0,p[1]);model.animate(ms,reduced);renderer.render(model.scene,camera);
if(save){save=false;renderer.domElement.toBlob(blob=>{if(!blob)return;const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='village-shore-'+site+'-'+model.scene.userData.season+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);},'image/png');}
raf=requestAnimationFrame(render);}select('south');size();raf=requestAnimationFrame(render);
document.getElementById('proof').textContent=JSON.stringify({scope:'same native scene, inspection camera, no character or game storage',revision:model.shoreTransition?.revision,metrics:model.shoreTransition?.metrics,worldPreserved:before===JSON.stringify(world),surfaces:model.surfaces.map(x=>x.name),originalArt:model.scene.userData.originalArtRevision},null,2);
addEventListener('pagehide',()=>{dead=true;cancelAnimationFrame(raf);observer.disconnect();model.dispose();renderer.dispose();},{once:true});
}catch(error){document.getElementById('status').textContent='表示を準備できませんでした：'+(error.message||error.name);}
</script></html>
