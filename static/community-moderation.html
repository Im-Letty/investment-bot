<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コミュニティーの通報確認</title>
<style>body{margin:0;background:#edf1e9;color:#244a3e;font:16px/1.65 system-ui,sans-serif}main{max-width:780px;margin:32px auto;padding:24px;background:#fffdf6;border-radius:16px}h1{font-size:24px;font-weight:500}input,button{font:inherit;padding:10px;border:1px solid #becfc1;border-radius:6px}button{background:#eef3ea;color:inherit;cursor:pointer}form{display:flex;gap:12px;flex-wrap:wrap}article{padding:20px 0;border-top:1px solid #d2dcca}.meta{font-size:13px;color:#65786d}.body{white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;gap:12px;flex-wrap:wrap}#status{min-height:2em}input{max-width:100%;box-sizing:border-box}</style>
<main><h1>コミュニティーの通報確認</h1><p>運営用の画面です。通報内容を確認し、対象の投稿を非表示にするか判断します。</p>
<form id="login"><label>管理パスワード <input id="password" type="password" autocomplete="off" required></label><button type="submit">確認する</button><button type="button" id="leave">終了</button></form>
<p id="status" role="status"></p><section id="reports"></section></main>
<script>
(function(){'use strict';var secret='',epoch=0,list=document.getElementById('reports'),status=document.getElementById('status'),password=document.getElementById('password');
function node(tag,text,cls){var n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n;}
async function api(path,data){var response=await fetch(path,{method:data?'POST':'GET',headers:{'X-Admin-Pass':secret,'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined,cache:'no-store'});var result=await response.json();if(!response.ok||!result.ok)throw new Error(response.status===403?'管理パスワードを確認してください。':'読み込みに失敗しました。');return result;}
var reasons={spam:'迷惑・宣伝',abuse:'嫌がらせ',privacy:'個人情報',misinformation:'誤った情報',other:'その他'};
async function load(){var current=++epoch;list.replaceChildren();status.textContent='読み込み中…';try{var result=await api('/api/community/moderation/reports');if(current!==epoch)return;status.textContent=result.reports.length?'未対応の通報 '+result.reports.length+'件（最大50件ずつ）':'未対応の通報はありません。';result.reports.forEach(function(report){var post=report.post||{},a=node('article');a.append(node('div','投稿 #'+report.post_id+' / '+(reasons[report.reason]||report.reason),'meta'));a.append(node('h2',post.name||'投稿'));a.append(node('p',post.body||'本文を確認できません。','body'));a.append(node('p',post.deleted?'本人が削除しています。':post.hidden?'現在は非表示です。':'現在は公開されています。','meta'));var actions=node('div','', 'actions');[['非表示にする',true],['公開を維持・対応済みにする',false]].forEach(function(pair){var b=node('button',pair[0]);b.type='button';b.disabled=!!post.deleted&&pair[1];b.addEventListener('click',async function(){b.disabled=true;try{await api('/api/community/posts/'+report.post_id+'/moderate',{hidden:pair[1]});await load();}catch(error){status.textContent=error.message;b.disabled=false;}});actions.append(b);});a.append(actions);list.append(a);});}catch(error){if(current===epoch)status.textContent=error.message;}}
document.getElementById('login').addEventListener('submit',function(event){event.preventDefault();secret=password.value;password.value='';load();});document.getElementById('leave').addEventListener('click',function(){++epoch;secret='';password.value='';list.replaceChildren();status.textContent='終了しました。';});window.addEventListener('pagehide',function(){++epoch;secret='';});})();
</script></html>
