<script>
function updateFill(el){
  const min=parseFloat(el.min)||0, max=parseFloat(el.max)||100, val=parseFloat(el.value)||0;
  const pct=((val-min)/(max-min)*100).toFixed(1);
  el.style.setProperty('--fill','linear-gradient(to right,#2d7a2d '+pct+'%,#d8d8d8 '+pct+'%)');
}

(function(){
  const canvas=document.getElementById('bg-canvas');
  const ctx=canvas.getContext('2d');
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
  window.addEventListener('resize',resize);resize();
  const SYMS={'ja':'¥','en':'$','ko':'₩','zh':'元'};
  function rand(a,b){return a+Math.random()*(b-a);}
  const bubbles=[];
  function mkB(){const r=rand(14,50);return{x:rand(0,canvas.width),y:canvas.height+r,r,speed:rand(0.2,0.55),drift:rand(-0.1,0.1),opacity:rand(0.015,0.038),wobble:rand(0,Math.PI*2),ws:rand(0.004,0.012)};}
  for(let i=0;i<16;i++){const b=mkB();b.y=rand(0,canvas.height);bubbles.push(b);}
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const sym=SYMS[window.currentLang||'ja'];
    bubbles.forEach(b=>{
      b.wobble+=b.ws;b.x+=Math.sin(b.wobble)*0.35+b.drift;b.y-=b.speed;
      if(b.y<-b.r*2)Object.assign(b,mkB());
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
      ctx.strokeStyle=`rgba(30,92,32,${b.opacity*1.5})`;ctx.lineWidth=1;ctx.stroke();
      ctx.fillStyle=`rgba(30,92,32,${b.opacity})`;ctx.fill();
      if(b.r>=18){ctx.save();ctx.globalAlpha=b.opacity*2.5;ctx.fillStyle='rgba(30,92,32,1)';ctx.font=`700 ${Math.round(b.r*0.6)}px Outfit,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(sym,b.x,b.y);ctx.restore();}
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

function getV(id){const v=+document.getElementById(id).value;return(isNaN(v)||v<=0)?0:v;}

function countUp(id,to,pre='',dur=600){
  const el=document.getElementById(id);if(!el)return;
  if(timers[id])cancelAnimationFrame(timers[id]);
  const t0=performance.now();
  function tick(now){const p=Math.min((now-t0)/dur,1),e=1-Math.pow(1-p,3);el.textContent=pre+fmt(Math.round(to*e));if(p<1)timers[id]=requestAnimationFrame(tick);else el.textContent=pre+fmt(to);}
  timers[id]=requestAnimationFrame(tick);
}

function switchTab(name){
  ['daily','monthly','lump','goal','mypage'].forEach(n=>{
    const el=document.getElementById('tab-'+n);
    if(n===name){el.style.display='';el.classList.remove('tab-panel');void el.offsetWidth;el.classList.add('tab-panel');}
    else el.style.display='none';
  });
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',['daily','monthly','lump','goal','mypage'][i]===name));
  if(name==='daily')calcD();if(name==='monthly')calcM();if(name==='lump')calcL();if(name==='goal')calcG();if(name==='mypage')loadMyPage();
}

function calcD(){
  const daily=getMoney('d-amount-n'),rate=getV('d-rate-n')/100/365,years=Math.round(getV('d-years-n'));
  let labels=[],p=[],tot=[];
  for(let y=1;y<=years;y++){const d=y*365,total=rate===0?daily*d:daily*((Math.pow(1+rate,d)-1)/rate)*(1+rate);labels.push(fmtYr(y));p.push(Math.round(daily*d));tot.push(Math.round(total));}
  const ft=tot[tot.length-1]||0,ti=daily*years*365;
  countUp('d-total',ti);countUp('d-gain',ft-ti,'+');countUp('d-final',ft);
  if(chartD)chartD.destroy();chartD=makeChart('chart-d',labels,p,tot);
}
function calcM(){
  const monthly=getMoney('m-amount-n'),rate=getV('m-rate-n')/100/12,years=Math.round(getV('m-years-n')),months=years*12;
  let labels=[],p=[],tot=[];
  for(let y=1;y<=years;y++){const m=y*12,total=rate===0?monthly*m:monthly*((Math.pow(1+rate,m)-1)/rate)*(1+rate);labels.push(fmtYr(y));p.push(Math.round(monthly*m));tot.push(Math.round(total));}
  const ft=tot[tot.length-1]||0,ti=monthly*months;
  countUp('m-total',ti);countUp('m-gain',ft-ti,'+');countUp('m-final',ft);
  if(chartM)chartM.destroy();chartM=makeChart('chart-m',labels,p,tot);
}
function calcL(){
  const init=getMoney('lp-amount-n'),rate=getV('lp-rate-n')/100,years=Math.round(getV('lp-years-n'));
  let labels=[],p=[],tot=[];
  for(let y=1;y<=years;y++){labels.push(fmtYr(y));p.push(Math.round(init));tot.push(Math.round(init*Math.pow(1+rate,y)));}
  const final=tot[tot.length-1]||0;
  countUp('lp-principal',init);countUp('lp-gain',final-init,'+');countUp('lp-final',final);
  if(chartL)chartL.destroy();chartL=makeChart('chart-l',labels,p,tot);
}
function calcG(){
  const target=getMoney('g-target-n'),ar=getV('g-rate-n')/100,years=Math.round(getV('g-years-n')),months=years*12,r=ar/12;
  const monthly=r===0?target/months:target*r/((Math.pow(1+r,months)-1)*(1+r)),ti=monthly*months;
  countUp('g-monthly',Math.ceil(monthly));countUp('g-total',ti);countUp('g-gain',target-ti,'+');
  let labels=[],p=[],tot=[];
  for(let y=1;y<=years;y++){const m=y*12,t=r===0?monthly*m:monthly*((Math.pow(1+r,m)-1)/r)*(1+r);labels.push(fmtYr(y));p.push(Math.round(monthly*m));tot.push(Math.round(t));}
  if(chartG)chartG.destroy();chartG=makeChart('chart-g',labels,p,tot);
}

    zh:{title:'📈 详细分析',gain:'收益',taxed:'税后（课税帐户 20.315%）',nisa:'NISA账户（免税）',advantage:'NISA优势',yearly_limit:'新NISA年度上限（¥360万）',lifetime_limit:'终身上限（¥1800万）',within:'以内',exceeds:'超过',monthly_eq:'月定投换算'}
  };
  function tt(k){var d=L[getLang()]||L.ja;return d[k]||L.ja[k]||k;}
  function buildAnalysisBox(principal,finalAmount,years){
    var gain=Math.max(0,finalAmount-principal);
    var tax=gain*TAX_RATE;
    var afterTax=finalAmount-tax;
    var nisaAdvantage=tax;
    var withinYearly=principal<=NISA_YEARLY_LIMIT;
    var withinLifetime=principal<=NISA_LIFETIME_LIMIT;
    var monthlyEq=years>0?(principal/(years*12)):0;
    return '<div style="margin-top:14px;padding:14px;background:linear-gradient(135deg,rgba(61,160,96,.08),rgba(52,152,219,.08));border-radius:12px;border:1px solid rgba(61,160,96,.25);font-size:13px;line-height:1.7;">'+
      '<div style="font-weight:700;color:#2d4a2d;margin-bottom:8px;font-size:14px;">'+tt('title')+'</div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">'+
      '<div>💰 '+tt('gain')+':<br><b style="color:#3da060;">'+fmtJPY(gain)+'</b></div>'+
      '<div>🏦 '+tt('taxed')+':<br><b style="color:#e67e22;">'+fmtJPY(afterTax)+'</b></div>'+
      '<div>🌸 '+tt('nisa')+':<br><b style="color:#3498db;">'+fmtJPY(finalAmount)+'</b></div>'+
      '<div>✨ '+tt('advantage')+':<br><b style="color:#9b59b6;">+'+fmtJPY(nisaAdvantage)+'</b></div>'+
      '</div>'+
      '<div style="margin-top:10px;padding-top:10px;border-top:1px dashed rgba(0,0,0,.1);font-size:12px;color:#555;">'+
      '<div>'+tt('yearly_limit')+': '+(withinYearly?'✅ '+tt('within'):'⚠️ '+tt('exceeds'))+'</div>'+
      '<div>'+tt('lifetime_limit')+': '+(withinLifetime?'✅ '+tt('within'):'⚠️ '+tt('exceeds'))+'</div>'+
      (monthlyEq>0?'<div>'+tt('monthly_eq')+': '+fmtJPY(monthlyEq)+'/m</div>':'')+
      '</div></div>';
  }
  function getTabValues(tabId){var tab=document.getElementById(tabId);if(!tab)return null;var ranges=tab.querySelectorAll('input[type="range"]');var vals=[];ranges.forEach(function(r){vals.push(parseFloat(r.value)||0);});return vals;}
  function injectAnalysis(){
    try{
      var charts=[{k:'d',tab:'tab-daily',mode:'daily'},{k:'m',tab:'tab-monthly',mode:'monthly'},{k:'l',tab:'tab-lump',mode:'lump'},{k:'g',tab:'tab-goal',mode:'goal'}];
      charts.forEach(function(item){var k=item.k;
        var canvas=document.getElementById('chart-'+k);
        if(!canvas)return;
        var chart=canvas.parentElement;
        var existingBox=chart.parentElement.querySelector('.sim-pro-box-'+k);
        var inputs=[];
        var values=getTabValues(item.tab)||[];
        if(values.length<2)return;
        var principal=values[0]||0;
        var rate=(values[1]||0)/100;
        var years=values[2]||1;
        if(principal<=0||years<=0)return;
        var finalAmt=principal*Math.pow(1+rate,years);
        if(k==='m'||k==='d'){var monthly=values[0]||0;var periods=(k==='m'?years*12:years*365);var rp=(k==='m'?rate/12:rate/365);finalAmt=monthly*((Math.pow(1+rp,periods)-1)/rp);principal=monthly*periods;}
        var html=buildAnalysisBox(principal,finalAmt,years);
        if(existingBox){existingBox.innerHTML=html;}else{var box=document.createElement('div');box.className='sim-pro-box-'+k;box.innerHTML=html;chart.parentElement.appendChild(box);}
      });
    }catch(e){console.warn('sim-pro err',e);}
  }
  function hookCalc(){
    ['calcD','calcM','calcL','calcG'].forEach(function(fn){
      if(typeof window[fn]==='function' && !window['_orig_'+fn]){
        window['_orig_'+fn]=window[fn];
        window[fn]=function(){try{window['_orig_'+fn].apply(this,arguments);}catch(e){}setTimeout(injectAnalysis,200);};
      }
    });
    setTimeout(injectAnalysis,500);
  }
  function init(){if(typeof window.calcD==='function'){hookCalc();}else{setTimeout(init,500);}}
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{setTimeout(init,300);}
})();</script>

<style id="simBrandSync">
  .tab.active{ color: var(--brand-dark, #2d7a2d) !important; }
  .tab.active{ background: var(--brand-lighter, #d0ead0) !important; }
  .val-input, .metric .mval, .mp-name, .info-value, .mp-section-title{ color: var(--brand-dark, #2d7a2d) !important; }

<!-- __SIM_BRANDSYNC_BOOTED : syncs simulator look to home color customizer (localStorage userBrandColor). Reflects main colors + pale bg + readable text + sliders + boxes + advice text + detail green text + chart (lines/fills/area bg/legend) across all tabs. Meaningful color-codes (tax/account/merit) kept. Default brand #3da060. -->
<style id="simBrandSync"></style>
<style id="simBrandSyncDetail"></style>
<script>
(function(){
  if (window.__SIM_BRANDSYNC_BOOTED) return; window.__SIM_BRANDSYNC_BOOTED = true;
  var DEFAULT_BRAND = "#3da060";
  function hexToRgb(h){h=(h||"").replace("#","");if(h.length!==6)return null;var r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);if(isNaN(r)||isNaN(g)||isNaN(b))return null;return {r:r,g:g,b:b};}
  function clamp(x){return Math.max(0,Math.min(255,Math.round(x)));}
  function toHex(r,g,b){return "#"+[r,g,b].map(function(x){var s=clamp(x).toString(16);return s.length<2?"0"+s:s;}).join("");}
  function tint(hex,amt){var c=hexToRgb(hex);if(!c)return hex;return toHex(c.r+(255-c.r)*amt,c.g+(255-c.g)*amt,c.b+(255-c.b)*amt);}
  function darken(hex,amt){var c=hexToRgb(hex);if(!c)return hex;return toHex(c.r*(1-amt),c.g*(1-amt),c.b*(1-amt));}
  function rgba(hex,a){var c=hexToRgb(hex);if(!c)return hex;return "rgba("+c.r+","+c.g+","+c.b+","+a+")";}
  function getBrand(){var v=localStorage.getItem("userBrandColor");return hexToRgb(v)?v:DEFAULT_BRAND;}

  function buildVars(brand){
    return {
      brand: brand, light: tint(brand,0.15), lighter: tint(brand,0.25),
      dark: darken(brand,0.18), darker: darken(brand,0.45), deep: darken(brand,0.30),
      bg: tint(brand,0.95), tabsBg: tint(brand,0.88), activeTab: tint(brand,0.78),
      text: darken(brand,0.55), accent: darken(brand,0.18),
      noteBg: tint(brand,0.90), noteBorder: tint(brand,0.75),
      chartBg: tint(brand,0.93), softBorder: rgba(brand,0.18),
      areaBg: tint(brand,0.93),
      lineMain: darken(brand,0.30), linePrincipal: tint(brand,0.55),
      fillMain: rgba(brand,0.12), fillPrincipal: rgba(brand,0.15)
    };
  }

  function applyCss(v){
    var css = ":root{--brand-color:"+v.brand+";--brand-light:"+v.light+";--brand-lighter:"+v.lighter+";--brand-dark:"+v.dark+";--brand-darker:"+v.darker+";--brand-deep:"+v.deep+";}"
      + "body{background:"+v.bg+" !important;}"
      + ".tabs{background:"+v.tabsBg+" !important;}"
      + ".tab.active{background:"+v.activeTab+" !important;color:"+v.text+" !important;}"
      + ".metric .mval,.metric .mlabel{color:"+v.text+" !important;}"
      + ".val-input,.section-title,h1,h2{color:"+v.text+" !important;}"
      + "input[type=range]{accent-color:"+v.accent+" !important;}"
      + ".chart-outer{background:"+v.chartBg+" !important;border-color:"+v.softBorder+" !important;}"
      + ".card,.metric{border-color:"+v.softBorder+" !important;}"
      + "[class^=sim-pro-box],[class*=\" sim-pro-box\"]{border-color:"+v.softBorder+" !important;}"
      + "[style*=\"#f1f8f1\"]{background:"+v.noteBg+" !important;border-color:"+v.noteBorder+" !important;}";
    var el=document.getElementById("simBrandSync"); if(el) el.textContent=css;
    // green text inside advice/detail boxes -> brand (meaningful tax/account/merit colors are left as-is)
    var dcss = "[style*=\"color:#2f5d33\"],[style*=\"color: #2f5d33\"]{color:"+v.text+" !important;}"
      + "[style*=\"color:#2d4a2d\"],[style*=\"color: #2d4a2d\"]{color:"+v.text+" !important;}"
      + "[style*=\"color:#3da060\"],[style*=\"color: #3da060\"]{color:"+v.deep+" !important;}"
      + "[style*=\"color:#2d7a2d\"],[style*=\"color: #2d7a2d\"]{color:"+v.deep+" !important;}";
    var del=document.getElementById("simBrandSyncDetail"); if(del) del.textContent=dcss;
  }

  function applySliders(v){
    document.querySelectorAll(".row input[type=range]").forEach(function(r){
      var f=r.style.getPropertyValue("--fill");
      if(f && f.indexOf("#")>-1){ var fixed=f.replace(/#[0-9a-fA-F]{6}/, v.accent); if(fixed!==f) r.style.setProperty("--fill", fixed); }
    });
  }

  var areaColor = "#f1f8f4";
  if (window.Chart && Chart.register){
    var plugin={id:"simBrandAreaBg",beforeDraw:function(chart){var ctx=chart.ctx,ca=chart.chartArea;if(!ca)return;ctx.save();ctx.fillStyle=areaColor;ctx.fillRect(ca.left,ca.top,ca.right-ca.left,ca.bottom-ca.top);ctx.restore();}};
    try{Chart.register(plugin);}catch(e){}
  }

  function applyCharts(v){
    areaColor = v.areaBg;
    if(!(window.Chart && Chart.getChart))return;
    try{ if(Chart.defaults) Chart.defaults.color = v.text; }catch(e){}
    document.querySelectorAll("canvas").forEach(function(cv){
      var ch=Chart.getChart(cv); if(!ch)return;
      ch.data.datasets.forEach(function(d){
        if(d.label==="総資産"){d.borderColor=v.lineMain;d.backgroundColor=v.fillMain;}
        if(d.label==="元本"){d.borderColor=v.linePrincipal;d.backgroundColor=v.fillPrincipal;}
      });
      try{ch.update("none");}catch(e){}
    });
  }

  var curV = buildVars(getBrand());
  function applyAll(){curV=buildVars(getBrand());applyCss(curV);applySliders(curV);applyCharts(curV);}

  applyAll();
  var tries=0; var iv=setInterval(function(){applyAll();if(++tries>=10)clearInterval(iv);},600);
  // slider input rewrites slider fill AND chart to green -> re-fix
  document.addEventListener("input",function(e){if(e.target&&e.target.matches&&e.target.matches(".row input[type=range]"))setTimeout(function(){applySliders(curV);applyCharts(curV);},0);},true);
  // switching tabs re-creates charts (green) -> re-apply on tab click
  document.addEventListener("click",function(e){var t=e.target&&e.target.closest?e.target.closest(".tab"):null;if(t){setTimeout(function(){applySliders(curV);applyCharts(curV);},60);setTimeout(function(){applySliders(curV);applyCharts(curV);},250);setTimeout(function(){applySliders(curV);applyCharts(curV);},600);}},true);
  setInterval(function(){applySliders(curV);},500);

  window.addEventListener("storage",function(e){if(e.key==="userBrandColor")applyAll();});
})();
</script>

</body>
