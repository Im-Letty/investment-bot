<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP', sans-serif; background: #f9fdf9; color: #2d4a2d; }

.lang-select-outer::after { content: '∨'; position: absolute; right: 2px; top: 50%; transform: translateY(-50%); color: #888; font-size: 10px; pointer-events: none; }
.tabs { display: flex; justify-content: center; background: #e8f5e8; border-radius: 14px; padding: 4px; gap: 3px; margin-bottom: 1.5rem; box-shadow: inset 0 1px 4px rgba(0,100,0,0.08); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 1; min-width: 0; padding: 9px 8px; border: none; border-radius: 10px; background: transparent; font-size: 12px; font-weight: 500; color: #5a7a5a; cursor: pointer; text-align: center; transition: all 0.25s; white-space: nowrap; font-family: 'Noto Sans JP', sans-serif; }
.tab.active { background: #d0ead0; color: #2d7a2d; font-weight: 700; box-shadow: 0 1px 5px rgba(0,100,0,0.08); }

.card { background: #ffffff; border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; box-shadow: 0 1px 6px rgba(0,100,0,0.08); border: 1px solid rgba(0,120,0,0.12); }
.row { display: grid; grid-template-columns: 86px 1fr 130px; align-items: center; gap: 8px; margin-bottom: 1rem; }
.row:last-child { margin-bottom: 0; }
.row label { font-size: 13px; color: #9ab09a; white-space: nowrap; overflow: hidden; }
.row input[type=range] { width: 100%; min-width: 0; -webkit-appearance: none; appearance: none; height: 3px; border-radius: 2px; outline: none; background: linear-gradient(to right, #2d7a2d var(--val, 0%), #d8d8d8 var(--val, 0%)); }
.row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #ffffff; border: 2px solid #2d7a2d; box-shadow: 0 1px 4px rgba(0,0,0,0.15); cursor: pointer; }
.row input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #ffffff; border: 2px solid #2d7a2d; box-shadow: 0 1px 4px rgba(0,0,0,0.15); cursor: pointer; }
.row input[type=range]::-moz-range-progress { background: #2d7a2d; height: 3px; border-radius: 2px; }
.row input[type=range]::-moz-range-track { height: 3px; background: #d8d8d8; border-radius: 2px; }
.row .right { display: flex; align-items: center; justify-content: flex-end; gap: 2px; overflow: hidden; }
.val-input { font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 700; text-align: right; color: #2d7a2d; border: none; background: transparent; outline: none; padding: 2px; -moz-appearance: textfield; cursor: pointer; max-width: 126px; }

<script>
function updateFill(el){
  const min=parseFloat(el.min)||0, max=parseFloat(el.max)||100, val=parseFloat(el.value)||0;
  const pct=((val-min)/(max-min)*100).toFixed(1)+'%';
  el.style.setProperty('--val',pct);
}
document.addEventListener('DOMContentLoaded',function(){
  document.querySelectorAll('input[type=range]').forEach(function(r){
    updateFill(r);
    r.addEventListener('input',function(){updateFill(this);});
  });
});
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
/* 背景パーティクル */
(function(){
  const canvas=document.getElementById('bg-canvas');
  const ctx=canvas.getContext('2d');
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
  window.addEventListener('resize',resize);resize();
  const SYMS={'ja':'¥','en':'$','ko':'₩','zh':'元'};
  function rand(a,b){return a+Math.random()*(b-a);}
  const bubbles=[];
  function mkB(){const r=rand(14,50);return{x:rand(0,canvas.width),y:canvas.height+r,r,speed:rand(0.2,0.55),drift:rand(-0.1,0.1),opacity:rand(0.015,0.038),wobble:rand(0,Math.PI*2),ws:rand(0.004,0.012)};}
  for(let i=0;i<16;i++){const b=mkB();b.y=rand(0,canvas.height);bubbles.push(b);}
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const sym=SYMS[window.currentLang||'ja'];
    bubbles.forEach(b=>{
      b.wobble+=b.ws;b.x+=Math.sin(b.wobble)*0.35+b.drift;b.y-=b.speed;
      if(b.y<-b.r*2)Object.assign(b,mkB());
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
      ctx.strokeStyle=`rgba(30,92,32,${b.opacity*1.5})`;ctx.lineWidth=1;ctx.stroke();
      ctx.fillStyle=`rgba(30,92,32,${b.opacity})`;ctx.fill();
      if(b.r>=18){ctx.save();ctx.globalAlpha=b.opacity*2.5;ctx.fillStyle='rgba(30,92,32,1)';ctx.font=`700 ${Math.round(b.r*0.6)}px Outfit,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(sym,b.x,b.y);ctx.restore();}
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

let chartD,chartM,chartL,chartG;
window.currentLang='ja';
const timers={};
let userData=null;

function pop(el){el.classList.remove('popping');void el.offsetWidth;el.classList.add('popping');el.addEventListener('animationend',()=>el.classList.remove('popping'),{once:true});}

const CUR={
  // スライダー最大はキリのいい数字。それ以上は手入力
  ja:{d_min:500,d_max:100000,d_step:500,d_def:500,m_min:100000,m_max:3000000,m_step:100000,m_def:100000,l_min:100000,l_max:10000000,l_step:100000,l_def:1000000,g_min:1000000,g_max:100000000,g_step:1000000,g_def:10000000},

function fmtInput(n){
  n=Math.round(n);const L=window.currentLang;
  if(L==='ja'){if(n>=1e8){const o=Math.floor(n/1e8),m=Math.floor((n%1e8)/1e4),y=n%1e4;let s=o+'億';if(m)s+=m+'万';if(y)s+=y+'円';if(!m&&!y)s+='円';return s;}if(n>=1e4){const m=Math.floor(n/1e4),y=n%1e4;return y?m+'万'+y+'円':m+'万円';}return n.toLocaleString()+'円';}
  if(L==='en'){if(n>=1e9)return '$'+(n/1e9).toFixed(1).replace(/\.0$/,'')+'B';if(n>=1e6)return '$'+(n/1e6).toFixed(1).replace(/\.0$/,'')+'M';if(n>=1e3)return '$'+(n/1e3).toFixed(1).replace(/\.0$/,'')+'K';return '$'+n.toLocaleString();}
  if(L==='ko'){if(n>=1e8){const e=Math.floor(n/1e8),m=Math.floor((n%1e8)/1e4),w=n%1e4;let s=e+'억';if(m)s+=m+'만';if(w)s+=w;return s+'원';}if(n>=1e4){const m=Math.floor(n/1e4),w=n%1e4;return w?m+'만'+w+'원':m+'만원';}return n.toLocaleString()+'원';}
  if(L==='zh'){if(n>=1e8){const y=Math.floor(n/1e8),w=Math.floor((n%1e8)/1e4),u=n%1e4;let s=y+'亿';if(w)s+=w+'万';if(u)s+=u+'元';if(!w&&!u)s+='元';return s;}if(n>=1e4){const w=Math.floor(n/1e4),u=n%1e4;return u?w+'万'+u+'元':w+'万元';}return n.toLocaleString()+'元';}
  return n.toLocaleString();
}
function fmt(n){
  const L=window.currentLang;
  if(L==='ja'){if(n>=1e8)return(Math.round(n/1e8*10)/10)+'億';if(n>=1e4)return Math.round(n/1e4)+'万';return Math.round(n).toLocaleString();}
  if(L==='zh'){if(n>=1e8)return(Math.round(n/1e8*10)/10)+'亿';if(n>=1e4)return Math.round(n/1e4)+'万';return Math.round(n).toLocaleString();}
  if(L==='ko'){if(n>=1e8)return(Math.round(n/1e8*10)/10)+'억';if(n>=1e4)return Math.round(n/1e4)+'만';return Math.round(n).toLocaleString();}
  if(n>=1e9)return(n/1e9).toFixed(1)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return Math.round(n/1e3)+'K';return Math.round(n).toLocaleString();
}
function fmtYr(y){return y+T[window.currentLang].yr;}

function moneyFocus(el){el.value=el.dataset.raw||'';el.select();}
function moneyBlur(el,sId,fn){const v=parseFloat(el.value.replace(/[^0-9.]/g,'')),r=(!isNaN(v)&&v>0)?v:parseFloat(el.dataset.raw||0);el.dataset.raw=r;el.value=fmtInput(r);const s=document.getElementById(sId);s.value=Math.min(Math.max(r,+s.min),+s.max);fn();}
function moneyType(el,sId,fn){const v=parseFloat(el.value.replace(/[^0-9.]/g,''));if(!isNaN(v)&&v>0){el.dataset.raw=v;const s=document.getElementById(sId);s.value=Math.min(Math.max(Math.min(v,1e10),+s.min),+s.max);fn();}}
function sliderToMoney(sId,nId){const v=+document.getElementById(sId).value,el=document.getElementById(nId);el.dataset.raw=v;el.value=fmtInput(v);}
function onSlider(sId,nId){document.getElementById(nId).value=+document.getElementById(sId).value;}
function onInput(nId,sId){const s=document.getElementById(sId),v=+document.getElementById(nId).value;if(!isNaN(v)&&v>0)s.value=Math.min(Math.max(v,+s.min),+s.max);}
function getMoney(id){const el=document.getElementById(id),r=parseFloat(el.dataset.raw||el.value.replace(/[^0-9.]/g,''));return(isNaN(r)||r<=0)?0:Math.min(r,1e10);}
function getV(id){const v=+document.getElementById(id).value;return(isNaN(v)||v<=0)?0:v;}

function countUp(id,to,pre='',dur=600){
  const el=document.getElementById(id);if(!el)return;
  if(timers[id])cancelAnimationFrame(timers[id]);
  const t0=performance.now();
  function tick(now){const p=Math.min((now-t0)/dur,1),e=1-Math.pow(1-p,3);el.textContent=pre+fmt(Math.round(to*e));if(p<1)timers[id]=requestAnimationFrame(tick);else el.textContent=pre+fmt(to);}
  timers[id]=requestAnimationFrame(tick);
}

function setSlider(id,min,max,step,def,nId){
  const s=document.getElementById(id);s.min=min;s.max=max;s.step=step;s.value=def;
  const n=document.getElementById(nId);n.dataset.raw=def;n.value=fmtInput(def);
}
function setSliders(){
  const c=CUR[window.currentLang],yr=T[window.currentLang].yr;
  setSlider('d-amount',c.d_min,c.d_max,c.d_step,c.d_def,'d-amount-n');
  setSlider('m-amount',c.m_min,c.m_max,c.m_step,c.m_def,'m-amount-n');
  setSlider('lp-amount',c.l_min,c.l_max,c.l_step,c.l_def,'lp-amount-n');
  setSlider('g-target',c.g_min,c.g_max,c.g_step,c.g_def,'g-target-n');
  ['d-rate','m-rate','lp-rate','g-rate'].forEach(id=>{document.getElementById(id).value=5;document.getElementById(id+'-n').value=5;});
  ['d-years','m-years','lp-years','g-years'].forEach(id=>{document.getElementById(id).value=20;document.getElementById(id+'-n').value=20;});
  ['u-yr-d','u-yr-m','u-yr-l','u-yr-g'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=yr;});
}

function setLang(lang){
  window.currentLang=lang;
  const sel=document.getElementById('lang-select');if(sel)sel.value=lang;
  const t=T[lang];
  document.getElementById('title').textContent=t.title;
  document.getElementById('tab-btn-d').textContent=t.tab1;document.getElementById('tab-btn-m').textContent=t.tab2;document.getElementById('tab-btn-l').textContent=t.tab3;document.getElementById('tab-btn-g').textContent=t.tab4;document.getElementById('tab-btn-p').textContent=t.tab5;
  document.getElementById('l-daily').textContent=t.daily;document.getElementById('l-rate-d').textContent=t.rate;document.getElementById('l-years-d').textContent=t.yearsD;
  document.getElementById('l-total-d').textContent=t.total;document.getElementById('l-gain-d').textContent=t.gain;document.getElementById('l-final-d').textContent=t.final;document.getElementById('l-chart-d').textContent=t.chart;
  document.getElementById('l-monthly').textContent=t.monthly;document.getElementById('l-rate-m').textContent=t.rate;document.getElementById('l-years-m').textContent=t.yearsM;
  document.getElementById('l-total-m').textContent=t.total;document.getElementById('l-gain-m').textContent=t.gain;document.getElementById('l-final-m').textContent=t.final;document.getElementById('l-chart-m').textContent=t.chart;
  document.getElementById('l-lump').textContent=t.lump;document.getElementById('l-rate-l').textContent=t.rate;document.getElementById('l-years-l').textContent=t.yearsL;
  document.getElementById('l-principal').textContent=t.principal;document.getElementById('l-gain-l').textContent=t.gain;document.getElementById('l-final-l').textContent=t.final;document.getElementById('l-chart-l').textContent=t.chart;
  document.getElementById('l-goal').textContent=t.goal;document.getElementById('l-rate-g').textContent=t.rate;document.getElementById('l-years-g').textContent=t.yearsG;
  document.getElementById('l-need').textContent=t.need;document.getElementById('l-total-g').textContent=t.total;document.getElementById('l-gain-g').textContent=t.gain;document.getElementById('l-chart-g').textContent=t.chart;
  if(document.getElementById('btn-apply'))document.getElementById('btn-apply').textContent=t.apply;
  setSliders();calcD();calcM();calcL();calcG();
  // マイページのメッセージも多言語化
  const nodataMsg={
    ja:'まだ情報が登録されていません。<br>LINEで「登録」と送って情報を登録してください😊',
    en:'No information registered yet.<br>Send "register" on LINE to get started😊',
    ko:'아직 정보가 등록되어 있지 않습니다.<br>LINE에서 "등록"을 보내 정보를 등록해주세요😊',
    zh:'尚未注册信息。<br>请在LINE上发送「注册」来登录信息😊'
  };
  const nodataEl=document.getElementById('nodata-msg');
  if(nodataEl)nodataEl.innerHTML=nodataMsg[lang]||nodataMsg.ja;
  // マイページのラベルも多言語化
  const mpLabels={
    ja:['総資産','目標資産','毎月投資額','年収','保有株','トレード銘柄','最終更新：'],
    en:['Total Assets','Target','Monthly Inv.','Annual Inc.','Holdings','Trading','Last Update: '],
    ko:['총자산','목표 자산','월 투자액','연수입','보유주식','트레이드 종목','최종 업데이트: '],
    zh:['总资产','目标资产','每月投资额','年收入','持有股票','交易股票','最终更新：']
  };
  const lb=mpLabels[lang]||mpLabels.ja;
  ['mp-label-assets','mp-label-target','mp-label-savings','mp-label-income','mp-label-stocks','mp-label-traded'].forEach((id,i)=>{const el=document.getElementById(id);if(el)el.textContent=lb[i];});
  window._mpLastUpdate=lb[6];
  if(userData)renderMyPage(userData);
}

function switchTab(name){
  ['daily','monthly','lump','goal','mypage'].forEach(n=>{
    const el=document.getElementById('tab-'+n);
    if(n===name){el.style.display='';el.classList.remove('tab-panel');void el.offsetWidth;el.classList.add('tab-panel');}
    else el.style.display='none';
  });
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',['daily','monthly','lump','goal','mypage'][i]===name));
  if(name==='daily')calcD();if(name==='monthly')calcM();if(name==='lump')calcL();if(name==='goal')calcG();if(name==='mypage')loadMyPage();
}

async function loadMyPage(){
  if(!UID){document.getElementById('mypage-loading').style.display='none';document.getElementById('mypage-nodata').style.display='';return;}
  document.getElementById('mypage-loading').style.display='';
  document.getElementById('mypage-content').style.display='none';
  document.getElementById('mypage-nodata').style.display='none';
  try{
    const res=await fetch(`/api/user-data?uid=${encodeURIComponent(UID)}`);
    const data=await res.json();
    document.getElementById('mypage-loading').style.display='none';
    if(data&&data.name){userData=data;renderMyPage(data);document.getElementById('mypage-content').style.display='';}
    else document.getElementById('mypage-nodata').style.display='';
  }catch(e){document.getElementById('mypage-loading').style.display='none';document.getElementById('mypage-nodata').style.display='';}
}

function renderMyPage(d){
  document.getElementById('mp-name').textContent=d.name||'—';
  const prefix=window._mpLastUpdate||'最終更新：';
  document.getElementById('mp-updated').textContent=prefix+(d.updated_at?d.updated_at.slice(0,10):'—');
  document.getElementById('mp-assets').textContent=d.target_asset||'—';
  document.getElementById('mp-target').textContent=d.target_asset||'—';
  document.getElementById('mp-savings').textContent=d.savings||'—';
  document.getElementById('mp-income').textContent=d.financial_info||'—';
  document.getElementById('mp-stocks').textContent=d.stocks_owned||'—';
  document.getElementById('mp-traded').textContent=d.stocks_traded||'—';
}

function applyToSimulator(){
  if(!userData)return;
  const c=CUR[window.currentLang];
  const savNum=parseFloat((userData.savings||'').replace(/[^0-9]/g,''))*10000||30000;
  const mEl=document.getElementById('m-amount');mEl.value=Math.min(Math.max(savNum,c.m_min),c.m_max);
  const mN=document.getElementById('m-amount-n');mN.dataset.raw=mEl.value;mN.value=fmtInput(+mEl.value);
  const tarNum=parseFloat((userData.target_asset||'').replace(/[^0-9]/g,''))*10000||10000000;
  const gEl=document.getElementById('g-target');gEl.value=Math.min(Math.max(tarNum,c.g_min),c.g_max);
  const gN=document.getElementById('g-target-n');gN.dataset.raw=gEl.value;gN.value=fmtInput(+gEl.value);
  calcM();calcG();switchTab('monthly');
}

function makeChart(id,labels,p,tot){
  const ctx=document.getElementById(id);if(!ctx)return null;
  const t=T[window.currentLang];
  return new Chart(ctx,{type:'line',data:{labels,datasets:[
    {label:t.p_label,data:p,borderColor:'#a5d6a7',backgroundColor:'rgba(165,214,167,0.15)',borderWidth:2,pointRadius:0,pointHoverRadius:5,fill:true,tension:0.3},
    {label:t.t_label,data:tot,borderColor:'#1e5c20',backgroundColor:'rgba(30,92,32,0.12)',borderWidth:2.5,pointRadius:0,pointHoverRadius:6,fill:true,tension:0.3}
  ]},options:{responsive:true,maintainAspectRatio:false,
    animation:{duration:700,easing:'easeInOutQuart'},
    interaction:{mode:'index',intersect:false},
    plugins:{
      legend:{display:true,position:'bottom',labels:{font:{size:12},boxWidth:12,padding:12,color:'#5a8a5c'}},
      tooltip:{
        mode:'index',intersect:false,
        backgroundColor:'rgba(6,20,8,0.9)',
        borderColor:'rgba(30,92,32,0.5)',borderWidth:1,
        titleFont:{family:'Outfit',size:14,weight:'700'},
        bodyFont:{size:12},
        padding:14,cornerRadius:6,
        titleColor:'#4dbb52',bodyColor:'#c8e8c8',
        callbacks:{
          title:items=>items[0].label+'目',
          label:c=>'  '+c.dataset.label+'：'+fmt(c.parsed.y)
        }
      }
    },
    scales:{
      x:{ticks:{font:{size:11},color:'#888',autoSkip:true,maxTicksLimit:10},grid:{color:'rgba(0,0,0,0.06)',drawBorder:false}},
      y:{ticks:{font:{size:11},color:'#888',callback:v=>fmt(v)},grid:{color:'rgba(0,0,0,0.06)',drawBorder:false}}
    }}});
}

function calcD(){
  const daily=getMoney('d-amount-n'),rate=getV('d-rate-n')/100/365,years=Math.round(getV('d-years-n'));
  let labels=[],p=[],tot=[];
  for(let y=1;y<=years;y++){const d=y*365,total=rate===0?daily*d:daily*((Math.pow(1+rate,d)-1)/rate)*(1+rate);labels.push(fmtYr(y));p.push(Math.round(daily*d));tot.push(Math.round(total));}
  const ft=tot[tot.length-1]||0,ti=daily*years*365;
  countUp('d-total',ti);countUp('d-gain',ft-ti,'+');countUp('d-final',ft);
  if(chartD)chartD.destroy();chartD=makeChart('chart-d',labels,p,tot);
}
function calcM(){
  const monthly=getMoney('m-amount-n'),rate=getV('m-rate-n')/100/12,years=Math.round(getV('m-years-n')),months=years*12;
  let labels=[],p=[],tot=[];
  for(let y=1;y<=years;y++){const m=y*12,total=rate===0?monthly*m:monthly*((Math.pow(1+rate,m)-1)/rate)*(1+rate);labels.push(fmtYr(y));p.push(Math.round(monthly*m));tot.push(Math.round(total));}
  const ft=tot[tot.length-1]||0,ti=monthly*months;
  countUp('m-total',ti);countUp('m-gain',ft-ti,'+');countUp('m-final',ft);
  if(chartM)chartM.destroy();chartM=makeChart('chart-m',labels,p,tot);
}
function calcL(){
  const init=getMoney('lp-amount-n'),rate=getV('lp-rate-n')/100,years=Math.round(getV('lp-years-n'));
  let labels=[],p=[],tot=[];
  for(let y=1;y<=years;y++){labels.push(fmtYr(y));p.push(Math.round(init));tot.push(Math.round(init*Math.pow(1+rate,y)));}
  const final=tot[tot.length-1]||0;
  countUp('lp-principal',init);countUp('lp-gain',final-init,'+');countUp('lp-final',final);
  if(chartL)chartL.destroy();chartL=makeChart('chart-l',labels,p,tot);
}
function calcG(){
  const target=getMoney('g-target-n'),ar=getV('g-rate-n')/100,years=Math.round(getV('g-years-n')),months=years*12,r=ar/12;
  const monthly=r===0?target/months:target*r/((Math.pow(1+r,months)-1)*(1+r)),ti=monthly*months;
  countUp('g-monthly',Math.ceil(monthly));countUp('g-total',ti);countUp('g-gain',target-ti,'+');
  let labels=[],p=[],tot=[];
  for(let y=1;y<=years;y++){const m=y*12,t=r===0?monthly*m:monthly*((Math.pow(1+r,m)-1)/r)*(1+r);labels.push(fmtYr(y));p.push(Math.round(monthly*m));tot.push(Math.round(t));}
  if(chartG)chartG.destroy();chartG=makeChart('chart-g',labels,p,tot);
}

async function init(){
  setSliders();calcD();calcM();calcL();calcG();
  if(UID){
    try{
      const res=await fetch(`/api/user-data?uid=${encodeURIComponent(UID)}`);
      const data=await res.json();
      if(data&&data.name){userData=data;applyToSimulator();}
    }catch(e){}
  }
}
init();
</script>
