<meta charset="UTF-8">

<title>Investment Simulator</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f0f5f0; color: #333; }

#bg-canvas {
position: fixed;
top: 0; left: 0;
width: 100%; height: 100%;
pointer-events: none;
z-index: 0;
}

.wrap {
position: relative;
z-index: 1;
max-width: 680px;
margin: 0 auto;
padding: 1.5rem 1rem;
}

h1 { font-size: 20px; font-weight: 600; color: #1e5c20; margin-bottom: 1rem; text-align: center; }

.lang-bar { display: flex; gap: 4px; justify-content: center; margin-bottom: 1.8rem; }
.lang-btn { background: none; border: none; font-size: 12px; color: #aaa; padding: 4px 10px 8px; cursor: pointer; position: relative; letter-spacing: 0.3px; transition: color 0.2s; }
.lang-btn.active { color: #1e5c20; font-weight: 700; }
.lang-btn.active::after { content: ‘’; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 5px; height: 5px; background: #1e5c20; border-radius: 50%; }
.lang-btn + .lang-btn::before { content: ‘|’; position: absolute; left: -1px; color: #ddd; font-weight: 300; }

.tabs { display: flex; justify-content: center; background: #deeede; border-radius: 14px; padding: 4px; gap: 3px; margin-bottom: 1.5rem; box-shadow: inset 0 1px 4px rgba(0,0,0,0.1); }
.tab { flex: 1; max-width: 180px; padding: 9px 10px; border: none; border-radius: 10px; background: transparent; font-size: 13px; font-weight: 500; color: #5a7a5a; cursor: pointer; text-align: center; transition: all 0.25s; }
.tab.active { background: white; color: #1e5c20; font-weight: 700; box-shadow: 0 1px 5px rgba(0,0,0,0.13); }

@keyframes popPress { 0%{transform:scale(1)} 25%{transform:scale(0.86)} 65%{transform:scale(1.13)} 100%{transform:scale(1)} }
.popping { animation: popPress 0.38s cubic-bezier(0.34,1.56,0.64,1) forwards; }
@keyframes fadeSlideIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
.tab-panel { animation: fadeSlideIn 0.35s ease forwards; }

.card { background: rgba(255,255,255,0.93); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }

.row {
display: grid;
grid-template-columns: 86px 1fr 108px;
align-items: center;
gap: 8px;
margin-bottom: 1rem;
}
.row:last-child { margin-bottom: 0; }
.row label { font-size: 12px; color: #666; white-space: nowrap; overflow: hidden; }
.row input[type=range] { width: 100%; min-width: 0; accent-color: #1e5c20; }
.row .right { display: flex; align-items: center; justify-content: flex-end; gap: 2px; overflow: hidden; }
.val-input { font-size: 12.5px; font-weight: 600; text-align: right; color: #1e5c20; border: none; background: transparent; outline: none; padding: 2px 2px; -moz-appearance: textfield; cursor: pointer; }
.val-input::-webkit-outer-spin-button, .val-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.val-input:focus { cursor: text; }
.val-input.money { width: 100px; }
.val-input.rate  { width: 40px; }
.val-input.years { width: 34px; }
.unit { font-size: 12px; font-weight: 600; color: #333; white-space: nowrap; }

.result-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 1rem; }
.metric { background: rgba(240,247,240,0.95); border-radius: 8px; padding: 12px; text-align: center; }
.metric .mlabel { font-size: 11px; color: #666; margin-bottom: 4px; }
.metric .mval { font-size: 16px; font-weight: 600; color: #1e5c20; }
.section-title { font-size: 14px; font-weight: 600; color: #333; margin-bottom: 12px; }
.chart-wrap { position: relative; width: 100%; height: 260px; }
</style>
<script>

    document.body.appendChild(b);
  });
}
</script>

<body>

<canvas id="bg-canvas"></canvas>

<div class="wrap">
  <h1>💹 <span id="title">投資シミュレーター</span></h1>

  <div class="lang-bar">
    <button class="lang-btn active" onclick="pop(this);setLang('ja')">日本語</button>
    <button class="lang-btn" onclick="pop(this);setLang('en')">English</button>
    <button class="lang-btn" onclick="pop(this);setLang('ko')">한국어</button>
    <button class="lang-btn" onclick="pop(this);setLang('zh')">中文</button>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="pop(this);switchTab('tsumitate')" id="tab-btn-t">積立</button>
    <button class="tab" onclick="pop(this);switchTab('ikkatsu')" id="tab-btn-i">一括投資</button>
    <button class="tab" onclick="pop(this);switchTab('gyaku')" id="tab-btn-g">目標逆算</button>
  </div>

  <!-- 積立 -->

  <div id="tab-tsumitate" class="tab-panel">
    <div class="card">
      <div class="row"><label id="l-monthly">毎月の積立額</label><input type="range" id="t-monthly" oninput="sliderToMoney('t-monthly','t-monthly-n');calcT()"><div class="right"><input type="text" class="val-input money" id="t-monthly-n" onfocus="moneyFocus(this)" onblur="moneyBlur(this,'t-monthly',calcT)" oninput="moneyType(this,'t-monthly',calcT)"></div></div>
      <div class="row"><label id="l-rate-t">年利回り</label><input type="range" min="0.1" max="20" step="0.1" value="5" id="t-rate" oninput="onSlider('t-rate','t-rate-n');calcT()"><div class="right"><input type="number" class="val-input rate" id="t-rate-n" min="0.1" max="20" step="0.1" oninput="onInput('t-rate-n','t-rate');calcT()"><span class="unit">%</span></div></div>
      <div class="row"><label id="l-years-t">積立期間</label><input type="range" min="1" max="100" step="1" value="20" id="t-years" oninput="onSlider('t-years','t-years-n');calcT()"><div class="right"><input type="number" class="val-input years" id="t-years-n" min="1" max="100" step="1" oninput="onInput('t-years-n','t-years');calcT()"><span class="unit" id="u-yr-t">年</span></div></div>
    </div>
    <div class="result-grid">
      <div class="metric"><div class="mlabel" id="l-total">総積立額</div><div class="mval" id="t-total"></div></div>
      <div class="metric"><div class="mlabel" id="l-gain-t">利益</div><div class="mval" id="t-gain"></div></div>
      <div class="metric"><div class="mlabel" id="l-final-t">総資産</div><div class="mval" id="t-final"></div></div>
    </div>
    <div class="card"><p class="section-title" id="l-chart-t">資産推移グラフ</p><div class="chart-wrap"><canvas id="chart-t"></canvas></div></div>
  </div>

  <!-- 一括投資 -->

  <div id="tab-ikkatsu" class="tab-panel" style="display:none">
    <div class="card">
      <div class="row"><label id="l-init">初期投資額</label><input type="range" id="i-init" oninput="sliderToMoney('i-init','i-init-n');calcI()"><div class="right"><input type="text" class="val-input money" id="i-init-n" onfocus="moneyFocus(this)" onblur="moneyBlur(this,'i-init',calcI)" oninput="moneyType(this,'i-init',calcI)"></div></div>
      <div class="row"><label id="l-rate-i">年利回り</label><input type="range" min="0.1" max="20" step="0.1" value="5" id="i-rate" oninput="onSlider('i-rate','i-rate-n');calcI()"><div class="right"><input type="number" class="val-input rate" id="i-rate-n" min="0.1" max="20" step="0.1" oninput="onInput('i-rate-n','i-rate');calcI()"><span class="unit">%</span></div></div>
      <div class="row"><label id="l-years-i">運用期間</label><input type="range" min="1" max="100" step="1" value="20" id="i-years" oninput="onSlider('i-years','i-years-n');calcI()"><div class="right"><input type="number" class="val-input years" id="i-years-n" min="1" max="100" step="1" oninput="onInput('i-years-n','i-years');calcI()"><span class="unit" id="u-yr-i">年</span></div></div>
    </div>
    <div class="result-grid">
      <div class="metric"><div class="mlabel" id="l-principal">元本</div><div class="mval" id="i-principal"></div></div>
      <div class="metric"><div class="mlabel" id="l-gain-i">利益</div><div class="mval" id="i-gain"></div></div>
      <div class="metric"><div class="mlabel" id="l-final-i">総資産</div><div class="mval" id="i-final"></div></div>
    </div>
    <div class="card"><p class="section-title" id="l-chart-i">資産推移グラフ</p><div class="chart-wrap"><canvas id="chart-i"></canvas></div></div>
  </div>

  <!-- 目標逆算 -->

  <div id="tab-gyaku" class="tab-panel" style="display:none">
    <div class="card">
      <div class="row"><label id="l-target">目標資産</label><input type="range" id="g-target" oninput="sliderToMoney('g-target','g-target-n');calcG()"><div class="right"><input type="text" class="val-input money" id="g-target-n" onfocus="moneyFocus(this)" onblur="moneyBlur(this,'g-target',calcG)" oninput="moneyType(this,'g-target',calcG)"></div></div>
      <div class="row"><label id="l-rate-g">年利回り</label><input type="range" min="0.1" max="20" step="0.1" value="5" id="g-rate" oninput="onSlider('g-rate','g-rate-n');calcG()"><div class="right"><input type="number" class="val-input rate" id="g-rate-n" min="0.1" max="20" step="0.1" oninput="onInput('g-rate-n','g-rate');calcG()"><span class="unit">%</span></div></div>
      <div class="row"><label id="l-years-g">達成期間</label><input type="range" min="1" max="100" step="1" value="20" id="g-years" oninput="onSlider('g-years','g-years-n');calcG()"><div class="right"><input type="number" class="val-input years" id="g-years-n" min="1" max="100" step="1" oninput="onInput('g-years-n','g-years');calcG()"><span class="unit" id="u-yr-g">年</span></div></div>
    </div>
    <div class="result-grid">
      <div class="metric"><div class="mlabel" id="l-need">必要毎月積立</div><div class="mval" id="g-monthly"></div></div>
      <div class="metric"><div class="mlabel" id="l-total-g">総積立額</div><div class="mval" id="g-total"></div></div>
      <div class="metric"><div class="mlabel" id="l-gain-g">利益</div><div class="mval" id="g-gain"></div></div>
    </div>
    <div class="card"><p class="section-title" id="l-chart-g">資産推移グラフ</p><div class="chart-wrap"><canvas id="chart-g"></canvas></div></div>
  </div>
</div>
