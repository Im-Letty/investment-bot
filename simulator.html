<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f0f5f0; color: #333; }

#bg-canvas { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }

.wrap { position: relative; z-index:1; max-width:680px; margin:0 auto; padding:1.5rem 1rem; }

h1 { font-size:20px; font-weight:600; color:#1e5c20; margin-bottom:1rem; text-align:center; }

.lang-btn.active { color:#1e5c20; font-weight:700; }
.lang-btn.active::after { content:''; position:absolute; bottom:2px; left:50%; transform:translateX(-50%); width:5px; height:5px; background:#1e5c20; border-radius:50%; }
.lang-btn + .lang-btn::before { content:'|'; position:absolute; left:-1px; color:#ddd; }

.tabs { display:flex; justify-content:center; background:#deeede; border-radius:14px; padding:4px; gap:3px; margin-bottom:1.5rem; box-shadow:inset 0 1px 4px rgba(0,0,0,0.1); flex-wrap:nowrap; overflow-x:auto; }
.tab { flex:1; min-width:0; padding:9px 4px; border:none; border-radius:10px; background:transparent; font-size:11px; font-weight:500; color:#5a7a5a; cursor:pointer; text-align:center; transition:all 0.25s; white-space:nowrap; }
.tab.active { background:white; color:#1e5c20; font-weight:700; box-shadow:0 1px 5px rgba(0,0,0,0.13); }

@keyframes popPress { 0%{transform:scale(1)} 25%{transform:scale(0.86)} 65%{transform:scale(1.13)} 100%{transform:scale(1)} }
.popping { animation:popPress 0.38s cubic-bezier(0.34,1.56,0.64,1) forwards; }
@keyframes fadeSlideIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
.tab-panel { animation:fadeSlideIn 0.35s ease forwards; }

.card { background:rgba(255,255,255,0.93); border-radius:12px; padding:1.25rem; margin-bottom:1rem; box-shadow:0 1px 4px rgba(0,0,0,0.08); }

/* スライダー行 */
.row { display:grid; grid-template-columns:90px 1fr 110px; align-items:center; gap:8px; margin-bottom:1rem; }
.row:last-child { margin-bottom:0; }
.row label { font-size:12px; color:#666; white-space:nowrap; overflow:hidden; }
.row input[type=range] { width:100%; min-width:0; accent-color:#1e5c20; }
.row .right { display:flex; align-items:center; justify-content:flex-end; gap:2px; overflow:hidden; }
.val-input { font-size:12.5px; font-weight:600; text-align:right; color:#1e5c20; border:none; background:transparent; outline:none; padding:2px; -moz-appearance:textfield; cursor:pointer; }

.val-input.money { width:105px; }
.val-input.rate  { width:40px; }
.val-input.years { width:34px; }
.unit { font-size:12px; font-weight:600; color:#333; white-space:nowrap; }

.metric { background:rgba(255,255,255,0.93); border-radius:12px; padding:14px 10px; text-align:center; box-shadow:0 1px 4px rgba(0,0,0,0.08); }

<script>
/* ---- 背景：うっすら泡（通貨マーク入り） ---- */
(function() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
  window.addEventListener('resize',resize); resize();
  const bubbles=[];
  function rand(a,b){return a+Math.random()*(b-a);}
  const SYMBOLS={'ja':'¥','en':'$','ko':'₩','zh':'元'};
  function createBubble(){
    const r=rand(14,48);
    return{x:rand(0,canvas.width),y:canvas.height+r,r,
      speed:rand(0.2,0.55),drift:rand(-0.1,0.1),
      opacity:rand(0.015,0.038),
      wobble:rand(0,Math.PI*2),wobbleSpeed:rand(0.004,0.012),
      showSym:true};
  }
  for(let i=0;i<16;i++){const b=createBubble();b.y=rand(0,canvas.height);bubbles.push(b);}
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const sym=SYMBOLS[window.currentLang||'ja'];
    bubbles.forEach(b=>{
      b.wobble+=b.wobbleSpeed;
      b.x+=Math.sin(b.wobble)*0.35+b.drift;
      b.y-=b.speed;
      if(b.y<-b.r*2)Object.assign(b,createBubble());
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
      ctx.strokeStyle=`rgba(30,92,32,${b.opacity*1.4})`;
      ctx.lineWidth=1;ctx.stroke();
      ctx.fillStyle=`rgba(30,92,32,${b.opacity})`;ctx.fill();
      if(b.showSym&&b.r>=20){
        ctx.save();
        ctx.globalAlpha=b.opacity*2.2;
        ctx.fillStyle='rgba(30,92,32,1)';
        ctx.font=`700 ${Math.round(b.r*0.62)}px sans-serif`;
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(sym,b.x,b.y);
        ctx.restore();
      }
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

const T={
  ja:{title:'投資シミュレーター',tab1:'毎日積立',tab2:'毎月積立',tab3:'初期投資',tab4:'目標資産',tab5:'👤 マイページ',

      daily:'매일 적립액',monthly:'월 적립액',lump:'초기 투자액',goal:'목표 자산',
      rate:'연 수익률',yearsD:'적립 기간',yearsM:'적립 기간',yearsL:'운용 기간',yearsG:'달성 기간',
      total:'총 적립액',gain:'수익',final:'총자산',principal:'원금',need:'필요 월 적립액',
      chart:'자산 추이 그래프',yr:'년',p_label:'원금',t_label:'총자산',apply:'시뮬레이터에 반영'},
  zh:{title:'投资模拟器',tab1:'每日定投',tab2:'每月定投',tab3:'一次性投资',tab4:'目标资产',tab5:'👤 我的页面',
      daily:'每日金额',monthly:'每月金额',lump:'初始投资额',goal:'目标金额',
      rate:'年收益率',yearsD:'投资期限',yearsM:'投资期限',yearsL:'投资期限',yearsG:'达成期限',
      total:'总投入',gain:'收益',final:'总资产',principal:'本金',need:'每月所需',
      chart:'资产增长图',yr:'年',p_label:'本金',t_label:'总资产',apply:'应用到模拟器'}
};

function fmtInput(n){
  n=Math.round(n);
  const lang=window.currentLang;
  if(lang==='ja'){if(n>=1e8){const o=Math.floor(n/1e8),m=Math.floor((n%1e8)/1e4),y=n%1e4;let s=o+'億';if(m)s+=m+'万';if(y)s+=y+'円';if(!m&&!y)s+='円';return s;}if(n>=1e4){const m=Math.floor(n/1e4),y=n%1e4;return y?m+'万'+y+'円':m+'万円';}return n.toLocaleString()+'円';}
  if(lang==='en'){if(n>=1e9)return '$'+(n/1e9).toFixed(1).replace(/\.0$/,'')+'B';if(n>=1e6)return '$'+(n/1e6).toFixed(1).replace(/\.0$/,'')+'M';if(n>=1e3)return '$'+(n/1e3).toFixed(1).replace(/\.0$/,'')+'K';return '$'+n.toLocaleString();}
  if(lang==='ko'){if(n>=1e8){const e=Math.floor(n/1e8),m=Math.floor((n%1e8)/1e4),w=n%1e4;let s=e+'억';if(m)s+=m+'만';if(w)s+=w;return s+'원';}if(n>=1e4){const m=Math.floor(n/1e4),w=n%1e4;return w?m+'만'+w+'원':m+'만원';}return n.toLocaleString()+'원';}
  if(lang==='zh'){if(n>=1e8){const y=Math.floor(n/1e8),w=Math.floor((n%1e8)/1e4),u=n%1e4;let s=y+'亿';if(w)s+=w+'万';if(u)s+=u+'元';if(!w&&!u)s+='元';return s;}if(n>=1e4){const w=Math.floor(n/1e4),u=n%1e4;return u?w+'万'+u+'元':w+'万元';}return n.toLocaleString()+'元';}
  return n.toLocaleString();
}

function fmt(n){
  const lang=window.currentLang;
  if(lang==='ja'){if(n>=1e8)return(Math.round(n/1e8*10)/10)+'億';if(n>=1e4)return Math.round(n/1e4)+'万';return Math.round(n).toLocaleString();}
  if(lang==='zh'){if(n>=1e8)return(Math.round(n/1e8*10)/10)+'亿';if(n>=1e4)return Math.round(n/1e4)+'万';return Math.round(n).toLocaleString();}
  if(lang==='ko'){if(n>=1e8)return(Math.round(n/1e8*10)/10)+'억';if(n>=1e4)return Math.round(n/1e4)+'만';return Math.round(n).toLocaleString();}
  if(n>=1e9)return(n/1e9).toFixed(1)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return Math.round(n/1e3)+'K';return Math.round(n).toLocaleString();
}
function fmtYr(y){return y+T[window.currentLang].yr;}

function moneyFocus(el){el.value=el.dataset.raw||'';el.select();}
function moneyBlur(el,sId,fn){const v=parseFloat(el.value.replace(/[^0-9.]/g,'')),r=(!isNaN(v)&&v>0)?v:parseFloat(el.dataset.raw||0);el.dataset.raw=r;el.value=fmtInput(r);const s=document.getElementById(sId);s.value=Math.min(Math.max(r,+s.min),+s.max);fn();}
function moneyType(el,sId,fn){const v=parseFloat(el.value.replace(/[^0-9.]/g,''));if(!isNaN(v)&&v>0){el.dataset.raw=v;const s=document.getElementById(sId);s.value=Math.min(Math.max(v,+s.min),+s.max);fn();}}
function sliderToMoney(sId,nId){const v=+document.getElementById(sId).value,el=document.getElementById(nId);el.dataset.raw=v;el.value=fmtInput(v);}
function onSlider(sId,nId){document.getElementById(nId).value=+document.getElementById(sId).value;}
function onInput(nId,sId){const s=document.getElementById(sId),v=+document.getElementById(nId).value;if(!isNaN(v)&&v>0)s.value=Math.min(Math.max(v,+s.min),+s.max);}
function getMoney(id){const el=document.getElementById(id),r=parseFloat(el.dataset.raw||el.value.replace(/[^0-9.]/g,''));return(isNaN(r)||r<=0)?0:r;}
function getV(id){const v=+document.getElementById(id).value;return(isNaN(v)||v<=0)?0:v;}

function countUp(id,to,pre='',dur=550){
  const el=document.getElementById(id);if(!el)return;
  if(timers[id])cancelAnimationFrame(timers[id]);
  const t0=performance.now();
  function tick(now){const p=Math.min((now-t0)/dur,1),e=1-Math.pow(1-p,3);el.textContent=pre+fmt(Math.round(to*e));if(p<1)timers[id]=requestAnimationFrame(tick);else el.textContent=pre+fmt(to);}
  timers[id]=requestAnimationFrame(tick);
}

function setSlider(id,min,max,step,def,nId){
  const s=document.getElementById(id);s.min=min;s.max=max;s.step=step;s.value=def;
  const n=document.getElementById(nId);n.dataset.raw=def;n.value=fmtInput(def);
}

function setSliders(){
  const c=CUR[window.currentLang],yr=T[window.currentLang].yr;
  setSlider('d-amount',c.d_min,c.d_max,c.d_step,c.d_def,'d-amount-n');
  setSlider('m-amount',c.m_min,c.m_max,c.m_step,c.m_def,'m-amount-n');
  setSlider('lp-amount',c.l_min,c.l_max,c.l_step,c.l_def,'lp-amount-n');
  setSlider('g-target',c.g_min,c.g_max,c.g_step,c.g_def,'g-target-n');
  ['d-rate','m-rate','lp-rate','g-rate'].forEach(id=>{document.getElementById(id).value=5;document.getElementById(id+'-n').value=5;});
  ['d-years','m-years','lp-years','g-years'].forEach(id=>{document.getElementById(id).value=20;document.getElementById(id+'-n').value=20;});
  ['u-yr-d','u-yr-m','u-yr-l','u-yr-g'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=yr;});
}

function setLang(lang){
  window.currentLang=lang;
  document.querySelectorAll('.lang-btn').forEach((b,i)=>b.classList.toggle('active',['ja','en','ko','zh'][i]===lang));
  const t=T[lang];

  document.getElementById('tab-btn-d').textContent=t.tab1;
  document.getElementById('tab-btn-m').textContent=t.tab2;
  document.getElementById('tab-btn-l').textContent=t.tab3;
  document.getElementById('tab-btn-g').textContent=t.tab4;
  document.getElementById('tab-btn-p').textContent=t.tab5;
  document.getElementById('l-daily').textContent=t.daily;
  document.getElementById('l-rate-d').textContent=t.rate;
  document.getElementById('l-years-d').textContent=t.yearsD;
  document.getElementById('l-total-d').textContent=t.total;
  document.getElementById('l-gain-d').textContent=t.gain;
  document.getElementById('l-final-d').textContent=t.final;
  document.getElementById('l-chart-d').textContent=t.chart;
  document.getElementById('l-monthly').textContent=t.monthly;
  document.getElementById('l-rate-m').textContent=t.rate;
  document.getElementById('l-years-m').textContent=t.yearsM;
  document.getElementById('l-total-m').textContent=t.total;
  document.getElementById('l-gain-m').textContent=t.gain;
  document.getElementById('l-final-m').textContent=t.final;
  document.getElementById('l-chart-m').textContent=t.chart;
  document.getElementById('l-lump').textContent=t.lump;
  document.getElementById('l-rate-l').textContent=t.rate;
  document.getElementById('l-years-l').textContent=t.yearsL;
  document.getElementById('l-principal').textContent=t.principal;
  document.getElementById('l-gain-l').textContent=t.gain;
  document.getElementById('l-final-l').textContent=t.final;
  document.getElementById('l-chart-l').textContent=t.chart;
  document.getElementById('l-goal').textContent=t.goal;
  document.getElementById('l-rate-g').textContent=t.rate;
  document.getElementById('l-years-g').textContent=t.yearsG;
  document.getElementById('l-need').textContent=t.need;
  document.getElementById('l-total-g').textContent=t.total;
  document.getElementById('l-gain-g').textContent=t.gain;
  document.getElementById('l-chart-g').textContent=t.chart;
  if(document.getElementById('btn-apply'))document.getElementById('btn-apply').textContent=t.apply;
  setSliders();calcD();calcM();calcL();calcG();
  if(userData)renderMyPage(userData);
}

function switchTab(name){
  ['daily','monthly','lump','goal','mypage'].forEach(n=>{
    const el=document.getElementById('tab-'+n);
    if(n===name){el.style.display='';el.classList.remove('tab-panel');void el.offsetWidth;el.classList.add('tab-panel');}
    else el.style.display='none';
  });
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',['daily','monthly','lump','goal','mypage'][i]===name));
  if(name==='daily')calcD();
  if(name==='monthly')calcM();
  if(name==='lump')calcL();
  if(name==='goal')calcG();
  if(name==='mypage')loadMyPage();
}

/* ---- マイページ：Supabaseからデータ取得 ---- */
async function loadMyPage(){
  if(!UID){
    document.getElementById('mypage-loading').style.display='none';
    document.getElementById('mypage-nodata').style.display='';
    return;
  }
  document.getElementById('mypage-loading').style.display='';
  document.getElementById('mypage-content').style.display='none';
  document.getElementById('mypage-nodata').style.display='none';
  try{
    const res=await fetch(`/api/user-data?uid=${encodeURIComponent(UID)}`);
    const data=await res.json();
    document.getElementById('mypage-loading').style.display='none';
    if(data&&data.name){
      userData=data;
      renderMyPage(data);
      document.getElementById('mypage-content').style.display='';
    } else {
      document.getElementById('mypage-nodata').style.display='';
    }
  }catch(e){
    document.getElementById('mypage-loading').style.display='none';
    document.getElementById('mypage-nodata').style.display='';
  }
}

function renderMyPage(data){
  document.getElementById('mp-name').textContent=data.name||'—';
  document.getElementById('mp-updated').textContent=data.updated_at?'最終更新：'+data.updated_at.slice(0,10):'—';
  document.getElementById('mp-assets').textContent=data.target_asset||'—';
  document.getElementById('mp-target').textContent=data.target_asset||'—';
  document.getElementById('mp-savings').textContent=data.savings||'—';
  document.getElementById('mp-income').textContent=data.financial_info||'—';
  document.getElementById('mp-stocks').textContent=data.stocks_owned||'—';
  document.getElementById('mp-traded').textContent=data.stocks_traded||'—';
}

/* シミュレーターに反映 */
function applyToSimulator(){
  if(!userData)return;
  // 毎月の積立額を反映
  const savings=userData.savings||'';
  const savingsNum=parseFloat(savings.replace(/[^0-9]/g,''))*10000||30000;
  const c=CUR[window.currentLang];
  const mEl=document.getElementById('m-amount');
  mEl.value=Math.min(Math.max(savingsNum,c.m_min),c.m_max);
  const mNEl=document.getElementById('m-amount-n');
  mNEl.dataset.raw=mEl.value;mNEl.value=fmtInput(+mEl.value);
  // 目標資産を反映
  const targetNum=parseFloat((userData.target_asset||'').replace(/[^0-9]/g,''))*10000||10000000;
  const gEl=document.getElementById('g-target');
  gEl.value=Math.min(Math.max(targetNum,c.g_min),c.g_max);
  const gNEl=document.getElementById('g-target-n');
  gNEl.dataset.raw=gEl.value;gNEl.value=fmtInput(+gEl.value);
  calcM();calcG();
  switchTab('monthly');
}

function makeChart(id,labels,p,tot){
  const ctx=document.getElementById(id);if(!ctx)return null;
  const t=T[window.currentLang];
  return new Chart(ctx,{type:'line',data:{labels,datasets:[
    {label:t.p_label,data:p,borderColor:'#a5d6a7',backgroundColor:'rgba(165,214,167,0.15)',borderWidth:2,pointRadius:2,fill:true,tension:0.3},
    {label:t.t_label,data:tot,borderColor:'#1e5c20',backgroundColor:'rgba(30,92,32,0.08)',borderWidth:2.5,pointRadius:2,fill:true,tension:0.3}
  ]},options:{responsive:true,maintainAspectRatio:false,animation:{duration:700,easing:'easeInOutQuart'},
    plugins:{legend:{display:true,position:'bottom',labels:{font:{size:12},boxWidth:12,padding:12}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+fmt(c.parsed.y)}}},
    scales:{x:{ticks:{font:{size:11},autoSkip:true,maxTicksLimit:8}},y:{ticks:{font:{size:11},callback:v=>fmt(v)}}}}});
}

function calcD(){
  const daily=getMoney('d-amount-n'),rate=getV('d-rate-n')/100/365,years=Math.round(getV('d-years-n'));
  let labels=[],p=[],tot=[];
  for(let y=1;y<=years;y++){const d=y*365,total=rate===0?daily*d:daily*((Math.pow(1+rate,d)-1)/rate)*(1+rate);labels.push(fmtYr(y));p.push(Math.round(daily*d));tot.push(Math.round(total));}
  const ft=tot[tot.length-1]||0,ti=daily*years*365;
  countUp('d-total',ti);countUp('d-gain',ft-ti,'+');countUp('d-final',ft);
  if(chartD)chartD.destroy();chartD=makeChart('chart-d',labels,p,tot);
}
function calcM(){
  const monthly=getMoney('m-amount-n'),rate=getV('m-rate-n')/100/12,years=Math.round(getV('m-years-n')),months=years*12;
  let labels=[],p=[],tot=[];
  for(let y=1;y<=years;y++){const m=y*12,total=rate===0?monthly*m:monthly*((Math.pow(1+rate,m)-1)/rate)*(1+rate);labels.push(fmtYr(y));p.push(Math.round(monthly*m));tot.push(Math.round(total));}
  const ft=tot[tot.length-1]||0,ti=monthly*months;
  countUp('m-total',ti);countUp('m-gain',ft-ti,'+');countUp('m-final',ft);
  if(chartM)chartM.destroy();chartM=makeChart('chart-m',labels,p,tot);
}
function calcL(){
  const init=getMoney('lp-amount-n'),rate=getV('lp-rate-n')/100,years=Math.round(getV('lp-years-n'));
  let labels=[],p=[],tot=[];
  for(let y=1;y<=years;y++){labels.push(fmtYr(y));p.push(Math.round(init));tot.push(Math.round(init*Math.pow(1+rate,y)));}
  const final=tot[tot.length-1]||0;
  countUp('lp-principal',init);countUp('lp-gain',final-init,'+');countUp('lp-final',final);
  if(chartL)chartL.destroy();chartL=makeChart('chart-l',labels,p,tot);
}
function calcG(){
  const target=getMoney('g-target-n'),ar=getV('g-rate-n')/100,years=Math.round(getV('g-years-n')),months=years*12,r=ar/12;
  const monthly=r===0?target/months:target*r/((Math.pow(1+r,months)-1)*(1+r)),ti=monthly*months;
  countUp('g-monthly',Math.ceil(monthly));countUp('g-total',ti);countUp('g-gain',target-ti,'+');
  let labels=[],p=[],tot=[];
  for(let y=1;y<=years;y++){const m=y*12,t=r===0?monthly*m:monthly*((Math.pow(1+r,m)-1)/r)*(1+r);labels.push(fmtYr(y));p.push(Math.round(monthly*m));tot.push(Math.round(t));}
  if(chartG)chartG.destroy();chartG=makeChart('chart-g',labels,p,tot);
}

// 起動時：UIDがあれば自動でマイページデータ取得してスライダーに反映
async function init(){
  setSliders();calcD();calcM();calcL();calcG();
  if(UID){
    try{
      const res=await fetch(`/api/user-data?uid=${encodeURIComponent(UID)}`);
      const data=await res.json();
      if(data&&data.name){
        userData=data;
        // 自動でスライダーに反映
        applyToSimulator();
      }
    }catch(e){}
  }
}
init();
</script>
