# Keep-alive ping for the Render free-plan deployment.
# Pings the public production URL on a schedule so the server is less
# likely to spin down after ~15 min of inactivity (which causes 503s on
# the next visit while it cold-starts).
#
# Notes:
# - GitHub Actions cron is best-effort: it can be delayed by several
#   minutes or skipped under load, so this does NOT guarantee zero sleep.
#   For a hard guarantee, use a paid Render plan (owner task).
# - Render free tier has a monthly run-time cap (~750 hours). Keeping the
#   service awake via pings consumes that budget faster and may cause the
#   service to stop near month-end once the cap is reached.
# - No secrets/tokens needed: this only sends a GET to a public URL.

name: keep-alive

on:
  schedule:
    # Roughly every 10 minutes (GitHub may delay/throttle this).
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping production URL
        run: |
          URL="https://investment-bot-ta24.onrender.com"
          echo "Pinging $URL"
          code=$(curl -sS -o /dev/null -w "%{http_code}" -L --max-time 60 "$URL")
          echo "HTTP status: $code"
