name: Daily website news
on:
  schedule:
    # Wake from 04:47 JST to absorb observed scheduler delays. This only wakes
    # the host; the server still collects at 07:00 and releases at 08:00.
    # Standard Ubuntu runners are free for this public repository.
    - cron: '47 19,20,21 * * *'
    - cron: '17,47 22 * * *'
    - cron: '17 23,0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-website-news
  cancel-in-progress: false
jobs:
  prepare-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 245
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Keep the website awake and verify the morning edition
        run: python scripts/check_daily_news.py
