name: Daily website news
on:
  schedule:
    # Wake at 06:47 Japan time, ahead of 07:00 preparation / 08:00 release.
    # Later schedules also recover from delayed or missed scheduled runs.
    - cron: '47 21 * * *'
    - cron: '17,47 22 * * *'
    - cron: '17 23,0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-website-news
  cancel-in-progress: false
jobs:
  prepare-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
      - name: Keep the website awake and verify the morning edition
        run: python scripts/check_daily_news.py
