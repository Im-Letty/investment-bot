<style>
#pet-card{margin:14px 0;border-radius:20px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.12);background:#fffef8;text-align:center;font-family:inherit}
#pgScene{position:relative;height:330px;overflow:hidden;transition:background 1.2s;touch-action:none}
#pgEnv{position:absolute;inset:0;pointer-events:none}
#pgSun{position:absolute;top:18px;right:22px;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#ffd95e);box-shadow:0 0 30px 6px rgba(255,220,110,.55)}
#pgMoon{position:absolute;top:20px;right:26px;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 38% 35%,#fffef0,#f0e8c8);box-shadow:0 0 24px 4px rgba(255,250,210,.35)}
.pgStar{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.9;animation:pgTw 2.4s ease-in-out infinite}
@keyframes pgTw{0%,100%{opacity:.9}50%{opacity:.25}}
.pgCloud{position:absolute;background:#fff;border-radius:99px;opacity:.93;animation:pgDrift 40s linear infinite}
@keyframes pgDrift{from{transform:translateX(-150px)}to{transform:translateX(540px)}}
#pgGround{position:absolute;left:-5%;right:-5%;bottom:-26px;height:120px;border-radius:50% 50% 0 0;transition:background 1.2s}
#pgSea{position:absolute;left:0;right:0;bottom:74px;height:46px;background:linear-gradient(#6db9e8,#8fd0f0);opacity:.95}
.pgSnow{position:absolute;color:#fff;font-size:12px;animation:pgSnowF linear infinite;pointer-events:none}
@keyframes pgSnowF{from{transform:translateY(-20px)}to{transform:translateY(360px)}}
#pgWallWin{position:absolute;top:26px;left:50%;transform:translateX(-50%);width:150px;height:108px;border-radius:14px;border:8px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.1);transition:background 1.2s}
#pgWallWin:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:6px;background:#fff;transform:translateX(-50%)}
#pgShadow{position:absolute;bottom:46px;width:150px;height:26px;background:radial-gradient(ellipse at center,rgba(40,60,40,.28),rgba(40,60,40,0) 70%);animation:pgShPulse 2.6s ease-in-out infinite;pointer-events:none}
@keyframes pgShPulse{0%,100%{transform:scale(1)}50%{transform:scale(.88)}}
#pgCharW{position:absolute;bottom:58px;transition:left 2.8s ease-in-out}
#pgCharFlip{position:relative;display:inline-block;animation:pgFloat 2.6s ease-in-out infinite;filter:drop-shadow(0 4px 6px rgba(30,60,30,.18))}#pgCharFlip.pgEgg{animation:pgFloatWob 3.2s ease-in-out infinite}#pgCharFlip.pgWalking{animation:pgWalkA .36s linear infinite}#pgChar{max-height:200px;max-width:230px;cursor:pointer;user-select:none;-webkit-user-drag:none;display:block;transition:opacity .1s linear}#pgCharX{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;transition:opacity .1s linear;pointer-events:none}#pgChar.pixel{image-rendering:pixelated}#pgPxBtn{border:none;background:#eef3ff;border-radius:10px;padding:5px 10px;font-size:15px;cursor:pointer;margin-left:6px}#pgLids{position:absolute;inset:0;pointer-events:none}.pgLid{position:absolute;transform:translate(-50%,-50%);border-radius:50%;opacity:0;transition:opacity .07s}.pgLid i{position:absolute;left:13%;right:13%;top:14%;bottom:30%;border-bottom:3.5px solid #5a241e;border-radius:0 0 100% 100%}
@keyframes pgFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
#pgCharFlip.pgBounce{animation:pgJump .55s ease}
@keyframes pgJump{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-34px) scale(1.06)}55%{transform:translateY(0) scale(.95,.9)}75%{transform:translateY(-10px) scale(1.02)}100%{transform:translateY(0) scale(1)}}@keyframes pgWalkA{0%{transform:translateY(0) rotate(3deg)}25%{transform:translateY(-6px) rotate(0deg)}50%{transform:translateY(0) rotate(-3deg)}75%{transform:translateY(-6px) rotate(0deg)}100%{transform:translateY(0) rotate(3deg)}}@keyframes pgFloatWob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
.pgHeart{position:absolute;font-size:22px;pointer-events:none;animation:pgRise 1.3s ease-out forwards;z-index:5}
@keyframes pgRise{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translateY(-110px) scale(1.25)}}
.pgConf{position:absolute;top:-12px;width:9px;height:13px;border-radius:3px;pointer-events:none;animation:pgConfFall 1.7s ease-in forwards;z-index:6}
@keyframes pgConfFall{to{transform:translateY(360px) rotate(540deg);opacity:.2}}
.pgOni{position:absolute;font-size:26px;pointer-events:none;z-index:4}
#pgFlash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .5s;z-index:7}
#pgMsg{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.95);border-radius:14px;padding:7px 16px;font-size:13px;font-weight:700;color:#3a6a45;box-shadow:0 2px 8px rgba(0,0,0,.1);white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;z-index:8;transition:opacity .8s}
#pgMgScore{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.95);border-radius:12px;padding:6px 12px;font-size:14px;font-weight:800;color:#e8762a;display:none;z-index:8}
#pgPanel{padding:12px 14px 16px;background:#fffef8}
#pgTopRow{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
#pgName{font-size:16px;font-weight:800;color:#2c3e50;cursor:pointer;text-align:left}
#pgName small{font-size:10px;color:#b0b8b0;font-weight:500;margin-left:4px}
#pgCoins{font-size:14px;font-weight:800;color:#c98a1e;background:#fff6dd;border-radius:12px;padding:5px 12px}
#pgStageL{font-size:12px;color:#7f8c8d;margin-top:2px;text-align:left}
#pgBarWrap{height:12px;background:#e8efe6;border-radius:8px;overflow:hidden;margin:10px 2px 4px}
#pgBar{height:100%;width:0%;background:linear-gradient(90deg,#ffd24d,#43b7b0);transition:width .5s;border-radius:8px}
#pgExp{font-size:11px;color:#95a5a6;margin-bottom:10px;text-align:left}
.pgBtn{border:none;border-radius:13px;padding:11px 0;font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.12);transition:transform .1s}
.pgBtn:active{transform:translateY(2px);box-shadow:none}
.pgBtn:disabled{background:#cfd8cf !important;box-shadow:none;cursor:default}
#pgBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#pgFeedBtn{background:linear-gradient(135deg,#ff9d5c,#f4783b)}
#pgPetBtn{background:linear-gradient(135deg,#5ec48f,#3da060)}
#pgGameBtn{background:linear-gradient(135deg,#6aa9f0,#3d77c9)}
#pgShopBtn{background:linear-gradient(135deg,#c98ae0,#9a5ec4)}
#pgNote{font-size:10.5px;color:#b6beb6;margin-top:9px;line-height:1.5}
#pgShop{display:none;background:#fbf6ff;border-top:2px dashed #e0d0ee;padding:12px 14px 16px}
#pgShop h4{margin:0 0 8px;font-size:14px;color:#7a4ea0}
.pgItem{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #ecdff5;border-radius:12px;padding:9px 12px;margin-bottom:8px}
.pgItem .nm{font-size:13px;font-weight:700;color:#444;text-align:left}
.pgItem .nm small{display:block;font-size:10px;color:#aaa;font-weight:500}
.pgItem button{border:none;border-radius:10px;padding:8px 14px;font-size:12px;font-weight:800;color:#fff;background:#9a5ec4;cursor:pointer;font-family:inherit}
.pgItem button.own{background:#5ec48f}
.pgItem button.sel{background:#bcd;cursor:default}
.pgItem button:disabled{background:#ccc}
.pgDrop{position:absolute;width:2px;height:14px;background:linear-gradient(rgba(160,200,240,0),rgba(120,170,230,.85));border-radius:2px;animation:pgRainF linear infinite;pointer-events:none}
@keyframes pgRainF{from{transform:translateY(-24px)}to{transform:translateY(360px)}}
#pgRainbow{position:absolute;top:84px;left:50%;transform:translateX(-50%);width:240px;height:120px;border-radius:240px 240px 0 0;border:9px solid #ff8d8d;border-bottom:none;box-shadow:0 0 0 9px #ffd24d inset,0 0 0 18px #8fd58f inset,0 0 0 27px #8fb8ff inset;opacity:.55;pointer-events:none}
</style>
